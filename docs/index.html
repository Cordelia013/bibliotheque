<div id="app">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500&display=swap');

  #app {
    --ink: #14161a; --paper: #f0ece4; --paper-deep: #e4ded2;
    --accent: #6d1f2c; --brass: #a8843f; --muted: #6b6459; --rule: #cec6b6;
    font-family: 'Jost', system-ui, sans-serif; color: var(--ink);
    background: var(--paper); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  #app * { box-sizing: border-box; }
  #app.night { --ink:#ddd6c9; --paper:#14161a; --paper-deep:#1c1f25; --brass:#c9a35c; --muted:#8c8578; --rule:#2c3038; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 0 22px 140px; }
  .view { display: none; } .view.on { display: block; }

  .bar { position: sticky; top: 0; z-index: 40; background: var(--paper);
    border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
  .bar .title { font-family: 'Cormorant Garamond', serif; font-size: 17px; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { background: none; border: 1px solid var(--rule); color: var(--ink); width: 36px; height: 36px;
    border-radius: 2px; cursor: pointer; font-size: 15px; display: grid; place-items: center;
    font-family: inherit; transition: border-color .15s, background .15s; flex: none; }
  .icon:hover { border-color: var(--brass); }
  .icon.on { background: var(--accent); border-color: var(--accent); color: #f0ece4; }
  .icon:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .progress { height: 2px; background: var(--rule); position: sticky; top: 61px; z-index: 39; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

  /* BIBLIOTHÈQUE */
  .libhead { font-family: 'Cormorant Garamond', serif; font-size: clamp(30px,8vw,42px);
    font-weight: 600; margin: 44px 0 4px; letter-spacing: -.01em; }
  .libsub { color: var(--muted); font-size: 13px; letter-spacing: .04em; margin-bottom: 26px; }
  .search { width: 100%; padding: 13px 15px; background: var(--paper-deep); border: 1px solid var(--rule);
    color: var(--ink); font-family: inherit; font-size: 15px; border-radius: 2px; }
  .search::placeholder { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 30px; }
  .chip { padding: 6px 13px; border: 1px solid var(--rule); background: none; color: var(--muted);
    font-family: inherit; font-size: 12px; letter-spacing: .04em; border-radius: 20px; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 26px 18px; }
  .card { background: none; border: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-family: inherit; }
  .cover { aspect-ratio: 2/3; border-radius: 2px; padding: 20px 16px; display: flex; flex-direction: column;
    justify-content: space-between; color: #f2ede3; position: relative; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.22); transition: transform .18s; }
  .card:hover .cover { transform: translateY(-3px); }
  .cover svg { width:100%; height:100%; display:block; }
  .cover::after { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:rgba(0,0,0,.28); }
  .cover .ct { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.18; font-weight: 600; }
  .cover .ca { font-size: 10px; letter-spacing: .16em; opacity: .72; }
  .cmeta { margin-top: 10px; }
  .cmeta b { display: block; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 16px; line-height: 1.25; }
  .cbar { height: 3px; background: var(--rule); margin-top: 8px; }
  .cbar i { display: block; height: 100%; background: var(--accent); }
  .cpct { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin-top: 5px; }

  /* PAGE DE GARDE */
  .gcover { max-width: 210px; margin: 40px auto 30px; }
  .gtitle { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px,7vw,38px); font-weight: 600;
    text-align: center; line-height: 1.14; margin: 0 0 8px; }
  .gauth { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .16em; margin-bottom: 22px; }
  .gchips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 28px; }
  .gchips span { padding: 5px 12px; border: 1px solid var(--rule); border-radius: 20px; font-size: 11px;
    letter-spacing: .05em; color: var(--muted); }
  .gres { font-family: 'Cormorant Garamond', serif; font-size: 18px; line-height: 1.68; text-align: center;
    color: var(--ink); margin: 0 auto 34px; max-width: 34em; }
  .gstat { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 20px 0; margin-bottom: 26px; }
  .gpct { font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 700; line-height: 1; color: var(--accent); }
  .glab { font-size: 11px; letter-spacing: .14em; color: var(--muted); margin-top: 6px; }
  .gbar { height: 4px; background: var(--rule); margin-top: 16px; }
  .gbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .primary { width: 100%; padding: 16px; background: var(--accent); border: none; color: #f2ede3;
    font-family: inherit; font-size: 14px; letter-spacing: .06em; cursor: pointer; border-radius: 2px; }
  .ghost { width: 100%; padding: 14px; background: none; border: 1px solid var(--rule); color: var(--ink);
    font-family: inherit; font-size: 13px; letter-spacing: .05em; cursor: pointer; border-radius: 2px; margin-top: 10px; }

  /* LECTURE */
  .chapnum { font-weight: 300; font-size: 12px; letter-spacing: .22em; color: var(--muted); margin: 58px 0 10px; }
  h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(28px,7vw,38px);
    line-height: 1.12; margin: 0 0 6px; }
  .pov { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--accent); font-size: 17px; margin-bottom: 32px; }
  .body p { font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.72; margin: 0 0 1.15em; max-width: 34em; }
  .body p:first-of-type::first-letter { font-size: 3.1em; float: left; line-height: .82;
    padding: .06em .12em 0 0; color: var(--accent); font-weight: 600; }
  .endmark { margin: 50px 0 0; padding-top: 22px; border-top: 1px solid var(--rule); }
  .navrow { display: flex; gap: 10px; }
  .navbtn { flex: 1; padding: 14px 12px; background: none; cursor: pointer; border: 1px solid var(--rule);
    color: var(--ink); font-family: inherit; font-size: 13px; letter-spacing: .04em; border-radius: 2px; }
  .navbtn:hover:not(:disabled) { border-color: var(--brass); }
  .navbtn:disabled { opacity: .35; cursor: default; }

  /* TIROIR */
  .scrim { position: fixed; inset: 0; background: rgba(10,10,12,.55); z-index: 50; opacity: 0;
    pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(370px,88vw); background: var(--paper-deep);
    z-index: 51; overflow-y: auto; transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1);
    border-left: 1px solid var(--rule); padding: 22px 20px 60px; }
  .drawer.open { transform: none; }
  .dhead { font-family: 'Cormorant Garamond', serif; font-size: 21px; margin: 0 0 4px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0 18px; }
  .tab { flex: 1; padding: 9px; background: none; border: 1px solid var(--rule); color: var(--muted);
    font-family: inherit; font-size: 12px; letter-spacing: .05em; cursor: pointer; border-radius: 2px; }
  .tab.on { color: var(--ink); border-color: var(--ink); }
  .chapline { display: block; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--rule); padding: 13px 0; color: var(--ink);
    font-family: 'Cormorant Garamond', serif; font-size: 17px; cursor: pointer; position: relative; }
  .chapline em { font-style: normal; color: var(--muted); font-family: 'Jost'; font-size: 11px;
    letter-spacing: .13em; display: block; margin-bottom: 3px; }
  .chapline.current { color: var(--accent); }
  .chapline.current::before { content: '▸'; position: absolute; left: -14px; }
  .bmrow { display: block; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--rule); padding: 13px 0; color: var(--ink);
    font-family: 'Cormorant Garamond', serif; font-size: 16px; cursor: pointer; line-height: 1.5; }
  .bmrow small { font-family: 'Jost'; font-size: 11px; letter-spacing: .09em; color: var(--muted); display: block; margin-bottom: 4px; }
  .bmrow span { color: var(--muted); font-style: italic; font-size: 15px; }
  .del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px;
    font-family: 'Jost'; letter-spacing: .07em; padding: 4px 0 0; }
  .del:hover { color: var(--accent); }
  .empty { color: var(--muted); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; padding: 22px 0; }
  .note { font-size: 11px; color: var(--muted); margin-top: 26px; line-height: 1.6; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%,20px); background: var(--ink);
    color: var(--paper); padding: 11px 20px; font-size: 13px; border-radius: 2px; z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%,0); }
  @media (prefers-reduced-motion: reduce) { #app * { transition: none !important; } }
  @media (max-width: 520px) { .body p { font-size: 18.5px; } }
</style>

<div class="bar">
  <button class="icon" id="backBtn" title="Retour" style="display:none">‹</button>
  <div class="title" id="barTitle">Bibliothèque</div>
  <button class="icon" id="bmBtn" title="Marque-page" style="display:none">✦</button>
  <button class="icon" id="nightBtn" title="Mode nuit">◐</button>
  <button class="icon" id="menuBtn" title="Sommaire" style="display:none">☰</button>
</div>
<div class="progress"><i id="progBar"></i></div>

<!-- BIBLIOTHÈQUE -->
<section class="view on" id="vLib"><div class="wrap">
  <h1 class="libhead">Bibliothèque</h1>
  <p class="libsub" id="libCount"></p>
  <input class="search" id="search" type="search" placeholder="Rechercher par titre, genre ou auteur…">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="noRes" style="display:none">Aucun livre ne correspond à cette recherche.</p>
</div></section>

<!-- PAGE DE GARDE -->
<section class="view" id="vCover"><div class="wrap">
  <div class="gcover" id="gCover"></div>
  <h1 class="gtitle" id="gTitle"></h1>
  <p class="gauth" id="gAuth"></p>
  <div class="gchips" id="gChips"></div>
  <p class="gres" id="gRes"></p>
  <div class="gstat">
    <div class="gpct" id="gPct">0 %</div>
    <div class="glab" id="gLab"></div>
    <div class="gbar"><i id="gBar"></i></div>
  </div>
  <button class="primary" id="readBtn">Commencer la lecture</button>
  <button class="ghost" id="tocBtn">Sommaire et marque-pages</button>
  <button class="ghost" id="resetBtn">Réinitialiser ma progression</button>
</div></section>

<!-- LECTURE -->
<section class="view" id="vRead"><div class="wrap">
  <div class="chapnum" id="chapNum"></div>
  <h2 id="chapTitle"></h2>
  <div class="pov" id="chapPov"></div>
  <div class="body" id="chapBody"></div>
  <div class="endmark"><div class="navrow">
    <button class="navbtn" id="prevBtn">← Précédent</button>
    <button class="navbtn" id="nextBtn">Suivant →</button>
  </div></div>
</div></section>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><span id="dTitle">Sommaire</span><button class="icon" id="closeBtn">✕</button></div>
  <div class="tabs">
    <button class="tab on" id="tabChaps">Chapitres</button>
    <button class="tab" id="tabBms">Marque-pages</button>
  </div>
  <div id="paneChaps"></div>
  <div id="paneBms" style="display:none"></div>
  <p class="note" id="statusNote"></p>
</aside>
<div class="toast" id="toast"></div>

<div id="couvertures" hidden><template class="couv" data-livre="castellano"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Couverture : Le Prix du Silence, Don Castellano">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0d10"/>
      <stop offset=".5" stop-color="#2a1216"/>

    <radialGradient id="lampe" cx=".5" cy=".28" r=".6">
      <stop offset="0" stop-color="#e8c98f" stop-opacity=".38"/>

    <linearGradient id="nappe" x1="0" y1="0" x2="0" y2="1">

    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">

    </linearGradient>
    <clipPath id="cadreC"><rect width="600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#cadreC)">
    <rect width="600" height="900" fill="url(#fond)"/>

    <!-- fenêtres hautes, façade de palazzo en arrière-plan, très sombre -->
    <g opacity=".28" fill="#000">
      <rect x="60" y="0" width="60" height="230" rx="30"/>
      <rect x="270" y="0" width="60" height="230" rx="30"/>

    <!-- ombre portée douce -->
    <ellipse cx="300" cy="565" rx="330" ry="14" fill="#000" opacity=".18"/>

    <!-- assiette centrale -->
    <ellipse cx="300" cy="660" rx="86" ry="30" fill="#efe7d8"/>

</svg></template><template class="couv" data-livre="lune"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Couverture : La Part de Lune">
  <defs>

  <g clip-path="url(#cadre)">
    <!-- ciel -->
    <rect width="600" height="900" fill="url(#ciel)"/>

    <!-- étoiles -->
    <g fill="#f4e9c8">
      <circle cx="62" cy="88" r="1.2" opacity=".7"/><circle cx="141" cy="52" r=".9" opacity=".5"/>
      <circle cx="503" cy="70" r="1.4" opacity=".8"/><circle cx="548" cy="132" r=".8" opacity=".5"/>

    <!-- halo -->

    <!-- lune : entière, avec sa "part" manquante (éclipse en croissant fin) -->

<script>
const BOOKS = [{"id": "castellano", "titre": "Le Prix du Silence, Don Castellano", "auteur": "Écrit avec Claude", "genres": ["Romance mafieuse", "Vengeance", "Drame", "Suspense"], "annee": "2026", "couleur": "#6d1f2c", "statut": "Terminé", "resume": "Livia Sarti est la consigliere de la famille Castellano et, depuis trois ans, l'épouse secrète de son Don. Une balle sur le quai nord, un appel auquel il répond sans savoir que c'est elle, et tout s'écroule. Elle rend les clés, demande le divorce devant vingt-deux couverts, et s'allie à la famille rivale. Sept ans pour comprendre qu'on n'attend pas qu'on écrive votre nom quelque part : on l'écrit.", "chapitres": [{"n": 1, "t": "La voix au téléphone", "pov": "Livia", "p": ["J'étais la consigliere de la famille Castellano. Son cerveau, ses comptes, sa mémoire. Personne, pas même mon mari, ne savait à quel point l'empire tenait debout parce que je le tenais, moi, à bout de bras.", "Et aujourd'hui, je rendais les clés.", "Les registres des sept sociétés-écrans que je gérais depuis six ans étaient posés en piles nettes sur le bureau, chacune étiquetée de mon écriture méticuleuse. Mon assistant, Enzo, les regardait comme s'il s'agissait d'un cadavre.", "— Tu ne peux pas partir comme ça, Livia. Tu es la famille, autant que n'importe quel Castellano de sang.", "Je refermai le dernier dossier avec un calme que je ne ressentais pas.", "— Justement. Je n'en suis pas.", "Personne ne connaissait mon secret : cela faisait trois ans que j'étais l'épouse cachée de Salvatore Castellano, le Don. Un mariage scellé dans une chapelle vide, à minuit, parce qu'il craignait qu'un mariage officiel ne fasse de moi une cible. C'est ce qu'il m'avait dit. J'avais choisi de le croire, parce que croire était plus facile que douter d'un homme qu'on aime depuis l'adolescence.", "J'avais cru que mon intelligence, ma loyauté, mon corps, mon silence — que tout cela finirait par suffire à me faire aimer en retour, ouvertement, au grand jour.", "Je m'étais trompée.", "Trois mois plus tôt, une embuscade sur le port m'avait laissée avec une balle logée sous la clavicule. J'avais perdu tant de sang que le médecin de garde avait refusé de m'opérer sans l'aval direct de Salvatore — protocole de sécurité de la famille, un protocole que j'avais moi-même rédigé, des années auparavant, sans jamais imaginer qu'il se retournerait contre moi.", "J'avais appelé quatorze fois.", "À la quinzième, il avait décroché.", "Je n'avais pas eu le temps de parler. J'avais entendu une voix de femme, douce, essoufflée, tout près du combiné :", "— Sauveur, on n'a pas encore coupé mon gâteau. Viens, ils m'attendent tous.", "Et la voix de mon mari, chaude, rieuse, qui n'avait jamais été aussi chaude ni aussi rieuse pour moi :", "— J'arrive, mon cœur. Une minute.", "Il avait raccroché sans même savoir que c'était moi.", "Le médecin avait fini par m'opérer sans autorisation, en enfreignant les règles pour la première fois de sa carrière — pour sauver la femme qu'il ne savait pas être celle du Don. J'avais survécu. Quelque chose en moi, non.", "— Livia.", "La voix d'Enzo me ramena au présent. Il regardait le dernier dossier que je venais de fermer : le contrat de divorce, déjà signé de ma main, en attente de la signature de Salvatore.", "— Il ne sait même pas encore, n'est-ce pas ?", "— Il le saura ce soir. Au dîner de famille. Devant tout le monde.", "— C'est du suicide.", "Je pris mon sac, mon manteau, et pour la première fois en six ans, je marchai vers la sortie du bureau des Castellano sans me retourner.", "— Non, Enzo. C'est la seule chose qui me reste à faire avec dignité.", "Dehors, une voiture noire m'attendait déjà — pas une des nôtres. Un homme en descendit, grand, le visage familier malgré les années : Damiano Rocchi, l'héritier d'une famille rivale que j'avais combattue par procuration pendant des années sans jamais l'avoir rencontré en personne.", "— Madame Castellano, dit-il avec un sourire qui n'avait rien d'hostile. Ou devrais-je dire, bientôt, madame tout court.", "— Comment savez-vous—", "— Je sais beaucoup de choses sur les Castellano, coupa-t-il doucement. Assez pour savoir qu'ils sont sur le point de perdre la seule personne qui les a maintenus en vie ces six dernières années.", "Il ouvrit la portière.", "— Montez. Le dîner de ce soir va être intéressant, et je pense que vous préférerez ne pas y arriver seule.", "Je restai un instant immobile, le vent d'automne s'engouffrant dans mon manteau ouvert, la cicatrice sous ma clavicule qui tirait encore un peu.", "Puis je montai."]}, {"n": 2, "t": "Le dîner", "pov": "Salvatore", "p": ["La table des Castellano comptait vingt-deux couverts, et le vingt-deuxième était vide.", "Je le remarquai à peine. Livia arrivait toujours en retard aux dîners de famille — elle finissait un dossier, vérifiait un transfert, réglait un problème dont je n'entendrais jamais parler parce qu'elle l'aurait réglé avant qu'il n'en devienne un. C'était ainsi depuis six ans. Je m'étais habitué à ce que le monde tienne debout sans que j'aie besoin de comprendre comment.", "À ma droite, Serena posa sa main sur mon bras.", "— Tu es tendu.", "— Le port, mentis-je.", "Elle sourit, de ce sourire que j'avais fini par confondre avec du repos. Serena ne me demandait rien. Elle ne vérifiait rien. Elle ne me regardait pas comme Livia me regardait — avec cette attention qui donnait l'impression d'être lu jusqu'à la dernière ligne. Avec Serena, je pouvais être un homme ordinaire pendant deux heures. Je m'étais dit que c'était cela, l'amour. J'avais tort, mais je ne le savais pas encore.", "La porte s'ouvrit.", "Livia entra sans manteau, en noir, les cheveux relevés, une chemise cartonnée à la main. Elle ne regarda personne. Elle contourna la table, passa derrière ma mère, derrière mon oncle Bruno, derrière mes cousins, et vint se placer face à moi, de l'autre côté de la nappe blanche.", "— Tu es en retard, dis-je.", "— Non. Je suis en avance. Pour la première fois.", "Elle posa la chemise entre mon assiette et celle de Serena.", "Je sus, avant même de l'ouvrir. Quelque chose dans la façon dont elle se tenait — pas droite, finie. Comme une lame qu'on a rangée.", "Ma mère fut la première à parler.", "— Qu'est-ce que c'est que cette mise en scène, Livia ?", "— Une formalité, madame Castellano. Votre fils et moi sommes mariés depuis trois ans. Il va falloir que quelqu'un le sache pour que nous puissions cesser de l'être.", "Le silence qui suivit n'était pas un silence. C'était vingt personnes qui cessaient de respirer en même temps.", "Mon oncle Bruno reposa son verre si lentement que je l'entendis toucher la nappe.", "— Salvatore, dit-il. Dis-lui qu'elle plaisante.", "Je regardai Livia. Elle soutint mon regard sans une seconde d'hésitation, et je compris que c'était la dernière fois qu'elle me faisait ce cadeau.", "— Elle ne plaisante pas, dis-je.", "À ma droite, la main de Serena glissa de mon bras.", "— Depuis trois ans ? murmura-t-elle.", "Livia tourna enfin la tête vers elle. C'était la première fois qu'elles se trouvaient dans la même pièce en sachant qui elles étaient l'une pour l'autre. Je m'attendais à de la haine. Il n'y en eut pas. Il y eut quelque chose de bien plus terrible : de la reconnaissance.", "— Trois ans, un mois et douze jours, dit Livia. Vous, c'est depuis quand ?", "Serena ne répondit pas.", "— Ce n'est pas grave, poursuivit Livia. Je le sais. Je sais tout ce qui concerne cette famille. C'est ce pour quoi on me paie. C'est ce pour quoi on m'a épousée, je crois.", "— Livia—", "— Signe.", "Elle avait dit cela sans élever la voix. J'ouvris la chemise. Le contrat était impeccable — je n'en attendais pas moins d'elle. Répartition des biens : elle ne demandait rien. Pas la maison du lac, pas les parts, pas même la voiture. Une seule clause en gras, en bas de la deuxième page : renonciation définitive à toute fonction au sein des entreprises de la famille Castellano.", "Elle ne quittait pas seulement mon lit. Elle quittait la maison. Tout entière.", "— Non, dis-je.", "Le mot sortit avant que j'aie décidé de le dire.", "Livia ne cilla pas.", "— Tu n'as pas le choix.", "— J'ai toujours le choix. Je suis le Don.", "— Tu es le Don parce que je t'ai fait Don.", "Personne autour de cette table ne pouvait la contredire. Pas Bruno, qui savait que c'était Livia qui avait négocié la trêve avec les Rocchi après la mort de mon père. Pas ma mère, qui savait qui avait sauvé la villa de la saisie. Pas moi.", "Je refermai la chemise. Je la repoussai vers elle.", "— Tu reprends le travail lundi. Nous parlerons du reste en privé.", "— Il n'y a plus de reste.", "Elle reprit la chemise. Elle la glissa sous son bras, comme un dossier parmi d'autres, et fit demi-tour.", "— Livia.", "Elle s'arrêta, sans se retourner.", "— Où étais-tu, le soir du dix-sept mars ?", "C'était la date de l'embuscade du port. Je le savais parce que je l'avais lue dans un rapport, trois jours après. J'avais été trop occupé ce soir-là pour lire les rapports. Ce fut une bouffée d'air froid, soudaine, qui me fit comprendre que je n'avais jamais posé la question à la seule personne qui pouvait y répondre.", "Elle se retourna.", "Et elle sourit. Un sourire que je ne lui connaissais pas — sans amertume, presque tendre, comme on sourit à quelqu'un qui vient enfin de comprendre une évidence, beaucoup trop tard.", "— Toi, tu le sais, dit-elle. Tu as décroché.", "Elle sortit.", "La porte se referma sur elle, et Serena, à côté de moi, demanda tout bas ce que le dix-sept mars voulait dire. Je ne répondis pas. Je regardais la chaise vide, la vingt-deuxième, et je réalisai une chose que j'aurais dû réaliser depuis longtemps :", "Ce n'était pas un dîner de famille. C'était la dernière fois que j'aurais eu l'occasion de la retenir.", "Et dehors, sous les fenêtres, une voiture noire que je ne connaissais pas démarrait déjà."]}, {"n": 3, "t": "Ce qu'on ne dit pas à ses parents", "pov": "Livia", "p": ["La voiture roula vingt minutes en silence avant que Damiano Rocchi ne prenne la parole.", "— Vous n'avez pas pleuré.", "— Vous êtes déçu ?", "— Impressionné. Ce n'est pas la même chose.", "Je regardais défiler les entrepôts du quai nord, ceux dont je connaissais les baux, les hypothèques et les fausses écritures par cœur. Dans trois jours, je ne saurais plus rien. Dans trois mois, j'aurais oublié les chiffres. C'était ce que je m'étais promis.", "— Arrêtez-vous là.", "— Nous ne sommes nulle part.", "— C'est exactement là que je veux aller.", "Il eut la délicatesse de ne pas insister. La voiture s'arrêta à l'angle d'une rue résidentielle, loin de tout, à trois cents mètres de la maison où j'avais grandi. Je posai la main sur la poignée.", "— Livia.", "Première fois qu'il utilisait mon prénom seul.", "— Vous croyez fermer une porte, dit-il. Vous êtes en train d'en ouvrir une autre, et vous ne savez pas encore ce qu'il y a derrière.", "— C'est une menace ?", "— C'est une invitation. Elle tiendra tant que vous n'aurez pas décidé.", "Je sortis sans répondre.", "Ma mère ouvrit avant que j'aie frappé. Elle avait dû me voir remonter l'allée depuis la fenêtre de la cuisine, comme elle le faisait quand j'avais quinze ans et que je rentrais trop tard.", "— Tu as maigri.", "— Bonsoir, maman.", "Mon père était dans le salon, la télévision éteinte, les mains à plat sur les genoux. Il avait l'air d'un homme qui attend une nouvelle depuis longtemps et qui a fini par oublier laquelle.", "Je posai mon sac. Je restai debout.", "— Je divorce.", "Ma mère porta la main à sa bouche. Mon père, lui, ne bougea pas d'un millimètre.", "— De qui ? dit-il.", "Et dans sa voix, il n'y avait aucune surprise. Seulement une fatigue immense, celle d'un homme qui va devoir entendre à voix haute ce qu'il sait déjà.", "— De Salvatore Castellano.", "Ma mère s'assit. Lentement, comme si ses jambes venaient de la lâcher en deux temps.", "— Depuis combien de temps ? demanda mon père.", "— Trois ans.", "— Et tu ne nous as rien dit.", "— Il me l'a demandé. Pour ma sécurité, disait-il.", "Mon père ferma les yeux. Quand il les rouvrit, quelque chose s'y était durci — quelque chose que je n'avais vu qu'une seule fois, l'hiver de mes onze ans, la nuit où deux hommes étaient venus frapper à cette porte et où ma mère m'avait enfermée dans la salle de bains.", "— Ta sécurité, répéta-t-il.", "Puis il se leva et vint vers moi. Et avant que je puisse reculer, il écarta le col de ma chemise.", "La cicatrice partait de la clavicule et descendait en biais, épaisse, mal refermée — la trace d'une opération faite dans l'urgence par un homme qui tremblait.", "Ma mère émit un son que je n'avais jamais entendu sortir d'elle.", "— Qui a fait ça ? dit mon père.", "— Une balle, papa. Ça arrive dans ce métier.", "— Ce n'est pas la balle que je regarde. C'est la cicatrice. Aucun chirurgien de famille ne recoud comme ça. Ça, c'est de la couture d'urgence, sans matériel, par quelqu'un qui n'avait pas l'autorisation d'opérer.", "Je ne dis rien.", "Mon père hocha la tête, très lentement, et retourna s'asseoir.", "— Il n'a pas décroché, dit-il. C'est ça ?", "— Il a décroché, corrigeai-je. C'est pire.", "Cette nuit-là, je dormis dans mon lit d'adolescente, sous une étagère de livres que je n'avais pas relus depuis quinze ans. Vers trois heures du matin, j'entendis mon père descendre à la cave.", "Il y resta jusqu'à l'aube.", "Et quand je descendis au petit-déjeuner, il y avait sur la table de la cuisine une boîte en fer que je n'avais jamais vue, et mon père me dit, sans lever les yeux de son café :", "— Assieds-toi. Il y a des choses sur cette famille que ta mère n'a jamais voulu que tu saches."]}, {"n": 4, "t": "Le trou dans les comptes", "pov": "Salvatore", "p": ["Le lundi, à neuf heures, le bureau de Livia était vide.", "À neuf heures quarante, Bruno entra dans le mien sans frapper, ce qu'il n'avait pas fait depuis la mort de mon père.", "— On a un problème.", "— Elle reviendra.", "— Ce n'est pas d'elle que je parle. Enfin si. C'est d'elle que je parle, mais pas comme tu crois.", "Il posa un dossier devant moi. Des relevés. Sept sociétés, sept colonnes, sept totaux.", "— Regarde la colonne des flux sortants.", "Je regardai. Je ne comprenais pas. Ce fut la première chose humiliante de cette journée : je regardais les comptes de ma propre famille et je ne comprenais pas ce que je voyais.", "— Explique.", "— Chaque société verse une commission mensuelle à une huitième structure. Depuis six ans. Toujours le même jour, toujours le même pourcentage.", "— Elle nous volait ?", "Bruno me regarda comme on regarde un enfant qui vient de dire une énormité.", "— Non, Salvatore. Elle nous protégeait. Cette huitième structure, c'est une caisse de réserve. Elle a couvert la saisie de la villa en 2021. Elle a payé les avocats de ton cousin Nino. Elle a racheté la dette du port avant que les Rocchi ne mettent la main dessus. Trois fois, cette famille a failli tomber, et trois fois, personne n'a rien vu, parce qu'elle était déjà debout à quatre heures du matin en train de tout ramasser.", "Je restai silencieux.", "— Et maintenant ? demandai-je enfin.", "— Maintenant, les virements se sont arrêtés vendredi soir. Parce que la seule signataire de cette caisse, c'est elle.", "Je passai la journée dans son bureau.", "Je crois que je cherchais des chiffres. En réalité, je cherchais elle. Une trace. Un mot. Un carnet.", "Il n'y avait rien. Pas une photo, pas un objet personnel, pas une écriture en marge. Six ans dans cette pièce et elle n'y avait laissé aucune preuve de son passage, comme quelqu'un qui savait, depuis le premier jour, qu'il faudrait pouvoir partir vite.", "Dans le tiroir du bas, une seule chose : un flacon de médicaments contre la douleur, prescrit le 19 mars, presque vide.", "Le 19 mars. Deux jours après le port.", "Je restai longtemps avec ce flacon dans la main.", "Je me souvins, enfin, de ce que j'avais fait ce soir-là. Le gâteau. Les bougies. La main de Serena sur la mienne pour couper la première part, et mon téléphone qui vibrait encore et encore sur la desserte, et moi qui l'avais retourné face contre le bois parce que « ça peut attendre demain ».", "Quatorze appels.", "Je posai le flacon. Je sortis du bureau. Dans le couloir, je croisai Enzo, qui détourna les yeux.", "— Enzo.", "— Don Castellano.", "— Tu lui parles encore ?", "Un silence d'une seconde de trop.", "— Non, monsieur.", "Il mentait. Je le sus immédiatement, et je décidai immédiatement de ne pas le lui dire, parce que cela signifiait que j'avais encore un fil qui menait jusqu'à elle.", "Ce que je ne savais pas, c'est qu'à cette seconde précise, à l'autre bout de la ville, Livia venait de comprendre exactement la même chose au sujet d'Enzo.", "Et qu'elle avait pris une décision différente de la mienne."]}, {"n": 5, "t": "Une offre, pas une supplique", "pov": "Livia", "p": ["Il vint le mercredi. Sans escorte, ce qui était soit un aveu, soit une imprudence.", "Ma mère lui ouvrit et resta plantée dans l'entrée, les bras croisés, sans le faire entrer plus loin que le paillasson. J'aurais pu l'embrasser pour ça.", "— Je voudrais parler à ma fem— à Livia.", "— Ma fille est dans le jardin. Vous avez cinq minutes, et je compterai.", "Il me trouva sous le figuier, en train de tailler ce que mon père n'avait plus la force de tailler. Je ne levai pas la tête.", "— Tu as l'air fatigué, dis-je.", "— Les comptes.", "— Colonne de gauche, ligne quatorze. Tu trouveras le mot de passe dans une enveloppe chez le notaire Vasari. Je l'ai déposée vendredi. Tu aurais pu m'éviter le déplacement en ouvrant ton courrier.", "Il encaissa.", "— Reviens.", "— Non.", "— Livia, je ne te demande pas de revenir dans mon lit. Je te demande de revenir au travail. Nomme ton prix. Le double. Le triple. Un siège au conseil. Ton nom sur les statuts, officiellement, ce que personne n'a jamais eu dans cette famille.", "Je posai le sécateur.", "Et je réalisai, à cet instant précis, que c'était la plus belle offre qu'il m'ait jamais faite en six ans. Un siège. Mon nom. Reconnue, enfin — mais comme employée. Jamais comme épouse.", "Il m'offrait tout ce que j'avais mérité et rien de ce que j'avais demandé.", "— Tu sais ce qui est cruel, Salvatore ? Ce n'est pas Serena. Serena n'est qu'une femme, et tu n'es pas le premier homme à en préférer une autre. Ce qui est cruel, c'est que tu es venu jusqu'ici, tu as répété ton discours dans la voiture, tu as trouvé le courage de sonner chez mes parents — et que dans tout ce que tu as préparé, il n'y a pas une seule phrase où tu parles de moi.", "— Ce n'est pas vrai.", "— Alors dis-la. Maintenant. Une phrase.", "Il ouvrit la bouche.", "Je vis le calcul passer dans ses yeux — ce même calcul que je lui avais appris à faire, six ans plus tôt, quand je lui avais dit qu'un Don ne dit jamais ce qu'il ressent avant de savoir ce que ça lui coûtera.", "Il la referma.", "— Voilà, dis-je.", "— Le divorce, dit-il d'une voix rauque. Je ne signerai pas.", "— Je sais.", "— Alors tu restes ma femme.", "— Non. Je reste ton problème. Ce n'est pas pareil, et tu vas l'apprendre.", "Il partit. Ma mère referma la porte derrière lui avec une lenteur théâtrale dont je la savais capable depuis l'enfance.", "Le soir même, mon téléphone sonna. Un numéro que je ne connaissais pas.", "— Vous avez refusé son offre, dit la voix de Damiano Rocchi.", "— Vous me faites suivre.", "— Je vous attends. Il y a une différence, mais je comprends qu'elle soit mince vue d'où vous êtes.", "— Que voulez-vous, Damiano ?", "— Rien. Mon père, si. Il souhaite vous rencontrer. Samedi, à la maison du lac.", "Je faillis raccrocher.", "— Livia, ajouta-t-il, et sa voix perdit d'un coup son vernis d'amusement. Avant de refuser, demandez à votre père ce qu'il a fait en 2003. Demandez-lui pourquoi le nom Rocchi n'a jamais été prononcé dans votre maison.", "Il raccrocha.", "Dans la cuisine, la lumière était encore allumée. Mon père était assis devant la boîte en fer ouverte, celle qu'il avait remontée de la cave trois jours plus tôt et dont il n'avait finalement rien voulu me dire.", "Il leva les yeux vers moi.", "Et cette fois, il ne les baissa pas."]}, {"n": 6, "t": "La boîte en fer", "pov": "Livia", "p": ["Il y avait dans cette boîte trois choses : un revolver huilé, une photographie, et une lettre jamais envoyée.", "Mon père sortit la photographie en premier. Quatre hommes jeunes, en costume mal coupé, devant un restaurant que je ne reconnus pas. Il posa le doigt sur le deuxième en partant de la gauche.", "— Moi.", "Puis sur le troisième.", "— Matteo Rocchi. Le père de celui qui t'appelle.", "Je m'assis en face de lui.", "— Tu le connaissais.", "— Je lui devais la vie. Et il me devait la sienne. On appelait ça une dette croisée, à l'époque. Ça voulait dire qu'on ne pouvait plus se faire de mal sans se mutiler soi-même.", "— Qu'est-ce qui s'est passé en 2003 ?", "Mon père tourna la tasse de café entre ses mains. Il avait soixante-huit ans et j'eus soudain l'impression d'en voir quatre-vingts.", "— En 2003, une troisième famille est arrivée en ville. Les Ferraro. Ils ont voulu le port. Matteo et moi, on a refusé de le leur céder. Alors ils ont fait ce que font les gens qui n'ont pas d'honneur : ils ont pris nos enfants.", "Le sang me quitta le visage.", "— Pas toi, dit-il aussitôt. Toi, tu étais à l'école ce jour-là. Ils ont pris le fils de Matteo. Le grand frère de ton Damiano. Il avait dix-sept ans.", "— Et ?", "— Et j'ai eu le choix, Livia. Ils m'ont laissé le choix. Soit je leur donnais le port et ils rendaient le garçon. Soit je gardais le port.", "Il posa la photographie face contre la table.", "— J'ai gardé le port.", "Le silence dans cette cuisine dura très longtemps.", "— Pourquoi ? demandai-je, et ma voix ne ressemblait pas à la mienne.", "— Parce qu'ils m'avaient dit que si je cédais, tu serais la suivante. Parce qu'un homme qui cède une fois cède toujours. Parce que j'ai calculé, comme un lâche, qu'un fils qui n'était pas le mien pesait moins qu'une fille qui l'était.", "Il leva enfin les yeux.", "— Matteo Rocchi n'a jamais prononcé mon nom depuis. Il ne s'est pas vengé. Il a fait pire : il a attendu vingt-trois ans que la vie s'en charge. Et la vie s'en est chargée, Livia. Regarde-toi. Regarde ta cicatrice. Regarde ce que tu es allée chercher chez les Castellano, qui sont les alliés historiques des Ferraro.", "Je me levai si brutalement que la chaise bascula.", "— Des Ferraro ? Salvatore travaille avec les Ferraro ?", "— Son père, oui. Lui, je ne sais pas. Mais ce que je sais, c'est que la balle du dix-sept mars ne venait pas d'un règlement de comptes ordinaire.", "Il poussa la lettre vers moi.", "— Lis ça quand je serai couché. Je n'ai pas le courage d'être dans la pièce.", "Je lus la lettre à deux heures du matin, dans la salle de bains, assise par terre contre la baignoire.", "Elle était datée du 14 mars — trois jours avant l'embuscade du port. Elle n'était pas écrite par mon père.", "Elle était signée Matteo Rocchi, et elle ne contenait qu'une seule phrase :", "« Ta fille est sur une liste. Sors-la de cette maison. »", "Mon père l'avait reçue. Mon père ne m'avait rien dit.", "Et trois jours plus tard, j'avais pris une balle sur le quai nord."]}, {"n": 7, "t": "Annonce", "pov": "Salvatore", "p": ["Ma mère organisa la conférence de presse sans me prévenir.", "Je l'appris en descendant le grand escalier, un jeudi matin, et en trouvant le hall plein de traiteurs, de fleuristes, et de deux journalistes de la presse économique qu'on avait toujours su acheter.", "— Qu'est-ce que c'est que ça ?", "Ma mère ajustait une composition de lys blancs.", "— Une famille sans avenir est une famille qu'on attaque. En ce moment, cette maison n'a ni comptable, ni épouse, ni héritier. Il faut au moins qu'elle ait une fiancée.", "— Tu n'as pas le droit.", "— J'ai le droit de sauver ce que ton père m'a laissé. Serena a accepté. Sa famille aussi.", "— Je suis marié.", "— Personne ne le sait, dit ma mère avec une douceur effrayante. Et c'est toi qui as voulu qu'il en soit ainsi. Tu ne peux pas réclamer aujourd'hui les avantages d'un secret que tu as imposé pendant trois ans.", "Je cherchai une réponse. Je n'en trouvai aucune qui ne me condamne pas.", "Serena descendit à onze heures, en bleu pâle. Elle était très belle et elle avait pleuré — je le vis à la façon dont elle tenait sa mâchoire.", "— Tu n'es pas obligée, lui dis-je à voix basse.", "— Toi non plus.", "Nous restâmes un instant face à face, deux personnes que tout le monde regardait et qui savaient toutes les deux qu'elles étaient à la mauvaise place.", "— Salvatore. Est-ce que tu vas signer ces papiers ?", "— Non.", "— Alors je suis quoi, exactement ?", "La réponse était : une façade. Une garantie. Un communiqué de presse avec un visage.", "Je ne la dis pas. Je lui pris la main, et nous descendîmes les marches ensemble, et les flashs crépitèrent, et le lendemain matin la photo était partout.", "Ce que je ne sus que plus tard, c'est que Livia l'avait vue dans un kiosque, en achetant du pain pour sa mère, à sept heures dix du matin.", "Ce qu'elle fit à sept heures onze, elle ne me l'a jamais raconté.", "Ce qu'elle fit à sept heures quinze, en revanche, le monde entier allait finir par le savoir : elle composa le numéro de Damiano Rocchi et elle dit trois mots.", "— Samedi. J'y serai."]}, {"n": 8, "t": "La maison du lac", "pov": "Livia", "p": ["La maison des Rocchi ne ressemblait pas à ce que j'imaginais. Pas de marbre, pas de gardes ostensibles. Une longue bâtisse basse au bord de l'eau, des volets en bois délavé, un ponton, et un vieil homme assis au bout du ponton avec une canne à pêche qu'il ne surveillait pas.", "Damiano me laissa avancer seule.", "— Asseyez-vous, dit Matteo Rocchi sans se retourner.", "Je m'assis sur les planches, à sa droite, les pieds au-dessus de l'eau, comme une enfant.", "— Vous avez la lettre, dit-il.", "— Oui.", "— Il ne vous l'a pas montrée à l'époque.", "— Non.", "— Je ne suis pas surpris. Votre père est un homme qui préfère porter seul ce qui devrait être partagé. C'est un défaut qu'il vous a transmis, à ce qu'on m'a dit.", "Je ne répondis pas.", "Il remonta lentement sa ligne, vide, et la relança.", "— Vous voulez savoir pourquoi je vous ai prévenue, alors que je devrais vous détester.", "— Oui.", "— Parce que je n'ai jamais détesté une enfant pour ce que son père a choisi. Et parce que ce qui est arrivé à mon fils ne sera pas racheté par ce qui vous arriverait à vous. Ça ne marche pas comme ça, la vengeance, madame. Ça ne rend rien. Ça ne fait qu'ajouter.", "— Alors qu'est-ce que vous voulez ?", "Il tourna enfin la tête. Il avait les yeux de Damiano, en plus délavés.", "— Les Ferraro. Je veux qu'ils n'existent plus. Pas leur argent, pas leur territoire — leur nom. Et pour ça, j'ai besoin de quelqu'un qui connaisse les Castellano de l'intérieur, parce que les Castellano sont la porte par laquelle les Ferraro sont entrés dans cette ville.", "— Vous voulez que je détruise mon mari.", "— Je veux que vous détruisiez ceux qui se sont servis de lui. Ce qu'il en restera à la fin, ce sera votre affaire, pas la mienne.", "Je regardai l'eau grise.", "— Je ne travaille pour personne, dis-je. Plus jamais.", "— Je ne vous offre pas un emploi.", "— Alors quoi ?", "— Une association. Cinquante-cinquante. Votre nom sur les statuts, à côté du mien, dès lundi. Et une clause que j'ai fait rédiger cette nuit : si vous partez, vous partez avec votre moitié. Personne ne pourra vous faire ce qu'ils vous ont fait.", "C'était exactement l'offre de Salvatore.", "Et c'était exactement l'inverse.", "Salvatore m'avait proposé une place dans sa maison. Matteo Rocchi me proposait une maison à moi.", "— Pourquoi maintenant ? demandai-je. Pourquoi pas il y a six ans ?", "Le vieil homme sourit, et son sourire était triste.", "— Parce qu'il y a six ans, vous étiez amoureuse. Et qu'on ne recrute pas une femme amoureuse, madame : on ne recrute que ce qu'il en reste après.", "Je signai le lundi matin.", "À onze heures, la nouvelle tomba sur les trois principales places financières de la région.", "À onze heures six, le téléphone de Salvatore Castellano se mit à sonner et ne s'arrêta plus."]}, {"n": 9, "t": "Sept ans", "pov": "Damiano", "p": ["Elle ne se souvenait pas de moi. C'était la seule chose qui me blessait vraiment.", "Nous nous étions rencontrés une fois, dix ans plus tôt, à un colloque de droit fiscal à Milan — elle avait vingt-trois ans, moi vingt-sept, et elle avait démoli en public l'intervention d'un professeur qui la prenait de haut, avec une politesse si parfaite que l'homme avait mis trois minutes à comprendre qu'il venait d'être détruit.", "Je l'avais suivie jusqu'au café. J'avais dit quelque chose de stupide. Elle avait ri.", "Et puis un de mes hommes était venu me chercher, parce que mon père me réclamait, et je ne lui avais même pas demandé son nom.", "Je l'ai retrouvé trois ans plus tard, dans un rapport interne : Livia Sarti, consigliere, famille Castellano. Photographie d'identité. La même politesse parfaite dans le regard.", "Sept ans à la combattre par dossiers interposés. Sept ans à perdre, la plupart du temps. Sept ans à ouvrir les rapports en cherchant d'abord son nom.", "Mon père a toujours cru que je voulais les Castellano.", "Je voulais elle.", "Le premier jour de notre association, elle arriva à sept heures quarante avec deux cafés, dont un pour moi, et posa sur la table une liste de dix-sept sociétés.", "— Voilà par où les Ferraro font transiter leur liquide. Neuf sur les dix-sept sont domiciliées dans des immeubles appartenant aux Castellano. Salvatore ne le sait probablement pas.", "— Vous le protégez ?", "— Je constate. Il y a une différence, mais je comprends qu'elle soit mince vue d'où vous êtes.", "Elle m'avait retourné ma propre phrase, sans sourire, en buvant son café.", "C'est à cet instant précis, je crois, que j'ai compris que j'allais être obligé de lui mentir.", "Parce que sur cette liste de dix-sept sociétés, il y en avait une que je reconnaissais.", "Celle qui avait financé, trois mois plus tôt, l'opération du quai nord.", "Celle dont j'avais moi-même autorisé le virement, un soir de mars, sans savoir — je le jure devant tout ce qui me reste — sans savoir qui se trouverait sur ce quai."]}, {"n": 10, "t": "Conditions", "pov": "Livia", "p": ["Nous prîmes trois contrats aux Castellano en six semaines.", "Le premier fut facile : une concession portuaire dont je connaissais la clause de résiliation par cœur, puisque je l'avais rédigée. Le deuxième demanda un peu de travail. Le troisième, aucun : ils nous le cédèrent parce qu'ils n'avaient plus les liquidités pour le défendre.", "Le vendredi de la sixième semaine, Enzo m'appela.", "— Livia. Il faut que je te parle.", "— Vas-y.", "— Pas au téléphone.", "Nous nous retrouvâmes dans un café du centre, celui où nous allions autrefois quand les réunions duraient trop longtemps. Il avait maigri. Il triturait sa cuillère.", "— Ça va mal là-bas, dit-il. Bruno parle de vendre la maison de campagne. Ta— Salvatore ne dort plus. Il a renvoyé deux hommes cette semaine.", "— Pourquoi tu me racontes ça, Enzo ?", "Il leva les yeux. Et je vis qu'il avait préparé sa phrase, comme Salvatore avait préparé la sienne sous le figuier.", "— Parce que tu peux arrêter ça quand tu veux.", "— Non. Je pourrais arrêter si j'étais seule. Je suis associée maintenant. Il y a un autre nom sur les statuts.", "— Tu as choisi ce nom.", "— Oui, dis-je. Comme Salvatore a choisi le sien sur un faire-part de fiançailles.", "Il encaissa. Puis il posa la cuillère.", "— Tu me détestes ?", "C'était sa façon à lui de me demander si je savais.", "Je savais depuis le premier jour. Depuis le mercredi où Salvatore était arrivé chez mes parents en connaissant l'heure exacte à laquelle j'étais partie du bureau le vendredi précédent — une heure que je n'avais dite qu'à une seule personne.", "J'aurais pu le brûler. J'aurais pu l'humilier. Une partie de moi le voulait, et cette partie-là me faisait peur.", "Je choisis autre chose.", "— Non, Enzo. Je ne te déteste pas.", "Je sortis de mon sac une chemise cartonnée — un réflexe, chez moi, comme d'autres sortent un mouchoir — et je la poussai vers lui.", "— Tiens. Nos projections de trésorerie pour le trimestre. Tu verras, on est plus fragiles qu'on n'en a l'air. Beaucoup plus.", "Il regarda le dossier. Il ne le prit pas tout de suite.", "— Pourquoi tu me donnes ça ?", "— Parce que tu es mon ami, dis-je. Et parce que je crois que tu devrais savoir où nous en sommes vraiment.", "Il le prit.", "Bien sûr qu'il le prit.", "Je le regardai partir dans la rue avec le dossier sous le bras, et je pensai à ce que mon père m'avait dit dans la cuisine : un homme qui cède une fois cède toujours.", "Il avait raison. Il ne savait simplement pas à quel point cette phrase pouvait servir.", "Chaque chiffre de ce dossier était faux."]}, {"n": 11, "t": "Ce que je ne comprenais pas", "pov": "Salvatore", "p": ["Le contrat de Villanova nous échappa un mardi à quatorze heures.", "Bruno me l'annonça sans s'asseoir, ce qui était sa façon de dire qu'il n'avait pas l'intention de rester pour la suite.", "— Rocchi a proposé douze pour cent de moins que nous. Ils ne gagnent rien sur ce contrat. Ils le prennent pour nous le prendre.", "— Alors on descend à quinze.", "— On ne peut pas descendre. C'est bien ça le problème, Salvatore. On n'a plus de marge. On n'a plus de caisse. On n'a plus elle.", "Je passai la nuit sur les dossiers.", "Il faut que je dise ceci, parce que c'est la vérité et que la vérité, à ce stade, est la seule chose qui me reste : je ne comprenais pas.", "Pas les grandes lignes — les grandes lignes, je les comprenais. Je comprenais qui nous payait et qui nous devait. Ce que je ne comprenais pas, c'était l'architecture. La façon dont une clause de la page onze d'un bail de 2019 protégeait une créance signée en 2022 qui garantissait un crédit obtenu en 2024. Elle avait construit, sous cette maison, une cathédrale entière dont j'avais habité le rez-de-chaussée pendant six ans sans jamais descendre voir les fondations.", "Et maintenant, quelqu'un retirait les pierres une par une, et cette personne savait exactement lesquelles, parce que c'était elle qui les avait posées.", "À quatre heures du matin, je fis ce que je m'étais juré de ne pas faire.", "J'ouvris le tiroir du bas de son bureau, je pris le flacon de médicaments, et je regardai l'ordonnance jusqu'à ce que les lettres se brouillent.", "Docteur Renato Falco. 19 mars. Douleur post-opératoire, plaie par arme à feu, région claviculaire droite.", "Je connaissais Falco. Il soignait la famille depuis vingt ans et il n'avait jamais, pas une seule fois, opéré sans mon accord.", "Je le convoquai à six heures.", "Il arriva à six heures vingt, mal rasé, et il comprit avant que je parle. Ça se voyait à ses mains.", "— Vous l'avez opérée sans mon autorisation.", "— Oui, Don Castellano.", "— Vous connaissez la règle.", "— Oui.", "— Alors pourquoi ?", "Et ce vieil homme, qui avait recousu trois générations de Castellano et qui savait parfaitement ce qu'il risquait, me regarda droit dans les yeux.", "— Parce qu'elle allait mourir sur ma table pendant que vous chantiez « joyeux anniversaire ».", "Personne ne m'avait parlé ainsi depuis la mort de mon père.", "Je ne le touchai pas. Je ne dis rien. Je le laissai partir, et quand la porte se referma, je restai assis et je compris deux choses dans le même mouvement.", "La première : que tout le monde, dans cette maison, savait depuis trois mois ce que je venais d'apprendre. Le médecin. Bruno, probablement. Enzo, sûrement.", "La seconde : qu'aucun d'eux ne me l'avait dit. Pas par loyauté envers elle.", "Par pitié envers moi."]}, {"n": 12, "t": "Le fil", "pov": "Livia", "p": ["Trois semaines après le café, Enzo me rappela.", "— Ils ont mordu, dit-il, et sa voix tremblait un peu. Bruno a lu tes projections. Il a dit à Salvatore que vous étiez au bord de la rupture de trésorerie. Ils préparent une offre de rachat sur vos parts du port.", "— Vraiment.", "— Livia, écoute-moi. Si tu sais que je lui parle, arrête-moi. Arrête-moi maintenant.", "Je fermai les yeux.", "Nous étions dans le même café. La même cuillère tournait dans la même tasse. Et il venait de m'offrir, avec une maladresse qui me serra la gorge, la seule chose qu'il avait à offrir : le droit de le démasquer avant qu'il n'aille trop loin.", "— Pourquoi tu lui parles, Enzo ?", "— Parce qu'il m'a demandé. Parce que je suis entré dans cette maison à dix-neuf ans et que je n'ai jamais rien su faire d'autre. Parce que je croyais que si je lui racontais comment tu allais, il finirait par comprendre quelque chose.", "— Et il a compris quelque chose ?", "Un long silence.", "— Il a demandé si tu dormais. C'est la seule question qu'il m'a posée sur toi en trois mois. Le reste, c'étaient des questions sur les chiffres.", "Je regardai par la fenêtre.", "Il y a un moment, dans toute guerre, où l'on cesse de vouloir gagner et où l'on veut simplement que ce soit fini. Ce moment m'est passé dessus ce jour-là, dans ce café, et je l'ai laissé passer.", "— Continue, dis-je.", "— Quoi ?", "— Continue de lui parler. Raconte-lui ce que je te dis. Ne change rien.", "Enzo posa la cuillère. Il avait compris.", "— Tu m'utilises.", "— Oui.", "— Depuis quand ?", "— Depuis le premier dossier.", "Il ne se mit pas en colère. C'est ce qui fut le plus dur. Il hocha la tête, lentement, comme un homme à qui l'on confirme un diagnostic qu'il connaissait déjà.", "— Je le mérite, dit-il.", "— Non, Enzo. Personne ne mérite ça. Mais je vais quand même le faire, et c'est ça, la différence entre ce que j'étais il y a six mois et ce que je suis.", "Il paya les deux cafés, comme toujours. À la porte, il se retourna.", "— Tu sais ce qui est terrible ? Je vais continuer. Même en sachant. Parce que c'est la seule façon que j'ai de te voir.", "Il sortit.", "Je restai assise et, pour la première fois depuis le dix-sept mars, j'eus honte."]}, {"n": 13, "t": "La vente", "pov": "Livia", "p": ["La maison de ventes Aldrovandi tenait sa vacation d'automne le premier jeudi d'octobre. Lot 47 : un collier en or et grenat, milieu du siècle dernier, provenance « collection privée ».", "Je connaissais ce collier. Ma mère l'avait porté à son mariage. Mon père l'avait vendu en 2003 pour payer les hommes qui devaient protéger la maison après l'affaire du port.", "Je ne l'avais pas revu depuis vingt-trois ans.", "— Vous êtes sûre de vouloir y aller ? demanda Damiano dans la voiture.", "— Vous m'avez fait chercher ce collier pendant six semaines.", "— Je vous ai fait chercher un collier. Je ne vous ai pas demandé d'aller le reprendre dans la même salle que lui.", "Car Salvatore serait là. Les Castellano avaient trois lots en vente ce soir-là — des lots que personne ne met en vente publique quand tout va bien.", "La salle était pleine. Nous étions en loge, au premier balcon. Lui était en bas, au troisième rang, avec Serena à sa droite et Bruno derrière.", "Il me vit à l'instant où je m'assis. Je le sus sans le regarder.", "Les lots défilèrent. Le service en argent des Castellano partit à moitié prix. La collection de montres de son père, à un tiers. Chaque coup de marteau était un os qui cassait, et toute la ville, dans cette salle, comptait les fractures.", "Lot 47.", "Le commissaire-priseur ouvrit à quatre mille.", "Je levai ma raquette.", "Un murmure parcourut la salle — pas pour le prix, mais parce que tout le monde venait de comprendre que Livia Sarti enchérissait en public, sous son nom, aux côtés d'un Rocchi, pour la première fois.", "Et alors, en bas, Salvatore leva la sienne.", "Je me tournai vers lui. Il me regardait. Il n'avait aucune idée de ce qu'était ce collier — il n'avait jamais rencontré ma mère en robe de mariée, il n'avait jamais demandé.", "Il enchérissait parce que c'était moi.", "Six mille. Huit. Douze. Vingt.", "À trente mille, Bruno posa la main sur son bras et Salvatore la retira d'un geste sec, comme on chasse une mouche.", "À quarante-cinq mille, la salle ne respirait plus.", "Damiano se pencha vers moi.", "— Il n'a pas cet argent.", "— Je sais.", "— Vous pouvez vous arrêter. Je le rachèterai à celui qui l'emportera, la semaine prochaine, pour la moitié.", "— Je sais ça aussi.", "Je levai ma raquette une dernière fois. Cinquante mille.", "Et en bas, Salvatore leva la main — puis s'arrêta à mi-hauteur.", "Il la garda là, suspendue, pendant trois secondes qui durèrent un an. Je vis son visage. Je vis le calcul, encore, l'éternel calcul, et je vis le moment exact où le chiffre l'emporta sur tout le reste.", "Sa main redescendit.", "— Adjugé, dit le commissaire.", "Je récupérai le collier au guichet, dans une boîte plate. Il m'attendait dans le hall, près des portes, seul — Serena était déjà dehors.", "— Qu'est-ce que c'était ? demanda-t-il.", "— Le collier de mariage de ma mère.", "Il devint très pâle.", "— Je ne savais pas.", "— Non, dis-je. Tu n'as jamais rien su. Ce n'est pas un reproche, Salvatore, c'est un constat : en six ans, tu ne m'as jamais posé une seule question dont la réponse ne t'était pas utile.", "Je passai devant lui.", "— Livia.", "Je m'arrêtai.", "— Je serais monté à cent mille, dit-il. Si j'avais su.", "— C'est bien le problème. Tu ne montes que quand tu sais ce que tu achètes."]}, {"n": 14, "t": "Ce que coûte une salle pleine", "pov": "Salvatore", "p": ["On ne mesure pas sa chute aux chiffres. On la mesure aux gens qui cessent de vous saluer.", "En sortant de chez Aldrovandi, trois personnes détournèrent la tête. Le notaire Vasari — celui-là même chez qui elle avait déposé l'enveloppe — me serra la main en regardant ailleurs. Et sur le trottoir, un homme que je ne connaissais pas me tendit une carte.", "Gianfranco Ferraro. Conseil en investissement.", "— Votre père et le mien se connaissaient bien, dit-il avec un sourire net. Passez me voir. Vous avez un problème de liquidités. J'ai des liquidités et un problème de respectabilité. C'est ce qu'on appelle une conversation naturelle.", "Je pris la carte. Je ne la jetai pas.", "C'est cette carte, plus que tout le reste, qui devrait me condamner.", "Dans la voiture, Serena ne dit rien pendant vingt minutes. Puis :", "— Cinquante mille euros.", "— Ce n'est pas ce que tu crois.", "— Tu ne sais pas ce que je crois. Personne ici ne se demande jamais ce que je crois.", "Elle regardait la vitre.", "— J'ai perdu six ans, Salvatore. Comme elle. Sauf qu'elle, elle a au moins eu un mariage.", "— Serena—", "— Non. Écoute-moi, parce que je ne le dirai qu'une fois. Quand tu as levé la main, ce soir, tout le monde dans cette salle a compris à qui tu appartiens. Tout le monde sauf toi. Tu vas rentrer, tu vas t'asseoir dans ton bureau, tu vas te dire que c'était une question de fierté, et dans six mois tu te demanderas encore pourquoi tu es seul.", "Elle descendit à un feu rouge, sans attendre que la voiture s'arrête complètement.", "Ce fut la dernière fois que je lui parlai comme à une fiancée.", "Deux jours plus tard, dans la bibliothèque, ma mère me tendit une lettre — la même enveloppe, le même cachet, que celle du notaire Vasari.", "À l'intérieur, un mot de Livia, quatre lignes :", "« Le contrat de divorce est resté non signé quatre-vingt-onze jours. Passé six mois, la procédure devient contentieuse et publique. Tu as jusqu'au 17 mars. La date te dira peut-être quelque chose. »", "Le 17 mars.", "Un an, jour pour jour.", "Elle ne me laissait pas seulement une échéance. Elle me laissait l'anniversaire de ma faute comme date limite, pour que je ne puisse plus jamais confondre les deux."]}, {"n": 15, "t": "Ce qu'on trouve en cherchant autre chose", "pov": "Livia", "p": ["C'est en vérifiant un cadastre que je suis tombée dessus.", "Rien de spectaculaire. Un entrepôt du quai nord, parcelle 114, propriété d'une société luxembourgeoise — l'une des dix-sept de ma liste. Je remontais la chaîne de détention pour préparer notre offensive suivante lorsque je suis arrivée à la holding faîtière.", "Et au bas du registre des mandataires, une signature scannée.", "D. Rocchi.", "Je restai immobile devant l'écran pendant peut-être deux minutes.", "Puis j'ai fait ce que je fais toujours : j'ai vérifié. Trois fois. Les statuts, les procès-verbaux, les virements. Un versement, daté du 11 mars, autorisé par mandat spécial, à destination d'un prestataire de sécurité dont j'avais moi-même croisé le nom dans le rapport interne des Castellano sur l'embuscade du quai nord.", "Six jours avant qu'on me tire dessus, mon associé avait payé les hommes qui l'ont fait.", "J'ai refermé l'ordinateur. J'ai mis mon manteau. Je suis allée marcher au bord du lac, une heure, dans le froid, jusqu'à ce que mes mains cessent de trembler — parce que je refusais d'entrer dans son bureau avec des mains qui tremblent.", "Puis je suis remontée.", "Damiano travaillait, la cravate desserrée. Il leva la tête et sourit, et le sourire mourut à mi-chemin, parce qu'il a toujours su lire mon visage plus vite que je ne l'aurais voulu.", "— Parcelle 114, dis-je.", "Il ne demanda pas de quoi je parlais. Ce fut sa première élégance et sa première condamnation.", "— Asseyez-vous, Livia.", "— Non.", "— Je vais tout vous dire. Mais je préfère que vous soyez assise, parce que la vérité est pire que ce que vous croyez, et meilleure aussi.", "— Répondez à une question, et une seule. Est-ce que vous saviez que je serais sur ce quai ?", "Il se leva. Il fit le tour du bureau. Il s'arrêta à un mètre, les mains vides, offertes.", "— Non.", "— Damiano.", "— Non, répéta-t-il. Sur la tombe de mon frère, non. J'ai payé une opération contre un chargement des Ferraro. On m'avait donné une date, un lieu, une heure. On ne m'a pas donné de nom.", "— Qui, « on » ?", "Et alors il dit le mot que j'attendais depuis le début sans le savoir :", "— Votre mari.", "La pièce se rétrécit.", "— Salvatore ne travaille pas avec vous.", "— Salvatore ne savait pas qu'il travaillait avec moi. L'information m'est venue par un intermédiaire des Ferraro qui la vendait des deux côtés. Livia — l'homme qui a communiqué l'horaire du quai nord aux Ferraro, c'est Enzo.", "Je crois que j'ai ri. Un son court, laid.", "— Enzo n'a jamais pris une décision de sa vie.", "— C'est exactement pour ça qu'on s'est servi de lui. Comme vous vous en servez aujourd'hui.", "Je m'assis, finalement. Pas parce que me l'avait demandé. Parce que mes jambes avaient cessé de m'appartenir.", "— Pourquoi ne m'avoir rien dit le premier jour ?", "Damiano resta debout.", "— Parce que le premier jour, vous étiez une femme qui venait de tout perdre et à qui j'allais demander de se battre. Si je vous avais dit que j'avais financé la balle, vous seriez partie. Et si vous étiez partie, vous seriez morte, parce que la liste des Ferraro n'a jamais été annulée.", "Il s'accroupit devant moi, pour que nos yeux soient à la même hauteur.", "— J'ai menti pour vous garder en vie et je savais, en mentant, que ça me coûterait le reste. Je le referais. C'est la chose la plus honnête que j'aie jamais dite à quelqu'un.", "Je me levai. J'allai jusqu'à la porte.", "Et sur le seuil, sans me retourner :", "— Faites-moi une copie de tout. Les virements, les mandats, l'intermédiaire, tout.", "— Pour me détruire ?", "— Pour détruire quelqu'un. Je vous dirai qui quand je le saurai."]}, {"n": 16, "t": "Le chiffre qui ment", "pov": "Livia", "p": ["L'offre de rachat des Castellano arriva le 4 novembre.", "Elle était mauvaise. Elle était surtout fondée sur mes faux chiffres, ce qui la rendait parfaite : ils proposaient de racheter nos parts du port à un prix calculé sur une trésorerie qui n'existait pas, avec un financement relais dont j'avais moi-même, six semaines plus tôt, glissé les conditions dans le dossier remis à Enzo.", "Ils empruntaient pour acheter un bien dont je connaissais la valeur réelle. Ils allaient payer le double.", "Je fis venir Matteo Rocchi.", "Le vieil homme lut le dossier lentement, page par page, comme il remontait sa ligne de pêche.", "— Vous les tenez, dit-il enfin.", "— Je les tiens.", "— Et vous n'avez pas l'air contente.", "Je regardai la fenêtre.", "— Si je signe, dans six semaines, les Castellano ne peuvent plus payer les intérêts. Ils devront vendre. Et le seul acheteur en ville qui aura du liquide, ce seront les Ferraro. Je ne détruis pas les Ferraro : je leur livre les Castellano avec un ruban.", "Matteo posa le dossier.", "— Alors ne signez pas.", "— Si je ne signe pas, ils survivent et nous perdons six mois.", "— Madame Sarti, dit-il, et c'était la première fois qu'il m'appelait par mon nom de jeune fille, ce que je fis semblant de ne pas remarquer. Vous avez passé six ans à empêcher une famille de tomber. Vous croyez avoir changé de métier. Vous n'avez changé que de maison.", "Je ne répondis pas.", "— Signez, dit-il en se levant. Mais négociez une clause de préemption. Si les Castellano doivent revendre, c'est à nous en priorité. Ce sera moins spectaculaire. Ce sera plus efficace. Et surtout, ça vous laissera le choix, le jour venu.", "À la porte, il ajouta :", "— Mon fils vous a menti.", "— Oui.", "— Il vous a aussi sauvé la vie.", "— Oui.", "— Les deux comptent. Ne laissez personne, y compris vous-même, vous faire croire qu'il faut choisir entre les deux."]}, {"n": 17, "t": "L'homme qui signe", "pov": "Salvatore", "p": ["Je signai l'accord de rachat le 19 novembre à seize heures.", "Bruno signa en second, et je vis sa main hésiter au-dessus du papier.", "— Tu es sûr ?", "— C'est le port, Bruno. Avec le port, on a de nouveau une assise. Sans le port, on est une famille qui vend son argenterie aux enchères.", "— Et le financement ?", "— Ferraro.", "Le silence qui suivit fut d'une qualité particulière. Bruno avait soixante et un ans. Il avait enterré mon père. Il avait vu arriver les Ferraro en 2003.", "— Ton père a refusé de les laisser entrer pendant douze ans, dit-il.", "— Mon père avait une trésorerie.", "— Ton père avait une femme qui lui disait non.", "Je levai les yeux. Il soutint mon regard sans ciller.", "— Sors, Bruno.", "Il sortit.", "Ce soir-là, seul dans la bibliothèque, je relus le contrat en entier pour la troisième fois. Article 14, clause de préemption au bénéfice du cédant en cas de revente sous vingt-quatre mois. Une clause d'apparence technique, insérée sans discussion par leurs avocats, acceptée sans discussion par les miens.", "Je la lus quatre fois.", "Puis je fis quelque chose que je n'avais pas fait depuis six ans : je pris un stylo et une feuille, et j'essayai de calculer moi-même.", "À une heure du matin, j'avais compris la moitié. À trois heures, les trois quarts. À l'aube, j'avais devant moi une architecture qui n'avait qu'une seule signature possible.", "Elle ne m'avait pas vendu le port.", "Elle me l'avait prêté, en s'assurant de pouvoir le reprendre au moment de son choix, financé par l'argent de la famille qui avait voulu la tuer.", "Je restai assis dans le petit matin gris, avec ma feuille couverte de chiffres, et je ressentis quelque chose d'absolument inattendu.", "De la fierté.", "Ma femme était en train de me démonter pièce par pièce, et c'était moi qui lui avais appris que le pouvoir ne se prend pas, qu'il se laisse prendre par ceux qui ne savent pas lire.", "Non. Même pas. Elle me l'avait appris à moi."]}, {"n": 18, "t": "La visite de Serena", "pov": "Livia", "p": ["Elle vint sans prévenir, un samedi, à nos bureaux vides.", "Je faillis ne pas la reconnaître : pas de bleu pâle, pas de coiffeur. Un manteau noir, les cheveux attachés, un cartable.", "— J'ai quinze minutes à vous demander, dit-elle. Après, je disparais, que vous acceptiez ou non.", "Je la fis entrer.", "Elle posa le cartable sur la table sans l'ouvrir.", "— Je ne suis pas venue m'excuser. Je ne savais pas que vous existiez pendant les deux premières années. Quand je l'ai su, je suis restée. Je n'ai pas d'excuse pour ça, alors je n'en présenterai pas.", "— Pourquoi êtes-vous là ?", "— Parce que je suis payée depuis quatre ans pour être auprès de Salvatore Castellano. Et pas par lui.", "Le froid me descendit dans le dos.", "— Par qui ?", "— Les Ferraro. Mon père leur devait de l'argent. Beaucoup. Ils lui ont proposé un arrangement : sa fille entre dans la maison Castellano, et la dette s'éteint. Je devais rapporter. Des horaires, des noms, des mouvements. Des dates.", "— Des dates, répétai-je.", "Elle soutint mon regard.", "— Le 17 mars, je ne savais pas que ce serait vous. Je savais qu'il y aurait quelqu'un sur ce quai. Et j'ai fait la seule chose que j'ai su faire : j'ai organisé un anniversaire pour qu'il ne soit pas là, lui.", "Ma gorge se referma.", "— Vous l'avez éloigné.", "— Je l'ai sauvé. Je ne vous ai pas sauvée, vous, parce que je ne savais pas que vous étiez dedans, et parce que si je l'avais su, j'aurais peut-être choisi lui quand même. Je préfère vous le dire plutôt que de me faire passer pour meilleure que je ne suis.", "Elle ouvrit enfin le cartable. Des relevés, des messages imprimés, un carnet.", "— Quatre ans de rapports. Les copies de tout ce que j'ai transmis et de tout ce que j'ai reçu. Il y a là-dedans de quoi faire tomber Gianfranco Ferraro.", "— Pourquoi maintenant ?", "— Parce que Salvatore vient de leur emprunter onze millions et que, dans six mois, il sera à eux. Et parce que j'ai compris quelque chose à la vente aux enchères.", "— Quoi ?", "Serena eut un sourire d'une tristesse parfaite.", "— Que j'ai passé quatre ans à protéger un homme qui, à la seconde où vous êtes entrée dans une salle, a cessé de savoir que j'existais. Je ne veux pas me venger de lui. Je veux juste arrêter de payer la dette de mon père avec ma vie.", "Elle se leva.", "— Une condition, dit-elle à la porte. Quand tout sera fini, il ne doit jamais savoir que c'est moi qui vous ai donné ça. Laissez-lui une femme, dans cette histoire, qu'il puisse se rappeler sans honte. Il en aura besoin.", "J'attendis qu'elle soit sortie.", "Puis j'appuyai sur la touche de mon téléphone, posé face contre la table depuis le début, et j'arrêtai l'enregistrement."]}, {"n": 19, "t": "Trois enveloppes", "pov": "Livia", "p": ["Je passai la nuit du dimanche à trier quatre ans de la vie de Serena.", "À l'aube, j'avais constitué trois dossiers.", "Le premier, pour le procureur Aldini — le seul magistrat de cette ville que mon père appelait « un homme qui n'a jamais dîné avec personne ». Les circuits des Ferraro, les sociétés luxembourgeoises, les dix-sept structures, sans une ligne qui touche aux Rocchi ni aux Castellano.", "Le deuxième, pour Matteo Rocchi. La chaîne complète qui remontait de l'intermédiaire jusqu'à l'homme qui avait donné l'ordre, en 2003, d'enlever un garçon de dix-sept ans. Ce dossier-là n'irait à aucun tribunal. Je le savais en le constituant. C'est la chose que j'ai faite dont je suis le moins fière, et je l'ai faite quand même.", "Le troisième n'avait pas de destinataire.", "Il contenait quatre pages : le mandat signé D. Rocchi, le virement du 11 mars, le nom du prestataire, et le rapport d'autopsie balistique du quai nord.", "De quoi détruire Damiano.", "Je le posai sur la table, à côté des deux autres, et je le regardai jusqu'à ce que le jour se lève complètement.", "Puis j'appelai.", "— Vous avez décidé ? dit-il. Sa voix était celle de quelqu'un qui n'avait pas dormi non plus, depuis quinze jours.", "— Non. Je ne détruis personne aujourd'hui. Je voulais juste que vous sachiez que je peux.", "— Je le sais depuis le premier jour, Livia. C'est pour ça que je vous ai fait signer une clause qui vous laisse partir avec la moitié.", "Silence.", "— Vous me haïssez ? demanda-t-il.", "— Non. C'est plus embêtant que ça. Je vous crois.", "Je raccrochai avant qu'il ne réponde.", "Le dossier d'Aldini partit le lundi à neuf heures, par coursier, sans nom d'expéditeur.", "Le mardi, les Ferraro apprirent qu'une enquête était ouverte.", "Le mercredi soir, à vingt-trois heures dix, on trouva Serena Vitale au pied de l'immeuble où elle avait pris un appartement trois jours plus tôt.", "La police conclut à une chute.", "Personne, dans cette ville, n'y crut une seconde."]}, {"n": 20, "t": "Quarante-huit heures", "pov": "Salvatore", "p": ["Ils vinrent me chercher le jeudi à six heures du matin.", "Je ne résistai pas. Ma mère hurlait dans l'escalier ; je lui demandai de se taire et elle se tut, ce qui n'était jamais arrivé.", "Dans la salle d'interrogatoire, le commissaire posa trois choses sur la table.", "Un relevé téléphonique : douze appels de mon numéro vers celui de Serena au cours du dernier mois, dont deux le mercredi.", "Un témoignage de la gardienne : un homme correspondant à ma description, vu dans le hall vers vingt-deux heures.", "Et une photographie de la rupture de nos fiançailles, publiée le matin même par un journal qui n'aurait jamais publié ça sans qu'on le lui demande.", "— Vous l'avez menacée ?", "— Non.", "— Vous l'avez vue mercredi soir ?", "— Non.", "— Où étiez-vous ?", "Et là, je fis quelque chose de stupide.", "Parce que mercredi soir, j'étais garé devant une maison, dans une rue résidentielle, à trois cents mètres d'un figuier, à regarder une fenêtre allumée au premier étage sans avoir le courage de descendre de voiture. J'y étais resté deux heures. Je n'avais parlé à personne.", "Dire ça, c'était donner son nom. C'était mettre Livia dans un dossier criminel, dans une ville où les Ferraro lisaient les dossiers criminels avant les juges.", "— Je ne répondrai pas à cette question, dis-je.", "Le commissaire s'adossa à sa chaise et sourit comme un homme qui vient de gagner sa journée.", "Mon avocat arriva à onze heures. Il m'expliqua que je n'avais qu'à donner l'endroit, que ça prendrait dix minutes à vérifier, que c'était absurde.", "— Non.", "— Don Castellano, vous risquez la détention provisoire.", "— J'ai dit non.", "Il repartit.", "À quinze heures, on me transféra en cellule.", "Je m'assis sur le banc, le dos contre le mur froid, et j'eus le temps de penser, enfin, sans dossier, sans téléphone, sans personne pour me dire ce que j'avais à faire.", "Je pensai à une chose qu'elle m'avait dite sous un figuier : dans tout ce que tu as préparé, il n'y a pas une seule phrase où tu parles de moi.", "Elle avait raison ce jour-là.", "Assis dans cette cellule, en train de laisser un commissaire construire un dossier d'homicide contre moi plutôt que de prononcer son nom, je me dis que c'était peut-être la première fois de ma vie que je faisais quelque chose qui parlait d'elle.", "Et que, comme toujours avec moi, ça arrivait avec quatre-vingt-onze jours de retard.", "Ce que je ne savais pas encore, c'est qu'à cette heure précise, Livia Sarti venait d'entrer dans le commissariat central avec un enregistrement de quinze minutes dans son téléphone et un avocat qui n'était pas le mien."]}, {"n": 21, "t": "Quinze minutes", "pov": "Livia", "p": ["Le commissaire Renzi écouta l'enregistrement en entier sans m'interrompre une seule fois.", "Quand la voix de Serena s'arrêta — laissez-lui une femme, dans cette histoire, qu'il puisse se rappeler sans honte — il resta immobile trente secondes. Puis il retira ses lunettes.", "— Vous savez ce que vous venez de faire, madame ?", "— J'ai apporté un élément.", "— Vous avez apporté un mobile. Le vôtre.", "Maître Orsini, à ma droite, ouvrit la bouche. Je posai la main sur son bras.", "— Expliquez-moi, dis-je.", "Renzi retourna une chemise vers moi.", "— Cette femme est venue vous voir le samedi. Le lundi, un dossier anonyme atterrit chez le procureur Aldini. Le mercredi, elle tombe de son balcon. Vous êtes la dernière personne connue à lui avoir parlé, vous êtes son unique motif de venir en ville, et vous venez de m'apporter vous-même la preuve que vous étiez en possession de documents qui valaient une vie.", "Je gardai les mains à plat sur la table.", "— Et Salvatore Castellano ?", "— Il refuse de donner son emploi du temps. C'est confortable pour moi. Un homme qui se tait, un journal qui titre, une rupture de fiançailles : ça fait un dossier présentable. Le problème, c'est que je ne crois pas une seconde qu'il l'ait tuée.", "— Pourquoi ?", "Renzi remit ses lunettes.", "— Parce qu'un homme qui organise un homicide ne perd pas quarante-huit heures à protéger un alibi qu'il refuse de nommer. Il en invente un.", "Il poussa vers moi une photographie. Une caméra de circulation, vingt-deux heures quarante, un véhicule à l'arrêt dans une rue résidentielle.", "Je reconnus la plaque. Je reconnus surtout le mur derrière : celui du jardin de mes parents.", "— Il était devant chez vous, dit Renzi. Deux heures. Il ne descend pas, il ne sonne pas, il repart. Vous ne le saviez pas.", "— Non.", "— Ça, je vous crois. Ce que je ne comprends pas, c'est pourquoi il préfère la détention provisoire à cette photo.", "Je regardai l'image longtemps.", "Une voiture arrêtée sous un réverbère. Une fenêtre allumée au premier, qui devait être la mienne. Et à l'intérieur de la voiture, une forme sombre qui n'avait pas bougé pendant deux heures.", "Pendant six ans, j'avais attendu qu'il vienne. Il était venu la seule nuit où je ne pouvais pas le savoir, et il avait choisi de pourrir en cellule plutôt que de l'admettre.", "— Parce que me nommer, dis-je enfin, ce serait me mettre dans votre dossier. Et tout ce qui entre dans vos dossiers est lu par les Ferraro avant d'être lu par un juge.", "Renzi ne nia pas. Ce fut sa façon à lui d'être honnête.", "— Alors donnez-moi autre chose, madame Sarti. Parce qu'en l'état, j'ai deux suspects, et l'un des deux est en train de se sacrifier pour l'autre.", "Je repris l'enregistrement, le carnet, les relevés.", "— Donnez-moi trois jours.", "— Je peux vous en donner deux.", "Dans le couloir, Orsini m'attrapa le coude.", "— Livia, vous n'allez pas enquêter vous-même.", "— Non, dis-je. Je vais faire ce que je sais faire.", "Je sortis mon téléphone et je composai un numéro que je n'avais pas appelé depuis six semaines.", "— Enzo. Il faut qu'on se voie. Notre café, dans une heure."]}, {"n": 22, "t": "La cuillère", "pov": "Livia", "p": ["Il arriva avec vingt minutes de retard, ce qui ne lui était jamais arrivé en sept ans.", "Il ne commanda pas. Il s'assit et il posa ses deux mains à plat sur la table, comme un homme qui les montre pour prouver qu'elles sont vides.", "— Tu sais, dit-il.", "— Je sais quoi, Enzo ?", "— Ne fais pas ça. Pas toi. Tout le monde fait ça avec moi depuis quinze ans : poser des questions dont ils ont déjà la réponse, pour voir si je vais mentir.", "Je sortis une feuille de mon sac et je la posai entre nous. Un relevé d'appels. Un numéro non attribué, actif trois semaines, six appels, tous vers le même correspondant.", "Serena Vitale.", "— Le dernier appel est de mercredi, vingt et une heures cinquante. Elle est tombée à vingt-trois heures dix.", "Enzo regarda la feuille. Il ne la toucha pas.", "— Je ne l'ai pas tuée.", "— Je sais.", "Il leva la tête, stupéfait.", "— Tu sais ?", "— Enzo, tu n'as jamais pris une décision de ta vie. Tu as transmis. C'est ton métier depuis dix-neuf ans : tu prends une information à un endroit et tu la portes à un autre, et tu appelles ça de la loyauté parce que personne ne t'a jamais expliqué que c'était autre chose.", "Il devint gris.", "— Qui t'a demandé d'appeler Serena ?", "Silence.", "— Enzo.", "— Si je le dis, je suis mort avant vendredi.", "— Si tu ne le dis pas, Salvatore est mis en examen lundi.", "Il rit. Un rire affreux, cassé.", "— Tu crois que je ne le sais pas ? Tu crois que je n'ai pas passé la nuit là-dessus ?", "Il prit la cuillère. Il la fit tourner dans la tasse vide qu'on ne lui avait pas servie.", "— En mars, reprit-il très bas, on m'a demandé les horaires de livraison du quai nord. C'était une demande normale. Elle passait par un canal normal. J'ai transmis. Trois jours plus tard, on m'a dit qu'il y avait eu des blessés, et quand j'ai su que c'était toi, je suis allé aux toilettes et j'ai vomi pendant vingt minutes.", "Je ne dis rien. Le sang battait dans ma cicatrice.", "— Depuis, ils me tiennent. Ce n'est même pas de l'argent, Livia. C'est
