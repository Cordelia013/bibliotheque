<div id="app">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500&display=swap');

  #app {
    --ink: #14161a; --paper: #f0ece4; --paper-deep: #e4ded2;
    --accent: #6d1f2c; --brass: #a8843f; --muted: #6b6459; --rule: #cec6b6;
    font-family: 'Jost', system-ui, sans-serif; color: var(--ink);
    background: var(--paper); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  #app * { box-sizing: border-box; }
  #app.night { --ink:#ddd6c9; --paper:#14161a; --paper-deep:#1c1f25; --brass:#c9a35c; --muted:#8c8578; --rule:#2c3038; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 0 22px 140px; }
  .view { display: none; } .view.on { display: block; }

  .bar { position: sticky; top: 0; z-index: 40; background: var(--paper);
    border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
  .bar .title { font-family: 'Cormorant Garamond', serif; font-size: 17px; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { background: none; border: 1px solid var(--rule); color: var(--ink); width: 36px; height: 36px;
    border-radius: 2px; cursor: pointer; font-size: 15px; display: grid; place-items: center;
    font-family: inherit; transition: border-color .15s, background .15s; flex: none; }
  .icon:hover { border-color: var(--brass); }
  .icon.on { background: var(--accent); border-color: var(--accent); color: #f0ece4; }
  .icon:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .progress { height: 2px; background: var(--rule); position: sticky; top: 61px; z-index: 39; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

  /* BIBLIOTHÈQUE */
  .libhead { font-family: 'Cormorant Garamond', serif; font-size: clamp(30px,8vw,42px);
    font-weight: 600; margin: 44px 0 4px; letter-spacing: -.01em; }
  .libsub { color: var(--muted); font-size: 13px; letter-spacing: .04em; margin-bottom: 26px; }
  .search { width: 100%; padding: 13px 15px; background: var(--paper-deep); border: 1px solid var(--rule);
    color: var(--ink); font-family: inherit; font-size: 15px; border-radius: 2px; }
  .search::placeholder { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 30px; }
  .chip { padding: 6px 13px; border: 1px solid var(--rule); background: none; color: var(--muted);
    font-family: inherit; font-size: 12px; letter-spacing: .04em; border-radius: 20px; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 26px 18px; }
  .card { background: none; border: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-family: inherit; }
  .cover { aspect-ratio: 2/3; border-radius: 2px; padding: 20px 16px; display: flex; flex-direction: column;
    justify-content: space-between; color: #f2ede3; position: relative; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.22); transition: transform .18s; }
  .card:hover .cover { transform: translateY(-3px); }
  .cover svg { width:100%; height:100%; display:block; }
  .cover::after { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:rgba(0,0,0,.28); }
  .cover .ct { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.18; font-weight: 600; }
  .cover .ca { font-size: 10px; letter-spacing: .16em; opacity: .72; }
  .cmeta { margin-top: 10px; }
  .cmeta b { display: block; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 16px; line-height: 1.25; }
  .cbar { height: 3px; background: var(--rule); margin-top: 8px; }
  .cbar i { display: block; height: 100%; background: var(--accent); }
  .cpct { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin-top: 5px; }

  /* PAGE DE GARDE */
  .gcover { max-width: 210px; margin: 40px auto 30px; }
  .gtitle { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px,7vw,38px); font-weight: 600;
    text-align: center; line-height: 1.14; margin: 0 0 8px; }
  .gauth { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .16em; margin-bottom: 22px; }
  .gchips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 28px; }
  .gchips span { padding: 5px 12px; border: 1px solid var(--rule); border-radius: 20px; font-size: 11px;
    letter-spacing: .05em; color: var(--muted); }
  .gres { font-family: 'Cormorant Garamond', serif; font-size: 18px; line-height: 1.68; text-align: center;
    color: var(--ink); margin: 0 auto 34px; max-width: 34em; }
  .gstat { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 20px 0; margin-bottom: 26px; }
  .gpct { font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 700; line-height: 1; color: var(--accent); }
  .glab { font-size: 11px; letter-spacing: .14em; color: var(--muted); margin-top: 6px; }
  .gbar { height: 4px; background: var(--rule); margin-top: 16px; }
  .gbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .primary { width: 100%; padding: 16px; background: var(--accent); border: none; color: #f2ede3;
    font-family: inherit; font-size: 14px; letter-spacing: .06em; cursor: pointer; border-radius: 2px; }
  .ghost { width: 100%; padding: 14px; background: none; border: 1px solid var(--rule); color: var(--ink);
    font-family: inherit; font-size: 13px; letter-spacing: .05em; cursor: pointer; border-radius: 2px; margin-top: 10px; }

  /* LECTURE */
  .chapnum { font-weight: 300; font-size: 12px; letter-spacing: .22em; color: var(--muted); margin: 58px 0 10px; }
  h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(28px,7vw,38px);
    line-height: 1.12; margin: 0 0 6px; }
  .pov { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--accent); font-size: 17px; margin-bottom: 32px; }
  .body p { font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.72; margin: 0 0 1.15em; max-width: 34em; }
  .body p:first-of-type::first-letter { font-size: 3.1em; float: left; line-height: .82;
    padding: .06em .12em 0 0; color: var(--accent); font-weight: 600; }
  .endmark { margin: 50px 0 0; padding-top: 22px; border-top: 1px solid var(--rule); }
  .navrow { display: flex; gap: 10px; }
  .navbtn { flex: 1; padding: 14px 12px; background: none; cursor: pointer; border: 1px solid var(--rule);
    color: var(--ink); font-family: inherit; font-size: 13px; letter-spacing: .04em; border-radius: 2px; }
  .navbtn:hover:not(:disabled) { border-color: var(--brass); }
  .navbtn:disabled { opacity: .35; cursor: default; }

  /* TIROIR */
  .scrim { position: fixed; inset: 0; background: rgba(10,10,12,.55); z-index: 50; opacity: 0;
    pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(370px,88vw); background: var(--paper-deep);
    z-index: 51; overflow-y: auto; transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1);
    border-left: 1px solid var(--rule); padding: 22px 20px 60px; }
  .drawer.open { transform: none; }
  .dhead { font-family: 'Cormorant Garamond', serif; font-size: 21px; margin: 0 0 4px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0 18px; }
  .tab { flex: 1; padding: 9px; background: none; border: 1px solid var(--rule); color: var(--muted);
    font-family: inherit; font-size: 12px; letter-spacing: .05em; cursor: pointer; border-radius: 2px; }
  .tab.on { color: var(--ink); border-color: var(--ink); }
  .chapline { display: block; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--rule); padding: 13px 0; color: var(--ink);
    font-family: 'Cormorant Garamond', serif; font-size: 17px; cursor: pointer; position: relative; }
  .chapline em { font-style: normal; color: var(--muted); font-family: 'Jost'; font-size: 11px;
    letter-spacing: .13em; display: block; margin-bottom: 3px; }
  .chapline.current { color: var(--accent); }
  .chapline.current::before { content: '▸'; position: absolute; left: -14px; }
  .bmrow { display: block; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--rule); padding: 13px 0; color: var(--ink);
    font-family: 'Cormorant Garamond', serif; font-size: 16px; cursor: pointer; line-height: 1.5; }
  .bmrow small { font-family: 'Jost'; font-size: 11px; letter-spacing: .09em; color: var(--muted); display: block; margin-bottom: 4px; }
  .bmrow span { color: var(--muted); font-style: italic; font-size: 15px; }
  .del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px;
    font-family: 'Jost'; letter-spacing: .07em; padding: 4px 0 0; }
  .del:hover { color: var(--accent); }
  .empty { color: var(--muted); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; padding: 22px 0; }
  .note { font-size: 11px; color: var(--muted); margin-top: 26px; line-height: 1.6; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%,20px); background: var(--ink);
    color: var(--paper); padding: 11px 20px; font-size: 13px; border-radius: 2px; z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%,0); }
  @media (prefers-reduced-motion: reduce) { #app * { transition: none !important; } }
  @media (max-width: 520px) { .body p { font-size: 18.5px; } }
</style>

<div class="bar">
  <button class="icon" id="backBtn" title="Retour" style="display:none">‹</button>
  <div class="title" id="barTitle">Bibliothèque</div>
  <button class="icon" id="bmBtn" title="Marque-page" style="display:none">✦</button>
  <button class="icon" id="nightBtn" title="Mode nuit">◐</button>
  <button class="icon" id="menuBtn" title="Sommaire" style="display:none">☰</button>
</div>
<div class="progress"><i id="progBar"></i></div>

<!-- BIBLIOTHÈQUE -->
<section class="view on" id="vLib"><div class="wrap">
  <h1 class="libhead">Bibliothèque</h1>
  <p class="libsub" id="libCount"></p>
  <input class="search" id="search" type="search" placeholder="Rechercher par titre, genre ou auteur…">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="noRes" style="display:none">Aucun livre ne correspond à cette recherche.</p>
</div></section>

<!-- PAGE DE GARDE -->
<section class="view" id="vCover"><div class="wrap">
  <div class="gcover" id="gCover"></div>
  <h1 class="gtitle" id="gTitle"></h1>
  <p class="gauth" id="gAuth"></p>
  <div class="gchips" id="gChips"></div>
  <p class="gres" id="gRes"></p>
  <div class="gstat">
    <div class="gpct" id="gPct">0 %</div>
    <div class="glab" id="gLab"></div>
    <div class="gbar"><i id="gBar"></i></div>
  </div>
  <button class="primary" id="readBtn">Commencer la lecture</button>
  <button class="ghost" id="tocBtn">Sommaire et marque-pages</button>
  <button class="ghost" id="resetBtn">Réinitialiser ma progression</button>
</div></section>

<!-- LECTURE -->
<section class="view" id="vRead"><div class="wrap">
  <div class="chapnum" id="chapNum"></div>
  <h2 id="chapTitle"></h2>
  <div class="pov" id="chapPov"></div>
  <div class="body" id="chapBody"></div>
  <div class="endmark"><div class="navrow">
    <button class="navbtn" id="prevBtn">← Précédent</button>
    <button class="navbtn" id="nextBtn">Suivant →</button>
  </div></div>
</div></section>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><span id="dTitle">Sommaire</span><button class="icon" id="closeBtn">✕</button></div>
  <div class="tabs">
    <button class="tab on" id="tabChaps">Chapitres</button>
    <button class="tab" id="tabBms">Marque-pages</button>
  </div>
  <div id="paneChaps"></div>
  <div id="paneBms" style="display:none"></div>
  <p class="note" id="statusNote"></p>
</aside>
<div class="toast" id="toast"></div>

<div id="couvertures" hidden><template class="couv" data-livre="castellano"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Couverture : Le Prix du Silence, Don Castellano">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0d10"/>
      <stop offset=".5" stop-color="#2a1216"/>

    <radialGradient id="lampe" cx=".5" cy=".28" r=".6">
      <stop offset="0" stop-color="#e8c98f" stop-opacity=".38"/>

    <linearGradient id="nappe" x1="0" y1="0" x2="0" y2="1">

    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">

    </linearGradient>
    <clipPath id="cadreC"><rect width="600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#cadreC)">
    <rect width="600" height="900" fill="url(#fond)"/>

    <!-- fenêtres hautes, façade de palazzo en arrière-plan, très sombre -->
    <g opacity=".28" fill="#000">
      <rect x="60" y="0" width="60" height="230" rx="30"/>
      <rect x="270" y="0" width="60" height="230" rx="30"/>

    <!-- ombre portée douce -->
    <ellipse cx="300" cy="565" rx="330" ry="14" fill="#000" opacity=".18"/>

    <!-- assiette centrale -->
    <ellipse cx="300" cy="660" rx="86" ry="30" fill="#efe7d8"/>

</svg></template><template class="couv" data-livre="lune"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Couverture : La Part de Lune">
  <defs>

  <g clip-path="url(#cadre)">
    <!-- ciel -->
    <rect width="600" height="900" fill="url(#ciel)"/>

    <!-- étoiles -->
    <g fill="#f4e9c8">
      <circle cx="62" cy="88" r="1.2" opacity=".7"/><circle cx="141" cy="52" r=".9" opacity=".5"/>
      <circle cx="503" cy="70" r="1.4" opacity=".8"/><circle cx="548" cy="132" r=".8" opacity=".5"/>

    <!-- halo -->

    <!-- lune : entière, avec sa "part" manquante (éclipse en croissant fin) -->

    <text x="300" y="822" text-anchor="middle" fill="#f2f8f6" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="1">La Dette</text>
    <text x="300" y="866" text-anchor="middle" fill="#f2f8f6" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" letter-spacing="1">de Verre</text>
    <line x1="260" y1="882" x2="340" y2="882" stroke="url(#laiton)" stroke-width="1"/>
  </g>
</svg></template></div>
<script>

const app = document.getElementById('app'), $ = id => document.getElementById(id);
const KEY = 'liseuse:v2';
let S = { night:false, livres:{} };   // livres[id] = {chap, scroll, bookmarks[], vus[]}
let vue = 'lib', livre = null, ready = false, filtre = null;

function etat(id){
  if (!S.livres[id]) S.livres[id] = { chap:0, scroll:0, bookmarks:[], vus:[] };
  return S.livres[id];
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }

async function load(){
  try {
    const r = await window.storage.get(KEY);
    if (r && r.value) Object.assign(S, JSON.parse(r.value));
    else {
      try { const old = await window.storage.get('castellano:etat');
        if (old && old.value){ const o = JSON.parse(old.value);
          S.night = !!o.night;
          S.livres.castellano = { chap:o.chap||0, scroll:o.scroll||0, bookmarks:o.bookmarks||[], vus:[] };
          for (let i=0;i<=(o.chap||0);i++) S.livres.castellano.vus.push(i);
        }
      } catch(e){}
    }
    $('statusNote').textContent = 'Progression et marque-pages enregistrés automatiquement.';
  } catch(e){ $('statusNote').textContent = 'Sauvegarde indisponible : la progression ne sera pas conservée.'; }
  ready = true;
}
async function save(){ if(!ready) return; try{ await window.storage.set(KEY, JSON.stringify(S)); }catch(e){} }

/* ---- pourcentage lu ---- */
function pct(b){
  const e = S.livres[b.id]; if (!e || !e.vus) return 0;
  if (!b.chapitres.length) return 0;
  return Math.round(e.vus.length / b.chapitres.length * 100);
}
function svgDe(id){
  const t = document.querySelector(`#couvertures template[data-livre="${id}"]`);
  return t ? t.innerHTML : '';
}
function couverture(b, petit){
  if (b.couv) { const s = svgDe(b.id);
    if (s) return `<div class="cover" style="padding:0;background:#0b0f1e">${s}</div>`; }
  return `<div class="cover" style="background:linear-gradient(150deg,${b.couleur},#14161a)">
     <div class="ca">${b.genres[0].toUpperCase()}</div>
     <div><div class="ct">${b.titre}</div>
     <div class="ca" style="margin-top:8px">${b.annee}</div></div></div>`;
}

/* ---- bibliothèque ---- */
function tousGenres(){ const s=new Set(); BOOKS.forEach(b=>b.genres.forEach(g=>s.add(g))); return [...s].sort(); }

function renderLib(){
  $('libCount').textContent = BOOKS.length + (BOOKS.length>1 ? ' livres' : ' livre');
  $('chips').innerHTML = tousGenres().map(g=>`<button class="chip ${filtre===g?'on':''}" data-g="${g}">${g}</button>`).join('');
  [...$('chips').querySelectorAll('[data-g]')].forEach(c=>{
    c.onclick = () => { filtre = (filtre===c.dataset.g ? null : c.dataset.g); renderLib(); };
  });
  const q = $('search').value.trim().toLowerCase();
  const res = BOOKS.filter(b=>{
    const okG = !filtre || b.genres.includes(filtre);
    const hay = (b.titre+' '+b.auteur+' '+b.genres.join(' ')+' '+b.resume).toLowerCase();
    return okG && (!q || hay.includes(q));
  });
  $('noRes').style.display = res.length ? 'none' : '';
  $('grid').innerHTML = res.map(b=>{
    const p = pct(b);
    return `<button class="card" data-b="${b.id}">${couverture(b)}
      <div class="cmeta"><b>${b.titre}</b>${b.serie ? `<div class="cpct" style="margin-top:3px">${b.serie}</div>` : ''}
        <div class="cbar"><i style="width:${p}%"></i></div>
        <div class="cpct">${p} % lu · ${b.statut}</div></div></button>`;
  }).join('');
  [...$('grid').querySelectorAll('[data-b]')].forEach(c=>{
    c.onclick = () => ouvrirLivre(c.dataset.b);
  });
}
$('search').oninput = renderLib;

/* ---- page de garde ---- */
function ouvrirLivre(id){
  livre = BOOKS.find(b=>b.id===id);
  app.style.setProperty('--accent', livre.couleur);
  const e = etat(id), p = pct(livre);
  $('gCover').innerHTML = couverture(livre);
  $('gTitle').textContent = livre.titre;
  $('gAuth').textContent = (livre.serie ? livre.serie.toUpperCase() + '  ·  ' : '') + livre.auteur.toUpperCase();
  $('gChips').innerHTML = [livre.statut, ...livre.genres].map(g=>`<span>${g}</span>`).join('');
  $('gRes').textContent = livre.resume;
  $('gPct').textContent = p + ' %';
  $('gBar').style.width = p + '%';
  $('gLab').textContent = !livre.chapitres.length ? 'En préparation · aucun chapitre publié'
    : p===0 ? 'Jamais ouvert · ' + livre.chapitres.length + ' chapitres'
    : (p===100 ? 'Terminé · ' + livre.chapitres.length + ' chapitres'
    : 'Lu · reprise au chapitre ' + livre.chapitres[e.chap].n + ' sur ' + livre.chapitres.length);
  const vide = !livre.chapitres.length;
  $('readBtn').textContent = vide ? 'Bientôt disponible' : (p===0 ? 'Commencer la lecture' : 'Reprendre au chapitre ' + livre.chapitres[e.chap].n);
  $('readBtn').disabled = vide; $('readBtn').style.opacity = vide ? '.45' : '';
  $('tocBtn').style.display = vide ? 'none' : '';
  $('resetBtn').style.display = p===0 ? 'none' : '';
  aller('cover');
}

function aller(v, restore){
  vue = v;
  $('vLib').classList.toggle('on', v==='lib');
  $('vCover').classList.toggle('on', v==='cover');
  $('vRead').classList.toggle('on', v==='read');
  $('backBtn').style.display = v==='lib' ? 'none' : '';
  $('menuBtn').style.display = v==='read' ? '' : 'none';
  $('bmBtn').style.display = v==='read' ? '' : 'none';
  $('barTitle').textContent = v==='lib' ? 'Bibliothèque'
    : (v==='cover' ? livre.titre : 'Ch. ' + (livre.chapitres[etat(livre.id).chap]||{n:''}).n);
  if (v==='read') renderChap(restore); else { $('progBar').style.width = '0'; window.scrollTo(0,0); }
  if (v==='lib') { livre = null; app.style.setProperty('--accent', '#6d1f2c'); renderLib(); }
}

/* ---- lecture ---- */
function renderChap(restore){
  const e = etat(livre.id), c = livre.chapitres[e.chap];
  $('chapNum').textContent = 'Chapitre ' + c.n;
  $('chapTitle').textContent = c.t;
  $('chapPov').textContent = 'Point de vue — ' + c.pov;
  $('chapBody').innerHTML = c.p.map((t,i)=>`<p data-i="${i}">${t}</p>`).join('');
  $('barTitle').textContent = 'Ch. ' + c.n + ' · ' + c.t;
  $('prevBtn').disabled = e.chap===0;
  $('nextBtn').disabled = e.chap===livre.chapitres.length-1;
  if (!e.vus.includes(e.chap)) { e.vus.push(e.chap); save(); }
  buildChaps(); buildBms(); updateBm();
  window.scrollTo(0, restore ? (e.scroll||0) : 0);
  updateProgress();
}
function updateProgress(){
  if (vue!=='read') return;
  const e = etat(livre.id);
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const dans = h>0 ? Math.min(window.scrollY/h,1) : 0;
  $('progBar').style.width = ((e.chap+dans)/livre.chapitres.length*100).toFixed(1) + '%';
}
function paraCourant(){
  const ps = [...document.querySelectorAll('#chapBody p')], mid = innerHeight*0.3;
  let best = 0; ps.forEach((p,i)=>{ if (p.getBoundingClientRect().top<=mid) best=i; }); return best;
}
function updateBm(){ const e=etat(livre.id); $('bmBtn').classList.toggle('on', e.bookmarks.some(b=>b.chap===e.chap)); }
function toggleBm(){
  const e = etat(livre.id), para = paraCourant();
  const i = e.bookmarks.findIndex(b=>b.chap===e.chap && b.para===para);
  if (i>-1){ e.bookmarks.splice(i,1); toast('Marque-page retiré'); }
  else {
    const t = livre.chapitres[e.chap].p[para]||'';
    e.bookmarks.push({ chap:e.chap, para, extrait:t.slice(0,90)+(t.length>90?'…':''),
      date:new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) });
    e.bookmarks.sort((a,b)=>a.chap-b.chap||a.para-b.para);
    toast('Marque-page posé — chapitre ' + livre.chapitres[e.chap].n);
  }
  updateBm(); buildBms(); save();
}
function buildChaps(){
  const e = etat(livre.id);
  $('dTitle').textContent = livre.titre;
  $('paneChaps').innerHTML = livre.chapitres.map((c,i)=>
    `<button class="chapline ${i===e.chap?'current':''}" data-go="${i}">
      <em>Chapitre ${c.n} · ${c.pov}${e.vus.includes(i)?' · lu':''}</em>${c.t}</button>`).join('');
  [...$('paneChaps').querySelectorAll('[data-go]')].forEach(b=>{
    b.onclick = () => { e.chap = +b.dataset.go; e.scroll = 0; save(); fermer(); aller('read', false); };
  });
}
function buildBms(){
  const e = etat(livre.id), pane = $('paneBms');
  if (!e.bookmarks.length){ pane.innerHTML = '<p class="empty">Aucun marque-page. Touchez ✦ en haut pour marquer le passage où vous êtes.</p>'; return; }
  pane.innerHTML = e.bookmarks.map((b,i)=>
    `<div><button class="bmrow" data-bm="${i}"><small>Chapitre ${livre.chapitres[b.chap].n} · ${b.date}</small>
      <span>« ${b.extrait} »</span></button><button class="del" data-del="${i}">Supprimer</button></div>`).join('');
  [...pane.querySelectorAll('[data-bm]')].forEach(x=>{
    x.onclick = () => { const bm = e.bookmarks[+x.dataset.bm]; e.chap = bm.chap; save(); fermer(); aller('read', false);
      setTimeout(()=>{ const p = document.querySelector(`#chapBody p[data-i="${bm.para}"]`);
        if (p) p.scrollIntoView({behavior:'smooth',block:'center'}); }, 60); };
  });
  [...pane.querySelectorAll('[data-del]')].forEach(x=>{
    x.onclick = () => { e.bookmarks.splice(+x.dataset.del,1); buildBms(); updateBm(); save(); toast('Marque-page supprimé'); };
  });
}

/* ---- contrôles ---- */
function ouvrir(){ $('drawer').classList.add('open'); $('scrim').classList.add('open'); }
function fermer(){ $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); }
$('menuBtn').onclick = ouvrir; $('closeBtn').onclick = fermer; $('scrim').onclick = fermer;
$('tocBtn').onclick = () => { buildChaps(); buildBms(); ouvrir(); };
$('bmBtn').onclick = toggleBm;
$('backBtn').onclick = () => { if (vue==='read') ouvrirLivre(livre.id); else aller('lib'); };
$('readBtn').onclick = () => aller('read', true);
$('resetBtn').onclick = () => {
  if (!confirm('Effacer votre progression et vos marque-pages pour ce livre ?')) return;
  S.livres[livre.id] = { chap:0, scroll:0, bookmarks:[], vus:[] }; save(); ouvrirLivre(livre.id); toast('Progression réinitialisée');
};
$('nightBtn').onclick = () => { S.night = !S.night; app.classList.toggle('night', S.night);
  $('nightBtn').classList.toggle('on', S.night); save(); };
$('prevBtn').onclick = () => { const e=etat(livre.id); if(e.chap>0){ e.chap--; e.scroll=0; save(); renderChap(false); } };
$('nextBtn').onclick = () => { const e=etat(livre.id); if(e.chap<livre.chapitres.length-1){ e.chap++; e.scroll=0; save(); renderChap(false); } };
$('tabChaps').onclick = () => { $('tabChaps').classList.add('on'); $('tabBms').classList.remove('on');
  $('paneChaps').style.display=''; $('paneBms').style.display='none'; };
$('tabBms').onclick = () => { $('tabBms').classList.add('on'); $('tabChaps').classList.remove('on');
  $('paneBms').style.display=''; $('paneChaps').style.display='none'; };

let tmr;
addEventListener('scroll', () => {
  if (vue!=='read') return;
  updateProgress(); updateBm();
  etat(livre.id).scroll = scrollY;
  clearTimeout(tmr); tmr = setTimeout(save, 600);
}, {passive:true});
addEventListener('keydown', e => {
  if (vue==='read'){ if(e.key==='ArrowRight') $('nextBtn').click(); if(e.key==='ArrowLeft') $('prevBtn').click(); }
  if (e.key==='Escape') fermer();
});

(async () => { await load(); app.classList.toggle('night', !!S.night);
  $('nightBtn').classList.toggle('on', !!S.night); renderLib(); })();
</script>
</div>
