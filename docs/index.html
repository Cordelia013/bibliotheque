juste qu'ils savent ce que j'ai fait et que je ne peux plus le défaire. Alors quand on m'a demandé d'appeler Serena pour lui fixer un rendez-vous, j'ai appelé.", "— Qui, Enzo. Un nom.", "Il posa la cuillère.", "— Gianfranco Ferraro. Mais il n'était pas seul quand il me l'a demandé.", "— Qui d'autre ?", "Et Enzo dit, avec la simplicité d'un homme qui a cessé de calculer :", "— Ta belle-mère.", "Le café continua autour de nous. Quelqu'un rit au comptoir. La machine siffla.", "— Madame Castellano, dis-je.", "— Elle a signé l'entrée des Ferraro dans la maison trois semaines avant que Salvatore n'emprunte. Elle savait que Serena parlait. Elle a dit — il ferma les yeux pour citer exactement — « il faut protéger cette famille des femmes qui la quittent ».", "Je me levai. Je pris mon manteau.", "— Tu vas venir avec moi chez Renzi.", "— Ils me tueront.", "— Probablement, dis-je. Mais pas aujourd'hui. Et si tu restes ici, ils te tueront de toute façon, en te laissant simplement croire jusqu'au bout que tu es utile.", "Enzo leva les yeux vers moi, et je vis dans son visage quelque chose que je n'avais jamais vu chez lui : un homme en train de choisir.", "Il se leva.", "— Tu paies les cafés, cette fois, dit-il."]}, {"n": 23, "t": "Ce que ma mère a fait", "pov": "Salvatore", "p": ["On me libéra le samedi à onze heures quarante.", "Personne ne m'expliqua rien. Renzi me tendit mes affaires dans une enveloppe kraft, me fit signer trois papiers, et me dit une seule phrase, sans lever les yeux :", "— Vous devriez remercier quelqu'un.", "Dehors, il pleuvait. Bruno m'attendait, adossé à la voiture, plus vieux de dix ans en quatre jours.", "— Qui ? demandai-je.", "— Elle.", "Je restai sous la pluie.", "— Elle a amené le petit, dit Bruno. Enzo. Elle l'a fait entrer dans ce commissariat en le tenant par le bras comme on emmène un gamin chez le dentiste, et elle l'a fait parler pendant six heures. Il y a un procès-verbal de vingt-deux pages.", "— Contre les Ferraro.", "Bruno ne bougeait pas.", "— Pas seulement.", "Je compris à son visage avant qu'il n'ouvre la bouche, et je crois que je sus aussi, à cet instant, que je le savais depuis longtemps sans avoir jamais voulu le formuler.", "— Dis-le, Bruno.", "— Ta mère a signé l'accord avec Gianfranco Ferraro le 28 octobre. Trois semaines avant que tu empruntes. C'est elle qui l'a envoyé te tendre sa carte sur le trottoir d'Aldrovandi.", "La pluie tombait dans mon col.", "— Et Serena ?", "— Elle savait que Serena parlait à Livia. Elle a fait passer le message qu'il fallait « régler la question ». Elle jure qu'elle n'a jamais demandé une mort. C'est peut-être même vrai. C'est comme ça que ça marche, Salvatore : personne ne demande jamais une mort. On dit « réglez ça » à des gens qui n'ont qu'une façon de régler les choses.", "Je montai dans la voiture. Bruno conduisit.", "Ma mère m'attendait dans la bibliothèque, droite dans son fauteuil, les mains croisées sur ses genoux, avec ce port de tête qu'elle avait à l'enterrement de mon père.", "— Tu es rentré, dit-elle.", "— Ne parle pas.", "— Salvatore—", "— Ne parle pas.", "Je m'assis en face d'elle. Je regardai cette femme qui m'avait appris à lire, qui avait tenu cette maison pendant les douze années où mon père était en fuite, qui avait enterré un mari et deux frères sans pleurer une seule fois en public.", "— Tu as fait tuer une fille de trente et un ans.", "— J'ai protégé ce que ton père m'a laissé.", "— Non. Tu as protégé ce que tu crois qu'il t'a laissé. Et pour ça, tu as fait entrer dans cette maison les gens qu'il a tenus dehors pendant douze ans, et tu as tué la seule personne qui pouvait les faire tomber.", "— J'ai fait ce que tu n'as jamais eu le courage de faire.", "— Oui, dis-je. C'est exactement ça.", "Je me levai.", "— Tu as jusqu'à lundi pour préparer tes affaires. La maison de Bellaria est à toi. Tu y vivras. Tu ne remettras pas les pieds ici et tu ne signeras plus rien au nom des Castellano.", "Pour la première fois de ma vie, je vis ma mère perdre son visage.", "— Tu ne peux pas. Je suis ta mère.", "— Oui, dis-je depuis la porte. Et pendant six ans, une autre femme a tenu cette maison à ta place, et vous avez été trois — toi, moi, et lui là-haut sur son portrait — à faire comme si elle n'existait pas.", "Je sortis.", "Dans le couloir, je m'adossai au mur et je restai là un moment, et je ne pensai à rien du tout, sinon à une voiture arrêtée sous un réverbère devant une fenêtre allumée."]}, {"n": 24, "t": "Le calcul de mon père", "pov": "Damiano", "p": ["Mon père a mis quarante-huit heures à lire le deuxième dossier.", "Il l'a lu au bout du ponton, une page à la fois, en laissant la canne posée à côté de lui sans la toucher. Quand il a eu fini, il est rentré, il a mis ses lunettes sur la table et il a dit :", "— Fabrizio Ferraro. C'est lui qui a donné l'ordre en 2003. Il a soixante-treize ans et il vit à Lugano.", "— Je peux y être demain.", "Mon père me regarda comme si j'avais dix ans.", "— Assieds-toi, Damiano.", "Je restai debout.", "— Vingt-trois ans, dit-il. J'ai attendu vingt-trois ans. Tu crois que c'était pour aller tirer sur un vieillard dans une villa suisse ?", "— Alors c'était pour quoi ?", "— Pour ça.", "Il posa la main sur le dossier.", "— Pour avoir un jour la preuve. Parce qu'une preuve, ça se donne à un procureur, et un procureur, ça enterre un nom pendant trois générations. Une balle, ça fait un martyr et ça fait un fils qui, dans vingt ans, viendra chercher le mien.", "Il dit cela sans emphase, comme un homme qui annonce la météo.", "— Livia Sarti m'a apporté ce que je ne pouvais pas obtenir. Elle savait que je pouvais choisir la mauvaise voie. Elle me l'a donné quand même.", "— Elle vous a fait confiance.", "— Non. Elle a parié. Ce n'est pas la même chose, et c'est bien plus généreux.", "Il ôta ses lunettes.", "— Maintenant, parlons de toi.", "J'ai su à ce moment-là que la conversation que j'évitais depuis six semaines venait d'arriver.", "— Elle sait, pour la parcelle 114, dit mon père.", "— Oui.", "— Elle ne t'a pas détruit.", "— Non.", "— Tu sais pourquoi ?", "— Parce qu'elle a besoin de moi encore quelques mois.", "Mon père eut ce sourire triste que je lui connais depuis l'enfance, celui qu'il a eu le jour de l'enterrement de mon frère.", "— Tu es un idiot. Elle ne t'a pas détruit parce qu'elle est capable de tenir deux choses vraies dans la même main sans en lâcher une. C'est une qualité extrêmement rare, et elle va te coûter très cher.", "— Pourquoi ?", "— Parce qu'elle tient aussi son mari dans l'autre main. Et qu'un homme comme toi finira tôt ou tard par lui demander de choisir.", "Il se leva et alla jusqu'à la fenêtre.", "— Ne le fais pas, Damiano.", "— Elle me le devra, si je—", "— Elle ne te devra rien. C'est exactement pour ça que tu l'aimes, et tu es en train de te préparer à lui reprocher la seule chose qui te la rend précieuse.", "Il regardait le lac.", "— Je vais te dire ce qui va se passer. Les Ferraro vont comprendre d'où vient le dossier d'Aldini. Ils ne peuvent pas toucher un procureur et ils ne peuvent plus toucher Serena Vitale. Alors ils frapperont là où ça reste possible et où ça reste indolore pour eux.", "Je me redressai.", "— Sarti.", "— Un homme de soixante-huit ans qui vit dans une maison sans gardes avec un figuier dans le jardin, dit mon père. Envoie deux hommes ce soir. Discrètement. Sans le lui dire.", "Je les ai envoyés à dix-neuf heures.", "Ils sont arrivés vingt minutes trop tard."]}, {"n": 25, "t": "Le figuier", "pov": "Livia", "p": ["Ma mère m'a appelée à dix-neuf heures douze.", "Elle n'a pas pleuré. Elle a dit : « Ils ont pris ton père », et elle a dit ensuite, parce qu'elle est ma mère et qu'elle a passé quarante ans à côté d'un homme de ce monde : « Il a laissé sa montre sur la table. Il l'enlève toujours avant de partir quand il sait qu'il ne reviendra pas. »", "J'ai conduit trop vite. Je ne me souviens pas du trajet.", "La porte du jardin était ouverte. Les deux hommes de Damiano étaient arrivés depuis quelques minutes ; l'un d'eux tenait ma mère par les épaules dans la cuisine.", "Sur la table, la montre. À côté, une enveloppe.", "Je l'ai ouverte debout.", "Une photographie Polaroid : mon père, assis sur une chaise, dans une pièce sans fenêtre. Les yeux ouverts. Vivant.", "Et au dos, à la main :", "« Le port contre l'homme. Vous avez quarante-huit heures. Vous savez à qui parler. »", "Je suis restée immobile pendant peut-être une minute.", "Puis j'ai fait ce que je fais toujours.", "J'ai posé la photo sur la table, j'ai sorti mon carnet, et j'ai commencé à écrire. La pièce : béton peint, une prise électrique ancienne, un radiateur en fonte à trois éléments. La chaise : bois clair, cannage. La lumière : plafonnier nu, ombre courte, donc plafond bas. L'heure sur la photo : impossible. Les vêtements : ceux du matin, il n'a donc pas été déplacé longtemps.", "— Madame, dit l'homme de Damiano, il faut qu'on vous emmène.", "— Non.", "— Nos ordres—", "— Vos ordres viennent d'un homme qui est mon associé, pas mon propriétaire. Dites-lui de venir. Dites-lui d'apporter les plans cadastraux de toutes les propriétés Ferraro du secteur nord. Et appelez Bruno Castellano.", "Il hésita.", "— Castellano, madame ?", "— Vous m'avez entendue.", "Ma mère leva la tête. Ses yeux étaient secs et terribles.", "— Livia. Ne donne pas le port.", "— Maman—", "— Ton père a donné le port en 2003 et il a gardé un enfant. Non. Il a gardé le port et il a perdu un enfant, et il en est mort un peu chaque jour pendant vingt-trois ans. Si tu leur donnes quoi que ce soit, tu n'auras pas sauvé ton père. Tu lui auras juste appris qu'il avait raison de calculer.", "Je m'assis en face d'elle et je lui pris les mains.", "— Je ne vais rien leur donner, dis-je.", "— Alors qu'est-ce que tu vas faire ?", "Et je m'entendis dire, d'une voix parfaitement calme, une phrase que je ne m'étais jamais crue capable de prononcer :", "— Je vais réunir dans une même pièce les deux familles qui se détestent le plus dans cette ville, et je vais leur expliquer qu'à partir de ce soir, c'est moi qui décide.", "À vingt-deux heures quarante, la voiture de Damiano se gara devant la maison.", "À vingt-trois heures cinq, celle de Salvatore Castellano se gara derrière."]}, {"n": 26, "t": "La table de cuisine", "pov": "Salvatore", "p": ["Je n'étais jamais entré dans cette maison.", "Six ans, trois ans de mariage, et je n'avais jamais dépassé le paillasson. Je le compris en franchissant la porte, et cette pensée me suivit tout le long du couloir comme un chien.", "Ils étaient dans la cuisine. Rocchi fils, debout, adossé à l'évier. La mère de Livia, assise, les mains autour d'une tasse qu'elle ne buvait pas. Et Livia au bout de la table, un carnet ouvert devant elle, des plans cadastraux étalés sur toute la longueur.", "Elle leva les yeux.", "— Merci d'être venu.", "— Tu as demandé Bruno.", "— J'ai demandé Bruno parce que je pensais que tu ne viendrais pas.", "— Je sais, dis-je.", "Damiano Rocchi et moi nous regardâmes pour la première fois de notre vie à moins de trois mètres. Il était plus grand que sur les photos de surveillance. Il ne me tendit pas la main et je ne lui tendis pas la mienne, et ce fut, compte tenu de tout, la chose la plus civilisée dont nous étions capables.", "Livia poussa la photographie Polaroid vers moi.", "— Regarde le radiateur.", "Je regardai. Trois éléments, fonte, modèle ancien.", "— Et alors ?", "— Alors les Ferraro possèdent onze biens dans le secteur nord. Neuf sont des entrepôts modernes, chauffage soufflant. Un est un bureau. Le onzième est une ancienne conciergerie de 1931 rachetée en 2019 et jamais rénovée.", "Elle posa le doigt sur un plan.", "— Là. Sous-sol, plafond bas, radiateurs d'origine.", "Damiano se pencha.", "— Ce n'est pas une preuve.", "— Non. C'est une probabilité de soixante-dix pour cent, et nous avons trente-huit heures. Vous avez mieux ?", "Personne n'avait mieux.", "Elle se tourna vers moi.", "— J'ai besoin de deux choses de toi, Salvatore. La première : le nom de l'homme des Ferraro qui gère leurs gardiennages. Tu l'as forcément croisé depuis que tu leur as emprunté onze millions.", "— Vitucci, dis-je. Marco Vitucci.", "— Bien. La deuxième : tu vas appeler Gianfranco Ferraro demain matin et tu vas lui proposer le port.", "La cuisine se figea.", "— Pardon ?", "— Tu vas lui dire que tu as appris l'enlèvement, que tu as compris qu'ils tenaient enfin de quoi me plier, et que tu veux être celui qui négocie. Tu lui proposes de racheter ma participation avec leur argent. Tu lui offres exactement ce dont il a envie depuis quatre mois : être dans la pièce quand ça se décide.", "— Tu veux que je le fasse venir.", "— Je veux qu'il ait une réunion à onze heures, dit-elle, pendant qu'une conciergerie de 1931 sera vide de la moitié de ses hommes.", "Je regardai cette femme, à cette table de cuisine, avec son carnet et ses trois couleurs de stylo, en train d'organiser une opération contre la plus dangereuse famille de cette ville avec les moyens du bord et deux hommes qui se détestaient.", "— Il ne me croira pas, dis-je.", "— Si.", "— Pourquoi ?", "Elle soutint mon regard.", "— Parce que tu as passé six ans à être exactement le genre d'homme qu'il croira. Ça sert, aujourd'hui. C'est même la première fois que ça sert.", "Ce n'était pas une cruauté. C'était pire : c'était exact.", "— D'accord, dis-je.", "Damiano s'écarta de l'évier.", "— Et moi ?", "— Vous, dit Livia sans lever la tête, vous me donnez six hommes et vous restez ici.", "— Hors de question.", "— Votre père a attendu vingt-trois ans pour obtenir un procès. Si un Rocchi est vu à trois cents mètres de cette conciergerie, il n'aura jamais son procès. Vous restez.", "Damiano ouvrit la bouche. La referma.", "Et je vis passer sur son visage quelque chose que je reconnus immédiatement, parce que je l'avais porté moi-même pendant six ans : l'expression d'un homme qui vient de comprendre qu'il n'est pas le personnage principal."]}, {"n": 27, "t": "Ce qu'il aurait dû dire", "pov": "Livia", "p": ["À trois heures du matin, tout le monde dormait sauf nous deux.", "Ma mère était montée. Damiano était reparti chercher ses hommes. Les plans étaient encore sur la table, annotés, recouverts de tasses.", "Salvatore n'était pas parti.", "Il s'était assis dans le fauteuil du salon — celui de mon père — et il regardait le jardin noir par la porte-fenêtre. Je vins m'asseoir en face avec deux cafés.", "— Tu ne dors pas, dit-il.", "— Toi non plus.", "— Moi je n'ai pas dormi depuis avril.", "Nous restâmes un moment silencieux. Dehors, le figuier bougeait un peu.", "— C'est ici, dit-il soudain. La voiture. C'était juste là, au bout de la rue.", "— Je sais. Renzi m'a montré la photo.", "Il ferma les yeux.", "— Je ne suis pas venu pour te demander quelque chose, dit-il. C'est ce que je veux que tu saches. Je suis venu, je me suis garé, et j'ai compris au bout de dix minutes que je n'avais rien à demander qui ne soit pas une demande. Alors je suis resté.", "— Pourquoi deux heures ?", "— Parce que ta lumière était allumée.", "Il rouvrit les yeux et me regarda, et il y avait sur son visage quelque chose que je ne lui avais jamais vu : aucun calcul.", "— Livia, je vais dire quelque chose, et je te demande de me laisser le dire en entier, parce que si tu m'interromps je vais recommencer à négocier et ce n'est pas ce que je veux.", "Je ne dis rien.", "— Je t'ai épousée en secret parce que j'avais peur. Pas de tes ennemis. Des miens ? Non plus. J'avais peur que le jour où ce serait public, tu deviennes quelque chose que je pourrais perdre. Tant que personne ne savait, tu n'étais pas un enjeu. Tu étais juste à moi, dans le noir, sans que ça coûte rien.", "Il posa les mains sur les genoux.", "— Et j'ai passé trois ans à te faire payer ma peur en te faisant croire que c'était de la stratégie. J'ai dit à tout le monde que tu étais indispensable et je ne te l'ai jamais dit à toi. J'ai laissé une autre femme s'asseoir à ma droite parce qu'avec elle il n'y avait rien à perdre. Et le soir du dix-sept mars, j'ai retourné mon téléphone face contre le bois parce que je ne voulais pas d'un problème, et le problème c'était toi qui étais en train de mourir.", "Sa voix ne tremblait pas. C'était le pire.", "— Je ne te demande pas de revenir. Je ne te demande pas de me pardonner. Je vais signer le divorce lundi, avant le 17 mars, parce que c'est la seule chose que je peux te donner qui ne soit pas une demande déguisée.", "Il s'arrêta.", "— Voilà. C'est la phrase que tu m'as demandée sous le figuier. J'ai mis onze mois à la trouver.", "Je regardai mes mains autour de la tasse.", "Il y a six ans, cette déclaration m'aurait détruite de bonheur. Il y a six mois, elle m'aurait détruite tout court.", "Cette nuit-là, elle ne me détruisit pas. Elle se posa quelque part en moi, tranquillement, comme une chose vraie arrivée trop tard et qui reste vraie quand même.", "— Merci, dis-je.", "Il hocha la tête. Il comprit exactement ce que ce merci voulait dire, et il ne demanda rien de plus, et ce fut, en six ans, la première fois qu'il me comprenait.", "— Salvatore.", "— Oui ?", "— Demain, quand tu appelleras Ferraro. Il va te proposer quelque chose. Il va te dire qu'il peut effacer les onze millions.", "— Je sais.", "— Je voulais juste te dire que je sais aussi. Et que je te laisse choisir sans surveillance.", "Il eut un sourire étrange, presque un rire.", "— Tu me fais confiance ?", "— Non, dis-je. Je te donne l'occasion d'être un homme à qui je pourrais."]}, {"n": 28, "t": "Onze heures", "pov": "Salvatore", "p": ["Gianfranco Ferraro me reçut dans un bureau qui sentait le neuf, avec une vue sur le port que je lui avais offerte moi-même en signant au mois de novembre.", "— Don Castellano. Vous avez été rapide.", "— J'ai été humilié pendant onze mois. On finit par apprendre.", "Il sourit. Il aimait cette phrase. Les hommes comme lui adorent croire qu'ils assistent à la naissance de leur propre créature.", "— Asseyez-vous. Parlons du port.", "Nous parlâmes du port pendant quarante minutes. Il était onze heures vingt. À la conciergerie de la via Pratello, à six kilomètres d'ici, quatre hommes de Rocchi et deux de Bruno devaient être en train de franchir une porte de service.", "— Il y a un point à régler, dit Ferraro à onze heures quarante-huit. Votre dette.", "— Onze millions.", "— Onze millions deux cents. Je peux l'effacer.", "Il posa les mains à plat sur le bureau, comme un prêtre.", "— Vous nous cédez la clause de préemption de l'article 14, vous signez une délégation de gestion sur les sociétés portuaires, et la dette disparaît. Votre famille est sauvée, Don Castellano. Vous redevenez ce que votre père était.", "Ce fut le mot « père » qui me le fit voir.", "Parce que mon père, lui, avait tenu ces gens dehors pendant douze ans, et qu'il était mort pauvre, haï, et propriétaire de sa maison.", "— Et Sarti ? demandai-je.", "— Quoi, Sarti ?", "— Le vieux. Vous le relâchez ?", "Ferraro haussa les épaules avec une légèreté qui me glaça.", "— Quand la femme aura signé. Ou pas. Franchement, à ce stade, c'est un détail administratif.", "Onze heures cinquante-deux.", "J'avais devant moi un stylo, un contrat, et la fin de tous mes problèmes. C'était vrai. Ce n'était même pas une illusion : il pouvait effacer cette dette, et ma famille aurait tenu dix ans de plus.", "Je pensai à Livia dans ce salon, à trois heures du matin : je te donne l'occasion d'être un homme à qui je pourrais.", "Et je compris enfin, avec onze mois de retard, ce qu'elle m'avait dit le premier soir, en posant un dossier sur une nappe blanche.", "Tu es le Don parce que je t'ai fait Don.", "Elle ne parlait pas des comptes. Elle parlait de ça. De cette seconde précise, qui arrive une fois ou deux dans une vie, où l'on décide de ce qu'on est quand plus personne ne calcule à votre place.", "Je posai le stylo.", "— Non.", "Le visage de Ferraro ne bougea pas.", "— Pardon ?", "— J'ai dit non. Je garde ma dette. Vous garderez vos onze millions et vos intérêts, et vous les réclamerez devant un tribunal, et un tribunal vous demandera l'origine des fonds.", "Il se pencha en arrière, très lentement.", "— Vous venez de faire une bêtise considérable.", "— Probablement.", "Je regardai ma montre. Onze heures cinquante-huit.", "— Mais je voulais vous occuper jusqu'à midi, dit une part de moi-même que je ne me connaissais pas, et je crois que j'y suis arrivé.", "Son téléphone sonna à cet instant précis.", "Il le prit. Il écouta quatre secondes.", "Et je vis un homme de soixante ans, propriétaire de la moitié de cette ville, devenir gris devant moi."]}, {"n": 29, "t": "Via Pratello", "pov": "Livia", "p": ["Je n'étais pas censée y aller.", "Bruno me l'avait dit. Les hommes de Damiano me l'avaient dit. J'y suis allée quand même, dans la troisième voiture, et je suis restée dans cette voiture pendant les onze minutes les plus longues de ma vie.", "À onze heures cinquante-quatre, la radio grésilla.", "— Sous-sol dégagé. On a le colis. Il est debout.", "Il est debout. Trois mots. J'ai posé le front sur le volant.", "Ils l'ont sorti par la porte de service. Il marchait seul. Il avait une plaie au-dessus de l'arcade, il lui manquait ses lunettes, et il portait encore la chemise du matin où ma mère l'avait vu partir.", "Il m'a vue. Il s'est arrêté net au milieu de la cour.", "Et mon père, qui n'avait pas pleuré à l'enterrement de sa propre mère, s'est mis à pleurer debout devant six hommes armés.", "— Je leur ai rien dit, a-t-il articulé. Livia. Je leur ai rien dit.", "Je l'ai pris dans mes bras. Il tremblait comme un oiseau.", "— Je sais, papa.", "— Non, tu ne sais pas. Ils m'ont proposé. Ils m'ont dit : tu appelles ta fille, tu lui dis de signer, et tu rentres chez toi ce soir.", "Il m'a attrapée par les épaules, et sous le sang séché, ses yeux étaient d'une clarté effrayante.", "— En 2003, on m'a posé la même question et j'ai répondu. Cette fois, je n'ai pas répondu. Tu comprends ? Cette fois je n'ai pas répondu.", "Il y a des hommes qui passent vingt-trois ans à attendre de repasser un examen.", "— Je comprends, dis-je.", "Nous l'avons mis dans la voiture. J'ai appelé ma mère. J'ai appelé Renzi — parce qu'une conciergerie avec une chaise cannée, un radiateur en fonte et le sang d'un homme de soixante-huit ans sur le sol est ce qu'un procureur appelle une scène, et que je voulais que celle-ci soit vue par un magistrat avant d'être nettoyée.", "À midi douze, mon téléphone sonna. Damiano.", "— Il est vivant ?", "— Il est vivant.", "Un souffle, à l'autre bout.", "— Et Salvatore ? demandai-je.", "— C'est pour ça que j'appelle. Il est sorti de chez Ferraro il y a huit minutes. À pied. Il n'a pas signé.", "Je restai silencieuse un instant de trop.", "— Livia, dit Damiano, et sa voix avait changé. Ne m'en veuillez pas pour ce que je vais dire. Je vais le dire une seule fois et ensuite je ne le dirai plus jamais.", "— Damiano—", "— Il n'a pas signé aujourd'hui. Moi, ça fait sept ans que je ne signe rien qui vous concerne. Il y a une différence entre un homme qui devient bon une fois et un homme qui l'a toujours été sans que vous le sachiez.", "Je regardai mon père, à travers la vitre, qui tenait la main de l'un des hommes de Damiano en lui demandant son prénom.", "— Je sais, dis-je.", "— Mais ça ne suffira pas.", "— Non, dis-je. Ça ne suffira pas.", "Il ne raccrocha pas tout de suite. Nous restâmes quelques secondes en ligne, tous les deux, sans rien dire.", "— Alors on fait quoi ? demanda-t-il enfin.", "— On finit le travail. Après, je vous répondrai. Vous méritez une réponse, et vous l'aurez, mais pas aujourd'hui et pas en récompense."]}, {"n": 30, "t": "Ce que je vaux", "pov": "Livia", "p": ["La réunion eut lieu le surlendemain, dans une salle de la maison du lac, parce que c'était le seul terrain que les deux familles acceptaient.", "D'un côté de la table : Matteo et Damiano Rocchi, deux avocats.", "De l'autre : Salvatore Castellano, Bruno, et une chaise vide là où sa mère se serait assise trois semaines plus tôt.", "Au bout : moi.", "— Je vais parler dix minutes, dis-je. Ensuite vous parlerez autant que vous voudrez.", "Personne ne m'interrompit. C'était nouveau.", "— L'enquête Aldini couvre aujourd'hui quatre chefs. Les circuits luxembourgeois, l'enlèvement de mon père, la mort de Serena Vitale, et — depuis hier — l'enlèvement de Paolo Rocchi en 2003, rouvert au titre de la disparition non élucidée. Les Ferraro ne tomberont pas dans un mois. Ils tomberont en trois ans, morceau par morceau, et pendant ces trois ans ils seront extrêmement dangereux.", "Je poussai deux dossiers, un de chaque côté.", "— Voilà ce que je propose. Un accord de non-agression de trente-six mois entre vos deux maisons. Pas une alliance. Vous n'avez ni l'un ni l'autre le tempérament pour une alliance. Un cessez-le-feu, avec un arbitre.", "Bruno leva les yeux.", "— Et l'arbitre, c'est vous.", "— Oui.", "Matteo Rocchi eut un sourire dans sa barbe. Salvatore ne bougea pas.", "— Article par article, poursuivis-je. Le port reste détenu par Rocchi & Sarti. La clause de préemption de l'article 14 est suspendue trente-six mois, ce qui veut dire que les Castellano ne peuvent pas le revendre et que nous ne pouvons pas le reprendre. Les onze millions de dette Ferraro sont contestés en justice avec nos avocats et les vôtres ensemble, parce qu'aucun tribunal de ce pays ne validera un prêt dont l'origine des fonds est sous instruction.", "— Et en échange ? demanda Bruno.", "— En échange, les Castellano transfèrent la gestion de leurs sociétés légitimes à une structure indépendante pendant trois ans. Vous conservez les revenus. Vous perdez la signature.", "Salvatore parla enfin.", "— Qui signe ?", "— Moi.", "Le silence dura peut-être cinq secondes.", "Bruno se pencha vers Salvatore et dit à voix basse quelque chose que je n'entendis pas. Salvatore ne le regarda pas. Il me regardait, moi, et je vis passer dans ses yeux toute l'histoire de six ans : la femme dans le bureau du fond, la consigliere sans titre, l'épouse sans nom, la chaise vingt-deux.", "Il prit le stylo.", "— Une condition, dit-il.", "— Laquelle ?", "— Ton nom sur les statuts. Pas « structure indépendante ». Ton nom. Écrit. Publié au registre, lisible par n'importe qui dans cette ville.", "Il signa.", "Puis il poussa le document vers Matteo Rocchi, et il ajouta, sans me quitter des yeux :", "— Elle a tenu ma maison pendant six ans sans que personne puisse le lire nulle part. Ça ne se reproduira pas.", "Matteo signa. Damiano signa. Bruno signa.", "Je signai en dernier.", "Et quand je reposai le stylo, je compris une chose très simple et très vertigineuse : depuis onze mois, je croyais me battre pour qu'on me rende quelque chose.", "En réalité, je n'avais jamais rien réclamé. J'avais construit, pendant onze mois, une position où plus personne n'avait le pouvoir de me donner ou de me refuser quoi que ce soit.", "Ce soir-là, dans ma voiture, j'ai ouvert la boîte plate posée sur le siège passager depuis le mois d'octobre.", "J'ai mis le collier de ma mère.", "Et j'ai roulé jusqu'à la maison au figuier, où mon père m'attendait avec un pansement au front et une bouteille qu'il gardait, disait-il, pour une occasion qu'il n'avait jamais su nommer."]}, {"n": 31, "t": "Trois ans, morceau par morceau", "pov": "Livia", "p": ["Une famille ne tombe pas d'un coup. Elle se vide.", "Les premiers à partir furent les comptables. En janvier, deux des trois cabinets qui travaillaient pour les Ferraro résilièrent leur mandat par lettre recommandée — pas par courage, par assurance : aucun assureur professionnel ne couvre un client sous instruction pour blanchiment.", "En février, la banque luxembourgeoise gela quatre comptes.", "En mars, le tribunal suspendit le prêt de onze millions consenti aux Castellano, dans l'attente de l'examen de l'origine des fonds. Salvatore reçut la décision un mardi matin. Il ne me téléphona pas. Il m'envoya une copie, sans un mot, et c'était exactement ce qu'il fallait faire.", "Le 17 mars, à neuf heures, le divorce fut prononcé.", "Je n'étais pas au tribunal. Maître Orsini m'appela depuis le couloir.", "— C'est fait. Il était là. Il a signé sans rien dire.", "— Merci.", "— Madame Sarti... Il m'a demandé de vous transmettre une chose. Il a dit : « Dites-lui que c'est la seule échéance que j'ai respectée. »", "J'ai raccroché et je suis restée debout au milieu de mon bureau pendant une minute.", "Un an, jour pour jour. Une balle sous la clavicule, un gâteau d'anniversaire, quatorze appels.", "Puis j'ai repris le dossier sur lequel je travaillais, parce que c'est comme ça qu'on survit aux dates.", "L'audience de Fabrizio Ferraro s'ouvrit en mai.", "Matteo Rocchi y assista chaque jour. Il arrivait à huit heures trente, s'asseyait au deuxième rang, et ne prenait pas de notes. Le dernier jour, l'avocat général cita le nom de Paolo Rocchi, dix-sept ans, disparu en octobre 2003, et le vieil homme ferma les yeux pendant que la phrase était prononcée à voix haute dans une salle publique, pour la première fois en vingt-trois ans.", "À la sortie, je l'ai raccompagné jusqu'à sa voiture.", "— Ça ne le ramène pas, dit-il.", "— Non.", "— Mais c'est écrit quelque part maintenant. Dans un registre. Avec une date et un nom.", "Il s'arrêta au bord du trottoir.", "— Vous savez ce que votre père m'a envoyé la semaine dernière ?", "— Non.", "— Une lettre. Quatre lignes. Il ne s'excuse pas — il sait que ça ne se fait pas, entre nous. Il écrit simplement ce qu'il a fait, sans adjectifs, et il signe.", "Matteo ouvrit la portière.", "— Je ne lui répondrai pas. Mais je l'ai gardée. Dites-le-lui, un jour, quand ça vous paraîtra utile.", "Gianfranco Ferraro fut mis en examen le 4 juin.", "Il quitta le pays le 6, avec un passeport qui n'était pas le sien, et personne dans cette ville ne le revit jamais.", "Ce n'est pas une fin spectaculaire. Les vraies ne le sont jamais. On ne détruit pas une famille : on la rend inutile, et les gens qui vivaient d'elle vont vivre ailleurs."]}, {"n": 32, "t": "L'homme qui apprend", "pov": "Salvatore", "p": ["Je passai l'été à apprendre à lire.", "C'est la façon la plus exacte de le dire. Deux soirs par semaine, un cabinet d'audit de Bologne m'envoyait une femme de trente-quatre ans nommée Chiara Belloni, qui posait un dossier devant moi et me faisait expliquer chaque ligne à voix haute.", "La première séance dura trois heures pour douze pages.", "— Vous ne savez pas lire un bilan, dit-elle à la fin, sans méchanceté.", "— Non.", "— Vous dirigez ces sociétés depuis six ans.", "— Sept.", "Elle referma son cahier.", "— Alors quelqu'un d'autre les dirigeait.", "— Oui.", "Elle attendit que j'ajoute quelque chose. Je n'ajoutai rien. Elle nota une heure sur sa feuille et partit, et revint le jeudi suivant, et le jeudi d'après.", "En septembre, je compris un montage de garantie croisée sans aide. Je restai assis devant la feuille comme un gamin devant un devoir corrigé.", "Bruno me trouva là à minuit.", "— Tu ressembles à un idiot heureux.", "— J'ai compris l'article 9.", "— Félicitations. Il t'a fallu un divorce, une garde à vue et une famille en ruine.", "Il s'assit en face de moi, se servit un verre de ce que je buvais, et nous restâmes silencieux un moment.", "— Elle ne reviendra pas, dit-il enfin.", "— Je sais.", "— Non, Salvatore. Tu ne sais pas. Tu es en train d'apprendre à lire des bilans en espérant qu'un jour, quelqu'un lui dira « il a changé ». C'est encore une façon de calculer.", "Je regardai le fond de mon verre.", "Il avait raison. C'était insupportable, et il avait raison.", "— Alors je fais quoi, Bruno ?", "— La même chose. Mais pour toi. Et le jour où tu la croiseras et que tu n'auras pas envie de lui montrer ton bulletin, tu sauras que c'est fini.", "Je croisai Livia trois semaines plus tard, à la conférence annuelle de la chambre portuaire, à laquelle j'assistais pour la première fois de ma vie.", "Elle intervenait en deuxième table ronde. Elle parla onze minutes de la réforme des concessions, sans notes, et deux armateurs prirent des photos de sa diapositive.", "À la pause, nous nous retrouvâmes au même bout de buffet.", "— Tu es venu, dit-elle.", "— J'apprends.", "— Je sais. Chiara Belloni a travaillé pour moi en 2022.", "Je faillis rire.", "— Tu me l'as envoyée ?", "— Non. Elle m'a appelée pour savoir si elle devait accepter le contrat. Je lui ai dit que oui, et de ne rien vous passer.", "Elle prit un verre d'eau. Elle portait le collier.", "— Ça te va bien, dis-je.", "— Merci.", "Et ce fut tout. Trois minutes de conversation, un sujet technique, une politesse.", "En rentrant, je m'aperçus que je n'avais pas cherché une seule fois, pendant ces trois minutes, ce qu'il fallait dire pour obtenir quelque chose.", "Bruno avait dit que je le saurais ce jour-là.", "Il s'était trompé sur un point : ça ne fait pas du bien. Ça fait juste enfin silence."]}, {"n": 33, "t": "Enzo", "pov": "Livia", "p": ["Enzo témoigna quatre fois.", "La quatrième, en novembre, dura six heures et le détruisit. L'avocat de la défense fit ce que font les avocats : il transforma un homme de trente-huit ans qui n'avait jamais rien décidé en homme qui avait tout décidé. Horaires transmis. Appels passés. Rendez-vous fixés. Une femme morte au pied d'un immeuble.", "À la sortie, il vomit dans les toilettes du tribunal. Je l'attendis dans le couloir.", "— Ils vont me condamner, dit-il.", "— Probablement. Deux ans, peut-être trois, avec ta coopération.", "— Deux ans.", "Il s'assit sur le banc, les coudes sur les genoux.", "— Tu sais ce qui est le plus dur ? Ce n'est pas la prison. C'est que pendant six heures, un homme a raconté ma vie et que tout ce qu'il a dit était vrai. Chaque fait. Et pourtant ce n'était pas moi.", "— Si, Enzo. C'était toi.", "Il leva la tête, blessé.", "— Tu pourrais me mentir, aujourd'hui.", "— Non. C'est la seule chose que je ne peux pas faire, parce que c'est exactement ce que tout le monde t'a fait pendant dix-neuf ans : t'arranger la réalité pour que tu restes utile.", "Je m'assis à côté de lui.", "— Tu as transmis des horaires qui ont failli me tuer. C'est vrai. Tu as aussi été la seule personne de cette maison à venir me voir quand j'étais partie, et tu es entré dans un commissariat en sachant ce que ça te coûtait. Les deux sont vrais. Tu vas devoir apprendre à porter les deux, et personne ne peut le faire à ta place.", "Il pleura un peu, discrètement, comme il faisait tout.", "— Qu'est-ce que je ferai après ?", "— Tu as dix-neuf ans d'expérience en organisation et une mémoire que je n'ai jamais vue ailleurs. Quand tu sortiras, tu viendras me voir.", "Il me regarda comme si je l'avais giflé.", "— Tu m'embaucherais ?", "— Non. Je te ferai passer un entretien, comme tout le monde, avec Chiara Belloni, et elle sera dure. Si tu es bon, tu auras un poste et un contrat écrit avec une fiche de fonction, et personne ne te demandera jamais plus de rendre un service qui n'est pas dans cette fiche.", "Il hocha la tête, longtemps, sans parler.", "— Livia.", "— Oui ?", "— Est-ce que tu me pardonnes ?", "Je réfléchis honnêtement avant de répondre, parce qu'il méritait une réponse honnête.", "— Pas encore. Mais je ne t'ai pas quitté, et je ne compte pas le faire. Chez moi, c'est plus rare que le pardon."]}, {"n": 34, "t": "La réponse que je dois", "pov": "Livia", "p": ["Damiano attendit quatorze mois.", "Il ne posa pas la question une seule fois. Il vint aux réunions, il défendit nos dossiers, il me contredit quand j'avais tort — souvent — et il ne dit rien.", "C'est moi qui suis allée le chercher, un dimanche de janvier, au bout du ponton de son père.", "— Vous péchez comme lui, maintenant.", "— Je ne pêche pas. Je m'assois. C'est ce qu'il faisait aussi ; il n'y avait jamais rien au bout de cette ligne.", "Je m'installai sur les planches, à sa droite, les pieds au-dessus de l'eau grise.", "— Je vous dois une réponse.", "Il ne bougea pas.", "— Vous ne me devez rien, Livia. C'est le principe même de ce que je vous ai dit il y a sept ans.", "— Vous ne m'avez rien dit il y a sept ans. Vous m'avez regardée dans un couloir de colloque et vous êtes parti parce que votre père vous appelait.", "Il sourit.", "— Vous vous en souvenez.", "— Depuis le troisième mois. Je n'ai rien dit parce que je ne savais pas quoi en faire.", "Il remonta sa ligne vide.", "— Alors dites-le.", "Je pris le temps. Il le méritait.", "— Je vous aime bien, Damiano. Ce n'est pas une consolation, c'est un fait, et ce n'est pas rien chez moi. Vous êtes la seule personne de cette histoire qui m'ait proposé quelque chose sans me demander de me diminuer pour l'obtenir.", "— Mais.", "— Mais vous m'avez menti six semaines, et j'ai compris quelque chose pendant ces six semaines. Ce n'est pas le mensonge qui m'a arrêtée. C'est que vous l'avez fait pour me protéger. Exactement comme Salvatore a caché notre mariage pour me protéger. Exactement comme mon père a caché une lettre pour me protéger.", "Il posa la canne.", "— Trois hommes, dis-je. Trois décisions prises à ma place, chaque fois par amour, chaque fois en me laissant dehors de ma propre vie. Je ne peux pas recommencer. Ce n'est pas de la rancune, Damiano. C'est une allergie.", "Il resta longtemps silencieux. L'eau clapotait contre les piliers.", "— Est-ce que si je vous avais tout dit le premier jour, ç'aurait été différent ?", "— Oui.", "— Et vous seriez partie.", "— Oui.", "Il rit. Un rire bref, sans amertume.", "— Alors il n'y avait pas de bonne réponse.", "— Non. Il n'y en avait pas. C'est ça que je voulais que vous entendiez : je ne vous punis pas. Vous n'avez pas perdu quelque chose par votre faute, vous avez perdu quelque chose, c'est tout. Ça arrive, et c'est plus supportable que la culpabilité.", "Il regarda le lac.", "— Et Castellano ?", "— Non plus.", "— Livia.", "— Non plus, Damiano. Pour d'autres raisons, et la principale est que je ne veux pas être la récompense de sa rédemption. Un homme qui devient bon pour qu'on lui rende quelqu'un n'est pas devenu bon.", "Il hocha la tête lentement.", "— Vous allez rester seule.", "— Peut-être. Ou peut-être que dans deux ans, ou dans cinq, quelqu'un me proposera quelque chose et que je serai enfin à un endroit où je pourrai dire oui sans que ça me coûte ce que j'ai construit.", "Je me levai. Je lui posai la main sur l'épaule, une seconde.", "— Restez mon associé.", "Il leva les yeux vers moi, et il y avait dans son regard exactement ce que j'espérais y trouver : de la déception, de la tendresse, et pas une trace de chantage.", "— Cinquante-cinquante, dit-il.", "— Cinquante-cinquante."]}, {"n": 35, "t": "Bellaria", "pov": "Salvatore", "p": ["Ma mère mourut un jeudi de mars, dans la maison de Bellaria, entourée de deux infirmières et d'aucun Castellano.", "Je l'avais vue trois fois en quinze mois. La dernière, elle m'avait demandé si le port marchait bien. J'avais dit oui. Elle avait hoché la tête, satisfaite, et c'était la seule conversation que nous avions encore été capables d'avoir.", "Il y eut quarante personnes à l'enterrement. Quinze ans plus tôt, il y en aurait eu six cents.", "Livia vint.", "Elle se tint au dernier rang, en noir, sans Rocchi, et elle repartit avant les condoléances. Je la rattrapai sur le parking.", "— Tu n'étais pas obligée.", "— Non.", "— Elle a fait tuer une femme. Elle a failli faire tuer ton père.", "— Oui, dit-elle. Et elle a tenu une maison pendant douze ans pendant que le tien était en fuite, et personne ne le lui a jamais écrit nulle part non plus.", "Elle remit ses lunettes de soleil.", "— Je ne suis pas venue pour elle, Salvatore. Je suis venue parce que tu es la seule personne de cette histoire qui va devoir enterrer sa mère en sachant ce qu'elle a fait. Ça, personne ne devrait le faire sans que quelqu'un soit dans la salle.", "Elle ouvrit sa portière.", "— Livia.", "Elle s'arrêta.", "J'avais préparé une phrase. Je l'avais préparée pendant quinze mois, en apprenant à lire des bilans, en croyant que le jour où je saurais la dire, quelque chose se rouvrirait.", "Je la regardai, avec ses lunettes noires, devant sa voiture, et je compris enfin, très simplement, que la dire serait encore lui demander quelque chose.", "— Merci d'être venue, dis-je.", "Elle me regarda une seconde de plus que nécessaire.", "— De rien.", "Elle partit.", "Je restai sur ce parking jusqu'à ce que les derniers invités soient sortis, puis je rentrai dans une maison de dix-neuf pièces où il n'y avait plus personne, et je m'assis dans la bibliothèque avec les dossiers du trimestre.", "Je travaillai jusqu'à deux heures du matin. Je compris tout ce que je lisais.", "Et vers une heure, quelque part entre l'article 12 et l'article 14, je m'aperçus que je n'avais pas pensé à elle depuis quarante minutes, et que cela ne m'avait fait ni mal ni plaisir.", "C'était juste arrivé."]}, {"n": 36, "t": "Le nom sur la porte", "pov": "Livia", "p": ["Nous déménageâmes en avril dans un immeuble du quai sud, quatre étages, brique et verre, avec une plaque en laiton à l'entrée.", "ROCCHI & SARTI — Gestion portuaire et industrielle", "Je restai devant cette plaque un temps déraisonnable, un matin, avant de monter.", "Ce n'était pas la vanité. C'était autre chose, de plus bête et de plus profond : pendant six ans, j'avais travaillé dans un bureau sans plaque, pour une maison qui ne portait pas mon nom, mariée à un homme qui ne le portait pas non plus. J'avais été la meilleure de cette ville dans un métier dont aucun papier ne prouvait que je l'exerçais.", "Nous étions vingt-deux salariés. Je connaissais les vingt-deux prénoms, les postes, et les fiches de fonction, parce que j'avais écrit les fiches moi-même.", "Première règle de la maison, affichée dans la salle de réunion, rédigée par moi en trois lignes :", "Toute décision qui engage quelqu'un lui est communiquée avant, pas après. Personne n'est protégé par le silence. Celui qui protège quelqu'un en lui cachant une information sera considéré comme lui ayant menti.", "Chiara Belloni, en la lisant, leva un sourcil.", "— C'est très personnel, comme règle interne.", "— Toutes les règles internes le sont. Les autres maisons ont simplement l'élégance de ne pas dire de qui.", "En juin, nous avons recruté une juriste de vingt-six ans, Ada, brillante et légèrement insolente, qui m'a demandé au bout de trois semaines si c'était vrai, l'histoire du mariage secret.", "— Oui.", "Elle a rougi jusqu'aux oreilles.", "— Pardon, madame, je n'aurais pas dû—", "— Si. Posez les questions que vous voulez. Je vais vous dire la seule chose qui compte dans cette histoire, Ada, et vous en ferez ce que vous voulez.", "Elle attendit.", "— Pendant six ans, j'ai été indispensable et invisible, et je croyais que c'était une injustice qu'on me faisait. Ce n'en était pas une. C'était un arrangement, et j'en étais la moitié. Chaque fois que j'ai accepté de faire le travail sans le titre, chaque fois que j'ai réglé un problème pour éviter une conversation, j'ai signé une ligne de cet arrangement.", "— Alors c'est de votre faute ?", "— Non. Mais c'était en mon pouvoir, et ce n'est pas pareil. Retenez la différence : elle vous servira dix fois plus que tout ce que je pourrai vous apprendre en droit des concessions.", "Le soir, je rentrai chez moi — un appartement à moi, meublé par moi, dont personne d'autre n'avait la clé.", "Il n'y a rien d'héroïque là-dedans. Ce n'est même pas une fin de roman.", "C'est simplement la première année de ma vie où, quand quelqu'un m'a demandé qui j'étais, j'ai pu répondre sans regarder d'abord ce que la réponse coûterait."]}, {"n": 37, "t": "L'article 14", "pov": "Salvatore", "p": ["La suspension de la clause de préemption expirait le 30 novembre.", "Trente-six mois. Tout le monde l'avait en tête depuis l'été : à partir du 1er décembre, Rocchi & Sarti pouvait reprendre le port si les Castellano vacillaient, et les Castellano pouvaient revendre à qui ils voulaient s'ils tenaient debout.", "Nous tenions debout.", "C'était la chose la plus improbable de cette histoire, et je peux dire exactement comment nous y sommes arrivés : en vendant la maison du lac, en fermant quatre sociétés sur sept, en payant nos avocats pendant vingt-neuf mois pour faire annuler un prêt de onze millions, et en gagnant, en février, devant une cour d'appel qui jugea que des fonds sous instruction pénale ne pouvaient fonder une créance exigible.", "Le 12 novembre, Bruno posa deux offres sur mon bureau.", "La première, d'un groupe grec : le port, comptant, quarante pour cent au-dessus du marché. De quoi rendre aux Castellano leur assise et refaire de cette famille ce qu'elle était.", "La seconde, de Rocchi & Sarti : trois points sous le marché, paiement en trois ans, et une clause de participation aux résultats de la concession.", "— Les Grecs sont meilleurs, dit Bruno.", "— Sur dix-huit mois, oui.", "— Sur dix-huit mois, c'est tout ce qui compte pour un homme de mon âge.", "Je repris les deux dossiers et je les lus moi-même, toute la nuit, sans Chiara, sans personne.", "À quatre heures du matin, j'avais trouvé ce que je cherchais : à l'article 9 de l'offre grecque, une faculté de cession libre des parts à tout tiers du même groupe — c'est-à-dire, sans le dire, la possibilité pour un acheteur inconnu d'entrer dans le port par la porte de derrière, dix-huit mois plus tard.", "C'était exactement le genre de clause que j'aurais signée sans la voir, trois ans plus tôt.", "Je la vis.", "Je choisis la seconde offre.", "Je l'annonçai à Bruno le lendemain. Il me regarda longuement.", "— Tu fais ça pour elle.", "Et j'ai pu répondre, pour la première fois de ma vie, sans mentir ni à lui ni à moi :", "— Non. Je fais ça parce que c'est la meilleure offre et que je suis maintenant capable de le démontrer. Que ce soit elle en face, c'est une coïncidence désagréable.", "Bruno hocha la tête, se leva, et s'arrêta à la porte.", "— Ton père aurait signé les Grecs.", "— Je sais.", "— C'est un compliment, Salvatore.", "La signature eut lieu le 3 décembre, dans une salle de réunion du quai sud, sous une plaque de laiton.", "Elle présidait. Elle portait un tailleur gris et pas de collier ce jour-là, et elle mena la séance en quarante minutes, article par article, sans une once de triomphe.", "À la fin, elle me tendit la main.", "— Bon accord, Don Castellano.", "— Bon accord, madame Sarti.", "Ce fut tout. Et, très honnêtement, ce fut suffisant."]}, {"n": 38, "t": "Le figuier, encore", "pov": "Livia", "p": ["Mon père mourut en avril, d'un infarctus, dans son jardin, une cisaille à la main.", "Ma mère le trouva à seize heures. Il avait taillé les trois quarts du figuier. Le quart restant est resté comme ça pendant deux ans, parce que ni elle ni moi n'avons pu nous résoudre à finir son travail.", "Il y eut beaucoup de monde. Des gens dont j'ignorais l'existence, venus me raconter des histoires de 1988 que je n'avais jamais entendues.", "Matteo Rocchi vint.", "Il ne s'approcha pas de la famille. Il resta au fond, appuyé sur sa canne, pendant toute la cérémonie, et il partit sans un mot.", "Trois jours plus tard, un coursier m'apporta un paquet plat.", "Dedans : la lettre que mon père lui avait écrite, celle des quatre lignes, avec un mot de Matteo agrafé dessus.", "« Elle est à vous maintenant. Je l'ai lue trois cent fois. Je n'ai jamais su quoi répondre et il est mort avant que je trouve. Dites-vous que c'est une réponse quand même. »", "J'ai mis les deux papiers dans la boîte en fer, avec la photographie de 2003 et le revolver huilé que je n'ai jamais eu le courage de jeter.", "Ce soir-là, ma mère et moi avons dîné dans la cuisine, à la table où tout avait commencé.", "— Tu sais ce qu'il disait de toi ? me demanda-t-elle.", "— Non.", "— Il disait : « Livia règle. » C'était son mot. Pas « Livia travaille », pas « Livia réussit ». Livia règle. Il en était fier et ça le terrifiait.", "— Pourquoi terrifiait ?", "Ma mère repoussa son assiette.", "— Parce qu'un enfant qui règle les problèmes des autres est un enfant que personne ne pense à aller chercher. Il l'a compris trop tard. Le jour où il a vu ta cicatrice, il m'a dit dans cette cuisine : « Je l'ai élevée pour qu'elle soit indispensable, et les gens indispensables meurent seuls, parce que tout le monde croit qu'ils s'en sortent. »", "Nous sommes restées silencieuses un moment.", "— Tu es seule, Livia ?", "C'est la question que personne ne m'avait posée en trois ans.", "— Je ne sais pas, maman. Je ne suis pas malheureuse. Je rentre chez moi, je lis, je vois Ada et Chiara le vendredi, je t'appelle le dimanche. Je ne me réveille plus à quatre heures du matin.", "— Ce n'est pas une réponse.", "— Non, dis-je. C'est un état des lieux. Les réponses, j'en ai donné deux dans ma vie, à deux hommes, et les deux fois j'avais raison. Je ne suis pas pressée d'en donner une troisième.", "Elle me prit la main.", "— Il ne faut pas devenir un homme de ce monde, ma fille. Ils appellent ça de la lucidité, et c'est juste de la peur avec un beau costume.", "Je n'ai pas répondu.", "J'y pense encore."]}, {"n": 39, "t": "Une question, enfin", "pov": "Livia", "p": ["Il m'a téléphoné en septembre, cinq ans après la première tasse de café que j'avais posée sur son bureau.", "Damiano.", "— J'ai une question à vous poser et je veux que vous sachiez, avant, que la réponse ne change rien à notre association. Je voulais le dire en premier pour que vous puissiez répondre librement.", "Je souris malgré moi. En cinq ans, il avait fini par apprendre — ou peut-être qu'il avait toujours su et qu'il attendait que je sois capable de l'entendre.", "— Je vous écoute.", "— Est-ce que vous voulez dîner avec moi samedi ? Pas une réunion, pas un dossier. Un dîner. Vous pouvez dire non et nous nous verrons lundi à neuf heures comme d'habitude.", "J'ai regardé par la fenêtre de mon bureau, le quai sud, les grues, l'eau.", "Cinq ans.", "J'ai pensé à une jeune femme de vingt-neuf ans qui croyait que si elle était assez utile, on finirait par l'aimer au grand jour. J'ai pensé à un homme qui a retourné son téléphone face contre le bois. À un autre qui a menti six semaines pour me garder en vie. À un père qui a caché une lettre. À une plaque en laiton avec mon nom dessus.", "Et j'ai pensé à ma mère, dans une cuisine : ils appellent ça de la lucidité, et c'est juste de la peur avec un beau costume.", "— Damiano.", "— Oui ?", "— Une condition.", "— Dites.", "— Vous ne me protégez de rien. Jamais. Si vous apprenez quelque chose qui me concerne, même si ça doit me détruire, vous me le dites dans l'heure. Même si je vous supplie de ne pas le faire. Surtout si je vous supplie.", "Il y eut un silence au bout du fil.", "— C'est un contrat très dur, dit-il enfin.", "— Oui.", "— J'accepte.", "— Alors samedi.", "J'ai raccroché. J'ai posé le téléphone. Je suis restée assise, les mains à plat sur mon bureau, avec une sensation étrange dans la poitrine que j'ai mis un moment à identifier, parce que ça faisait environ six ans que je ne l'avais pas éprouvée.", "Ce n'était pas de l'amour. C'était bien avant ça.", "C'était la permission."]}, {"n": 40, "t": "Ce qu'on écrit sur les registres", "pov": "Salvatore", "p": ["Je l'ai vue pour la dernière fois un mardi de novembre, sept ans après une nappe blanche et vingt-deux couverts.", "C'était à la chambre de commerce, lors de la remise des concessions décennales. Elle présidait la commission. J'y étais comme concessionnaire, au troisième rang, avec un dossier que j'avais rédigé moi-même et dont j'étais, je dois l'avouer, assez fier.", "Elle m'a accordé la concession. Elle l'aurait accordée à n'importe qui ayant produit ce dossier ; c'était le meilleur, et je le savais en l'écrivant.", "Au cocktail, elle est venue me voir. Elle n'était pas seule : Rocchi se tenait à deux mètres, en train de parler à quelqu'un d'autre, avec cette façon qu'il a de ne jamais regarder dans sa direction tout en ne la quittant pas des yeux. Ils ne portaient pas d'alliances. Je ne sais pas ce qu'ils sont l'un pour l'autre et ce n'est pas mon affaire.", "— Bon dossier, dit-elle.", "— Il y a une erreur page onze.", "— Je sais. Une virgule dans le tableau d'amortissement. Ça ne changeait rien.", "— Tu l'as vue.", "— Bien sûr que je l'ai vue.", "Nous avons ri tous les deux, brièvement, et c'était la première fois en sept ans que nous riions de la même chose.", "— Je vais te demander quelque chose, dis-je. Une seule fois, et ce n'est pas ce que tu crois.", "— Vas-y.", "— Est-ce que tu regrettes les six ans ?", "Elle a réfléchi. Elle réfléchit toujours, quand la question mérite qu'on réfléchisse ; c'est ce qui rend ses réponses coûteuses et fiables.", "— Non, dit-elle. J'ai appris mon métier là-bas. J'ai appris à lire un homme en trois secondes et un bilan en dix minutes. J'ai appris ce que je ne veux plus jamais accepter, et on n'apprend pas ça dans les bonnes maisons.", "— Alors quoi, alors ?", "— Alors je regrette d'avoir cru pendant six ans que le fait d'être indispensable finirait par me rendre visible. Ça ne marche pas dans ce sens-là. On n'attend pas qu'on écrive votre nom quelque part. On l'écrit.", "Elle a posé son verre.", "— Prends soin de toi, Salvatore.", "— Toi aussi.", "Elle est partie rejoindre les autres.", "Je suis rentré à pied.", "En passant devant le quai sud, j'ai vu la plaque de laiton, éclairée par un lampadaire. ROCCHI & SARTI. Deux noms, à égalité, dans un ordre alphabétique que personne n'a jamais discuté.", "Il y a sept ans, une femme est entrée dans une salle à manger et a déposé une chemise cartonnée entre mon assiette et celle d'une autre. J'ai cru ce soir-là que je perdais une épouse.", "En réalité, je perdais la seule personne qui m'ait jamais appris quelque chose, et il m'a fallu sept ans pour comprendre que la leçon n'était pas dans les bilans.", "Elle tient en une phrase, celle qu'elle m'a dite au bout d'une table de cuisine, à trois heures du matin, alors que nous n'avions plus rien à nous prendre :", "Je te donne l'occasion d'être un homme à qui je pourrais.", "Je ne le suis jamais devenu pour elle.", "Je le suis devenu quand même.", "C'est, pour un homme comme moi, la fin la plus heureuse que je pouvais espérer — et il m'a fallu tout perdre pour être capable de l'écrire sans amertume.", "FIN"]}], "couv": true}, {"id": "lune", "titre": "La Part de Lune", "serie": "Les Deux Collines — tome 1", "auteur": "Écrit avec Claude", "genres": ["Urban fantasy", "Romance paranormale", "Loups & Lycans", "Âmes sœurs", "Série"], "annee": "2026", "couleur": "#1c2445", "statut": "À venir", "resume": "Lyon, aujourd'hui. Sous les traboules, deux meutes se partagent les collines, et des femmes appelées Lieuses constatent les liens que personne n'a choisis. Maël, aide-soignante de nuit, est frappée par un lien d'âmes sœurs le soir où un Alpha lui amène un loup qui n'en est pas un — et rejetée par lui devant le Concile trois jours plus tard. Ce qu'on ne lui a pas dit : le Rejet est irrévocable pour celui qui le prononce. Pas pour celle qui le reçoit.", "chapitres": [], "couv": true}, {"id": "vesper", "titre": "Le Contrat de Vesper", "auteur": "Écrit avec Claude", "genres": ["Dark romance", "Science-fiction", "Futuriste", "Obsession"], "annee": "2026", "couleur": "#2b2b33", "statut": "En cours", "resume": "Vesper, 2049. Chaque citoyen porte un score, et le score se propage : un cousin condamné, une facture impayée, et Ilya tombe à 412 en servant un café. Un homme à 940 lui propose de porter son risque pendant un an, chez lui, selon un contrat de trente-deux pages qui ne dit pas ce qu'il attend d'elle. Il ne la touche pas. Il la regarde. Et dans trois pièces fermées, dix cartons portent les noms de celles qui l'ont précédée. Avertissements : rapport de pouvoir déséquilibré, surveillance, obsession.", "chapitres": [{"n": 1, "t": "Score", "pov": "Ilya", "p": ["Mon score est tombé à 412 un mardi, à onze heures quatorze, pendant que je servais un café.", "Le terminal du comptoir a émis un son bref — pas une alarme, juste une note, comme un rappel de rendez-vous — et la cliente en face de moi a baissé les yeux sur son poignet, où mon nom venait de passer du vert au gris.", "Elle a laissé le café. Elle a laissé aussi un pourboire, ce qui était pire.", "Dans la Zone Sud de Vesper, on ne vous exclut pas. On cesse simplement de vous voir. Sous 450, votre bail devient révisable. Sous 420, votre employeur reçoit une notification de « risque relationnel ». Sous 400, vous n'avez plus accès qu'aux services essentiels, et la définition des services essentiels est revue chaque trimestre par des gens qui n'ont jamais été à 400.", "Je n'avais rien fait. C'est ce qui rend le système parfait : on n'a jamais rien fait. Un cousin condamné à Lyon-Ouest, une amie d'enfance qui a manifesté, une facture de santé impayée par ma mère avant sa mort. Le score ne juge pas. Il propage.", "À midi, mon gérant m'a appelée dans la réserve.", "— Ilya. Tu sais que je t'aime bien.", "— Je sais.", "— J'ai reçu le message.", "— Je sais aussi.", "Il a regardé ses chaussures. Il avait 680, deux enfants, et un prêt sur le bar. Je ne lui en ai pas voulu. On n'en veut pas à un thermomètre.", "— Fin de semaine, a-t-il dit.", "Je suis sortie par la porte de service, dans la ruelle qui donne sur la darse, et je suis restée là un moment à regarder les grues du port automatisé, qui déchargent jour et nuit des conteneurs pour des gens qui ont un score.", "C'est là qu'il m'attendait.", "Je ne l'ai pas vu arriver. Il était simplement là, adossé à un pilier, en manteau gris, comme s'il avait toujours fait partie de la ruelle.", "— Ilya Marchetti.", "— Je ne vous connais pas.", "— Non. Mais vous allez me connaître, parce que dans quatre jours vous n'aurez plus de travail, dans dix-huit plus de logement, et dans trente le Bureau vous proposera un « accompagnement » dont personne ne revient tout à fait.", "Il a sorti une carte. Pas un terminal — une carte, en papier, ce qu'on ne voit plus qu'au cinéma.", "Aurel Sarn. Garant.", "— Un garant, ai-je dit. Vous achetez des scores.", "— J'achète des risques. C'est différent. Je porte votre score sur le mien. Le mien est à 940. Le vôtre remonte en une nuit à 700. Vous gardez votre travail, votre appartement, votre vie.", "— En échange de quoi ?", "Il a souri, et c'était un sourire sans chaleur, sans cruauté non plus. Le sourire d'un homme qui énonce un tarif.", "— En échange de vous. Pendant un an. Chez moi. Selon un contrat que vous lirez ligne à ligne avant de signer, parce que je ne prends que des gens qui savent ce qu'ils signent.", "J'ai regardé la carte. J'ai regardé les grues.", "— Et si je refuse ?", "— Alors je m'en vais, et je ne reviens pas, et dans trente jours vous saurez ce que vaut la liberté à 400.", "Il a tourné les talons.", "— Monsieur Sarn.", "Il s'est arrêté sans se retourner.", "— Pourquoi moi ?", "— Parce que vous n'avez pas pleuré quand la cliente a laissé le pourboire. J'ai regardé. Vous avez ramassé la pièce et vous l'avez mise dans la caisse commune.", "Il est parti.", "Je suis restée avec la carte, et avec la certitude, très nette, que je venais de rencontrer l'homme le plus dangereux de ma vie — et que ce n'était pas le Bureau."]}, {"n": 2, "t": "Ce que j'achète", "pov": "Aurel", "p": ["Il y a une chose qu'on ne dit jamais sur les garants : nous ne sommes pas des philanthropes, et nous ne sommes pas des monstres. Nous sommes ce que le système a fabriqué en creux.", "Quand Vesper a mis en place le score, en 2041, il fallait un mécanisme de rachat. Sinon, les gens à 400 s'accumulent, et les gens à 400 finissent par casser des choses. Alors on a autorisé des particuliers à haut score à « porter » des risques. Officiellement, c'est de la solidarité. Officieusement, c'est un marché, avec des contrats, des clauses, et des hommes comme moi.", "J'ai porté onze personnes en huit ans. Neuf ont terminé leur année. Deux sont parties avant. Aucune n'est revenue me voir, et je ne le leur demande pas.", "Ilya Marchetti est entrée dans mon bureau le jeudi à dix-neuf heures, avec le contrat que je lui avais fait porter la veille. Trente-deux pages. Elle avait tout annoté. Au crayon.", "— Article 7, dit-elle sans s'asseoir. « Résidence obligatoire au domicile du garant. » Pourquoi ?", "— Parce que le score suit la localisation. Si vous vivez chez moi, l'algorithme vous rattache à mon foyer. C'est ce qui le fait monter.", "— Article 12. « Le garant peut mettre fin au contrat à tout moment sans motif. » Et moi ?", "— Article 13. Vous aussi.", "— Avec pénalité.", "— Le score redescend à sa valeur initiale. Ce n'est pas une pénalité, c'est un retour à l'état antérieur.", "Elle a tourné les pages.", "— Article 19. « La personne portée s'engage à ne pas quitter la Zone Nord sans accord. » Je suis prisonnière.", "— Vous êtes rattachée. Nuance que vous trouverez insupportable les trois premiers mois et parfaitement claire ensuite.", "Elle s'est enfin assise.", "Elle avait vingt-sept ans, un visage qui ne demandait rien, et cette façon de tenir un crayon entre deux doigts comme si c'était la seule chose sur laquelle elle avait encore autorité. J'ai remarqué que je regardais le crayon. Je me suis détourné.", "— Il n'y a rien dans ce contrat sur ce que vous attendez de moi, dit-elle. Trente-deux pages, et pas une ligne sur ce que je fais chez vous.", "— Non.", "— Alors je le demande à voix haute, parce que je ne signe pas un silence.", "Je l'ai regardée.", "— Rien, Ilya. Vous vivez chez moi. Vous dînez à ma table si vous le voulez, dans votre chambre si vous préférez. Vous ne me devez ni votre temps, ni votre corps, ni votre conversation. Ce que j'achète, c'est votre présence dans mon foyer, parce que c'est ce que l'algorithme mesure.", "— Personne ne paie neuf cents points pour une présence.", "— Personne ne les paie pour rien, en effet.", "Elle a attendu.", "— Mon score est à 940, ai-je dit. On n'arrive pas à 940 sans qu'un algorithme vous surveille pour s'assurer que vous le méritez. Un homme seul à 940 est une anomalie. Un homme qui porte quelqu'un est un pilier. Vous me rendez lisible, Ilya. Vous êtes ma preuve de vertu.", "Elle a eu un sourire bref, presque de l'admiration.", "— Vous m'achetez pour avoir l'air bon.", "— Je vous achète pour rester intouchable. Ce n'est pas la même chose, et vous le savez, parce que vous êtes exactement en train de faire le même calcul de l'autre côté de la table.", "Elle a signé.", "Elle a signé au crayon, et j'ai dû lui demander de recommencer à l'encre, et pendant qu'elle le faisait, j'ai su — de cette façon dont on sait les choses qu'on n'a pas encore le droit de savoir — que le contrat était la partie facile."]}, {"n": 3, "t": "Zone Nord", "pov": "Ilya", "p": ["La maison de Sarn avait des fenêtres qui donnaient sur la mer, et je n'en avais jamais vu.", "Pas la mer — les fenêtres. Dans la Zone Sud, on vit derrière des volets automatiques qui se ferment à la tombée de la nuit pour « sécurité collective ». Ici, les vitres allaient du sol au plafond, sans rideau, et on pouvait rester debout devant sans que personne ne vous dise de vous éloigner.", "Mon score était passé à 703 pendant la nuit. Je l'ai vérifié quatre fois.", "— Vous n'avez pas dormi, a dit Sarn en entrant dans la cuisine à sept heures.", "— Je ne dors pas dans les endroits que je ne connais pas.", "— Alors apprenez-le vite. Il y a onze pièces. Trois sont fermées. Le reste est à vous.", "— Pourquoi trois fermées ?", "Il s'est servi un café sans répondre, et j'ai compris que c'était la première règle non écrite : il y a des choses qu'il dit, et il y a des choses qu'il fait semblant de ne pas avoir entendues.", "Les premiers jours ont été d'une étrangeté silencieuse. Il partait à huit heures. Il rentrait à vingt heures. Entre les deux, une femme nommée Hedda venait faire le ménage et ne me parlait pas, sauf une fois, le troisième jour, pour dire en passant devant ma chambre :", "— La précédente restait dans sa chambre. Ça ne l'a pas aidée.", "Je ne lui ai pas demandé ce que ça voulait dire. Je l'ai noté.", "Le cinquième soir, il m'a trouvée dans la bibliothèque, par terre, avec le rapport annuel du Bureau des Scores — un document public que personne ne lit — ouvert sur les genoux.", "— Vous lisez ça ?", "— Je lis comment l'algorithme pondère les liens familiaux. Il y a une chose que je ne comprends pas.", "— Dites.", "— Un garant porte un risque. Mais l'algorithme mesure aussi le risque du garant. Si vous me portez et que je chute, vous chutez avec moi.", "— Oui.", "— Donc vous avez lu mon dossier avant de m'approcher. Tout mon dossier. Mon cousin, mon amie, ma mère.", "— Oui.", "— Et vous m'avez prise quand même. Il y avait quatre cents autres personnes sous 420 dans la Zone Sud ce mardi-là.", "Il s'est assis dans le fauteuil en face de moi. C'était la première fois qu'il s'asseyait dans une pièce où j'étais.", "— Vous voulez la vraie réponse ou la réponse qui vous laissera dormir ?", "— La vraie.", "— Votre mère s'appelait Nadia Marchetti. Elle a travaillé pour le Bureau de 2041 à 2046, à la conception du modèle de propagation. C'est elle qui a écrit la règle qui a fait tomber votre score.", "La pièce a basculé.", "— C'est faux.", "— C'est dans son dossier de carrière, que vous n'avez jamais pu consulter parce qu'il est classé au-dessus de votre niveau d'accès. Le mien est suffisant.", "— Pourquoi me dire ça ?", "— Parce que vous alliez le découvrir dans cette bibliothèque, tôt ou tard. Et parce que je préfère que vous me haïssiez pour une vérité que pour un mensonge par omission. J'ai trouvé que c'était une politesse.", "Il s'est levé.", "— Il y a une deuxième chose. Elle a démissionné en 2046. La règle qu'elle avait écrite venait d'être appliquée à une famille de la Zone Sud. Elle a essayé de la faire retirer. Elle a échoué. Elle est partie. Et deux ans plus tard, une facture de santé impayée a déclenché exactement la propagation qu'elle avait conçue — sur sa propre fille.", "Il est parti. Il n'a pas fermé la porte.", "Je suis restée par terre avec le rapport, longtemps, et pour la première fois depuis que j'étais entrée dans cette maison, je n'ai pas vérifié mon score."]}, {"n": 4, "t": "Onze", "pov": "Aurel", "p": ["Je lui avais dit la vérité sur sa mère parce que c'était un test, et elle l'a réussi sans le savoir.", "La plupart des gens que j'ai portés, quand ils apprennent quelque chose d'insupportable, viennent me le reprocher. Ils ont besoin d'un visage. Ilya ne m'a rien reproché. Elle a passé les six jours suivants dans la bibliothèque, et le septième, elle a demandé l'accès à ma clé du Bureau.", "— Non.", "— Vous avez le niveau. Vous l'avez dit.", "— Ma clé est nominative. Chaque consultation est journalisée. Si vous lisez le dossier de votre mère depuis mon accès, l'algorithme note qu'un garant fouille le passé d'une personne portée, et il se pose des questions sur mes motifs.", "— Vous avez peur d'une machine.", "— J'ai peur de ce qu'une machine décide quand elle ne comprend pas ce qu'elle voit. Vous devriez avoir la même peur. Vous êtes à 703 grâce à moi, et « grâce à moi » veut dire que si je tombe, vous tombez plus bas que 412.", "Elle a réfléchi. Puis :", "— Alors lisez-le pour moi. Et racontez-moi.", "Je l'ai fait le soir même. C'est la première chose que j'ai faite pour elle que le contrat ne prévoyait pas, et je le savais en le faisant.", "Le dossier de Nadia Marchetti tenait en quarante pages. Une ingénieure brillante, recrutée à trente-quatre ans, qui avait cru — c'est écrit noir sur blanc dans son mémoire d'entrée — qu'un score bien conçu serait plus juste que des hommes. Elle avait tort, et elle l'a compris en quatre ans, et elle a passé les deux dernières années de sa vie à essayer de casser ce qu'elle avait construit.", "Elle avait aussi laissé une note, la dernière du dossier, adressée à personne :", "« Si quelqu'un un jour lit ceci parce qu'il porte ma fille : elle s'appelle Ilya, elle ne demande jamais rien, et c'est exactement pour ça qu'il faut lui donner. »", "Je ne lui ai pas lu cette phrase.", "Je l'ai gardée. Je sais que c'était une erreur, et je sais pourquoi je l'ai commise : parce que cette femme morte venait de décrire, en une ligne, la chose que je regardais chaque soir depuis onze jours sans avoir le droit de la nommer.", "— Elle a essayé, ai-je dit à Ilya. Jusqu'au bout. Elle a échoué mais elle n'a jamais cessé.", "Ilya a hoché la tête. Elle n'a pas pleuré. Elle a dit merci, et elle est montée.", "Et moi, seul dans le bureau, j'ai ouvert les trois pièces fermées de la maison — celles dont elle m'avait demandé la clé le premier matin — et j'ai regardé longtemps ce qu'il y avait dedans.", "Dix dossiers. Dix personnes que j'avais portées. Dix vies, classées, annotées, suivies bien après la fin des contrats, dans des cartons que je n'avais jamais montrés à personne.", "Il manquait le onzième.", "Il ne manquait pas : je ne l'avais pas encore commencé. Et je venais de comprendre, devant ces cartons, que si je le commençais, je ne pourrais plus jamais prétendre qu'Ilya Marchetti était une preuve de vertu."]}, {"n": 5, "t": "La précédente", "pov": "Ilya", "p": ["Hedda a parlé le dix-neuvième jour.", "Je l'ai attendue dans la cuisine, avec deux cafés, et je n'ai rien dit jusqu'à ce qu'elle finisse de ranger. Elle a regardé le deuxième café pendant une bonne minute avant de s'asseoir.", "— Vous voulez savoir pour la précédente.", "— Je veux savoir ce que vous savez.", "— Elle s'appelait Mina. Elle avait vingt-trois ans. Elle est restée sept mois.", "— Et ?", "Hedda a tourné sa tasse.", "— Il ne l'a pas touchée. Je vous le dis tout de suite, parce que c'est ce que tout le monde pense, et c'est faux. Il ne les touche jamais. Il les regarde.", "— C'est-à-dire ?", "— Il sait tout. Ce qu'elles mangent, à quelle heure elles se lèvent, ce qu'elles lisent, avec qui elles parlent quand elles croient qu'il est parti. Il ne l'utilise pas contre elles. Il ne l'utilise pas du tout. Il le garde.", "Elle a levé les yeux.", "— Vous avez vu les trois pièces fermées ?", "— Non.", "— Ne les cherchez pas. Il y a dedans dix vies qu'il connaît mieux que les gens qui les vivent. Mina l'a compris au sixième mois. Elle a trouvé son carton. Elle a lu ce qu'il avait écrit sur elle.", "— Qu'est-ce qu'il avait écrit ?", "— Rien de sale. C'est ça le pire. Des choses justes. Des choses tendres, même. Il avait remarqué qu'elle chantait dans la douche seulement les jours où elle avait eu des nouvelles de son frère. Il avait remarqué quand elle avait arrêté de chanter. Il n'a jamais rien fait. Il a juste noté la date.", "J'ai posé ma tasse.", "— Elle est partie.", "— Elle est partie en pleine nuit, sans finir son année, en sachant que son score retombait à 380. Elle a préféré 380 à un homme qui savait qu'elle avait arrêté de chanter.", "Hedda s'est levée. À la porte, elle a ajouté :", "— Vous, il vous regarde autrement. Je le vois. Je ne sais pas si c'est mieux ou pire, et je ne suis pas payée pour le savoir.", "Ce soir-là, je suis descendue au bureau. Il était là, comme toujours, avec un dossier.", "Je me suis assise en face de lui sans y être invitée.", "— Vous m'observez.", "Il a levé la tête. Il n'a pas nié.", "— Oui.", "— Vous notez ?", "— Pas encore.", "— Pourquoi « pas encore » ?", "Il a fermé le dossier.", "— Parce que le jour où je commence, je ne suis plus un garant, Ilya. Je deviens quelque chose que je n'ai pas de mot pour désigner et que je n'ai pas envie d'être. Alors je ne commence pas. Je regarde. C'est déjà trop.", "— Vous devriez arrêter.", "— Oui.", "— Vous n'arrêterez pas.", "Il m'a regardée longtemps, et pour la première fois, ce n'était pas un homme qui énonce un tarif.", "— Non, a-t-il dit. Je n'arrêterai pas. Et vous avez le droit de partir ce soir, sans pénalité, article 13. Je ne vous retiendrai pas. Je ne vous suivrai pas. Je n'ouvrirai jamais de carton à votre nom.", "J'ai pensé à Mina, à 380, dans la nuit.", "Puis j'ai pensé à ma mère, qui avait construit une machine pour regarder tout le monde, et qui était morte de l'avoir fait.", "— Je reste, ai-je dit.", "— Pourquoi ?", "— Parce que je veux savoir ce que vous voyez quand vous me regardez. Et parce que je crois que c'est la première fois de ma vie que quelqu'un regarde vraiment.", "Je suis montée.", "Je n'ai pas fermé ma porte à clé. C'était une décision. C'est la seule dont je sois sûre, encore aujourd'hui, qu'elle m'appartenait entièrement."]}, {"n": 6, "t": "Le dîner du vingt-troisième jour", "pov": "Ilya", "p": ["Le vingt-troisième jour, il a mis deux couverts.", "Il n'avait jamais mis deux couverts. Depuis trois semaines, la table de la salle à manger était un meuble décoratif : il mangeait debout dans la cuisine, je mangeais dans ma chambre, et nous nous croisions dans les couloirs comme deux personnes qui partagent une maison sans partager de vie.", "Ce soir-là, il y avait une nappe.", "— Article 7, ai-je dit depuis la porte. Résidence obligatoire. Rien sur les dîners.", "— Article 7 n'interdit rien non plus.", "Je me suis assise.", "Nous avons mangé en silence pendant quatre minutes. Je les ai comptées, parce que compter est ce que je fais quand je ne sais pas où poser mes mains.", "— Vous comptez, a-t-il dit.", "— Pardon ?", "— Vos doigts. Sur le pied du verre. Quatre fois quatre. Vous comptez quelque chose.", "Je me suis arrêtée net.", "Il a reposé sa fourchette.", "— Je vous avais prévenue.", "— Vous m'aviez dit que vous regardiez. Pas que vous décodiez.", "— C'est la même chose quand on le fait assez longtemps. C'est pour ça que j'ai dit que c'était déjà trop.", "J'ai bu une gorgée pour me donner le temps.", "— Alors dites-moi le reste.", "— Non.", "— Vous avez peur de quoi ? Que je parte ? Article 13. Vous me l'avez rappelé vous-même.", "Il a posé les mains à plat sur la nappe, exactement comme moi quand j'annotais le contrat.", "— Je vais vous dire trois choses, a-t-il dit. Pas dix. Trois. Et quand j'aurai fini, vous saurez pourquoi je m'arrête là.", "— Allez-y.", "— Vous vérifiez votre score en vous réveillant et vous ne l'avez plus fait depuis le soir de la bibliothèque, sauf une fois, le dix-septième jour, après un appel. Vous laissez toujours la dernière bouchée dans l'assiette. Et vous vous asseyez face aux portes.", "Le silence s'est installé entre nous comme une troisième personne.", "— La dernière bouchée, ai-je dit d'une voix qui n'était pas tout à fait la mienne. C'est ma mère. On n'avait jamais assez. Elle disait qu'une assiette vide, c'est une assiette qui a gagné.", "— Je sais.", "— Comment ?", "— Je ne savais pas pourquoi. Je savais seulement que vous le faisiez. C'est toute la différence entre ce que je vois et ce que je comprends, Ilya, et c'est pour ça que je m'arrête à trois. Parce que si je continue, à un moment, je vais deviner juste. Et le jour où je devine juste sans que vous me l'ayez dit, je vous aurai pris quelque chose.", "J'ai regardé ma dernière bouchée.", "Puis je l'ai mangée.", "Il n'a rien dit. Mais j'ai vu sa main se fermer très légèrement sur la nappe, et j'ai compris que je venais de lui donner quelque chose de plus grand que ce que le contrat prévoyait — et que je l'avais fait exprès.", "— Aurel.", "C'était la première fois que je disais son prénom. Il l'a entendu. Tout le corps l'a entendu.", "— Le dix-septième jour, ai-je dit. L'appel. C'était le Bureau. Ils m'ont proposé un entretien.", "Il est devenu parfaitement immobile.", "— Quel type d'entretien ?", "— « Valorisation de profil ». Ils disent qu'une personne portée par un garant à 940 présente un intérêt d'observation.", "— Vous avez accepté ?", "— J'ai dit que je réfléchissais.", "Il s'est levé. Il a marché jusqu'à la fenêtre, m'a tourné le dos, et il est resté là assez longtemps pour que je voie ses épaules bouger une fois.", "— Ce n'est pas un entretien, a-t-il dit enfin. C'est une offre de rachat.", "— De quoi ?", "— De vous. Le Bureau ne « valorise » jamais un profil. Il propose de reprendre le portage à son compte. Vous passeriez de mon foyer au leur.", "— Et mon score ?", "— 850. Immédiatement.", "Il s'est retourné.", "— C'est plus que ce que je peux vous donner en un an, Ilya. Et je suis obligé de vous le dire, parce que si je vous le cachais, je deviendrais exactement l'homme que vous avez cru rencontrer dans cette ruelle."]}, {"n": 7, "t": "Ce que je ne lui ai pas dit", "pov": "Aurel", "p": ["Je ne lui ai pas dit ce qu'était vraiment un portage d'État.", "J'ai dit 850. C'est vrai. J'ai dit « vous passeriez dans leur foyer ». C'est vrai aussi.", "Je n'ai pas dit qu'un foyer d'État n'est pas une maison. Que c'est une résidence de quarante personnes, à Vesper-Est, avec des horaires, une caméra par couloir, et un score qui monte parce qu'on ne peut plus rien faire qui le fasse baisser. Je n'ai pas dit que deux des onze personnes que j'ai portées y sont entrées après moi, et que l'une d'elles, quand je lui ai écrit deux ans plus tard, a répondu une phrase de quatre mots : ne m'écrivez plus, monsieur.", "Je me suis donné une excuse : elle allait le découvrir en se renseignant, elle est trop méthodique pour ne pas se renseigner.", "C'est faux. La documentation publique sur les foyers d'État est exemplaire. On y voit des cuisines lumineuses et des gens qui sourient.", "J'ai menti par omission un mardi soir, devant une fenêtre, en lui tournant le dos, et je l'ai fait pour la garder.", "Cette nuit-là, je suis descendu dans la troisième pièce.", "J'ai sorti un carton vide. J'ai écrit son nom dessus au crayon — au crayon, parce qu'une part de moi négociait encore avec l'autre — et je suis resté assis par terre à regarder ces cinq lettres pendant une heure.", "Puis j'ai effacé.", "Puis j'ai réécrit.", "À trois heures du matin, j'ai entendu du bruit au-dessus. Elle ne dormait pas non plus. Elle marchait dans la bibliothèque, et j'ai reconnu son pas parce que je connais son pas, ce qui est précisément le genre de chose que je ne devrais pas savoir.", "Je suis remonté. Elle était par terre, au même endroit que le soir du rapport annuel, avec quatre volumes ouverts autour d'elle.", "— Le Code du Portage, a-t-elle dit sans lever les yeux. Article 44. « Le portage d'État est irrévocable pour la personne portée. »", "Mon estomac s'est retourné.", "— Vous l'avez trouvé.", "— Il m'a fallu six heures. C'est dans une annexe. Vous, il vous aurait fallu six secondes, parce que vous le saviez déjà.", "Elle a levé les yeux.", "— Irrévocable, Aurel. 850 à vie, dans un foyer que je ne pourrai plus quitter. Et vous m'avez présenté ça comme une offre meilleure que la vôtre.", "— Oui.", "— Pourquoi ?", "J'ai cherché une réponse habile. Il n'y en avait pas.", "— Parce que je voulais que vous refusiez en croyant refuser quelque chose de bien. Si je vous avais dit la vérité, vous auriez refusé par peur. Je voulais que vous restiez par choix.", "Elle m'a regardé longtemps.", "— Vous entendez ce que vous dites ? Vous avez truqué l'information pour obtenir un consentement qui vous plaise davantage. C'est exactement ce que fait le Bureau. C'est exactement ce que ma mère a construit.", "Elle s'est levée. Elle était très calme, et c'était pire que si elle avait crié.", "— Je ne pars pas ce soir, a-t-elle dit. Pas parce que je vous pardonne. Parce que si je pars maintenant, vous allez passer le reste de votre vie à vous raconter que j'ai fui un homme qui vous ressemble. Je veux que vous me regardiez rester en sachant exactement ce que vous avez fait.", "Elle est montée.", "Je n'ai pas dormi. Au matin, j'ai descendu le carton à la cave, et je l'ai brûlé dans l'incinérateur avec les cinq lettres dessus.", "C'était la première chose honnête que je faisais depuis vingt-trois jours, et elle ne l'a jamais su."]}, {"n": 8, "t": "Vesper-Est", "pov": "Ilya", "p": ["J'ai accepté l'entretien.", "Pas pour l'accepter — pour voir. Il y a une différence que je n'ai pas expliquée à Aurel, parce qu'il ne m'a pas laissé le choix d'être honnête avec lui.", "Le foyer de Vesper-Est est un bâtiment de sept étages, en verre clair, avec un jardin intérieur. Les brochures ne mentent pas : les cuisines sont lumine
