uses.", "Ce qu'elles ne montrent pas, c'est le bruit. Un foyer d'État ne fait aucun bruit. Quarante personnes, et un silence de bibliothèque à onze heures du matin, parce que chaque conversation est une variable et que tout le monde a fini par apprendre que la variable la plus sûre est zéro.", "L'agent qui m'a reçue s'appelait Verrien. Il souriait bien.", "— Madame Marchetti. 703. Portée par Aurel Sarn depuis vingt-cinq jours.", "— Vingt-six.", "— Vingt-six. Nous vous proposons 850 et une stabilité définitive.", "— Définitive.", "— Vous avez lu l'article 44, dit-il sans cesser de sourire. C'est bien. Les gens qui le lisent sont ceux qui restent le plus longtemps, parce qu'ils ne se font pas d'illusion.", "Il a poussé un dossier vers moi.", "— Il y a une seconde raison à notre intérêt. Votre mère.", "J'ai gardé les mains immobiles.", "— Nadia Marchetti a conçu le modèle de propagation. Elle a aussi, dans ses deux dernières années, écrit autre chose. Un correctif. Une règle inverse qui aurait plafonné la propagation par lien familial.", "— Il n'a jamais été appliqué.", "— Il n'a jamais été retrouvé. Elle l'a sorti du Bureau. Nous pensons qu'elle vous l'a laissé.", "La pièce est devenue très nette, comme quand on dessine une carte.", "— Vous ne me portez pas, ai-je dit. Vous me rangez. Vous voulez m'avoir dans un bâtiment où mes affaires sont à vous.", "Verrien a souri un peu plus.", "— Nous vous offrons 850.", "— Non.", "— Madame Marchetti, votre garant actuel est une solution temporaire. Dans onze mois, votre contrat s'achève et vous retombez à 412.", "— Je sais compter.", "— Alors comptez ceci : un garant peut mourir. Un garant peut chuter. Un garant peut changer d'avis, et l'article 12 lui permet de mettre fin au contrat sans motif, à tout moment. Vous avez remis votre vie entière entre les mains d'un homme seul.", "Il s'est adossé.", "— L'État, lui, ne change pas d'avis.", "Je suis rentrée à pied. Deux heures, de Vesper-Est à la Zone Nord, sous une pluie fine, en passant par le port.", "Je me suis arrêtée devant la ruelle où il m'avait abordée. Les grues déchargeaient. Personne ne m'a regardée.", "Et j'ai compris quelque chose que ni Aurel ni Verrien ne m'avaient dit, parce qu'aucun des deux n'avait intérêt à ce que j'y pense :", "Ma mère n'avait pas caché son correctif dans un tiroir.", "Elle l'avait caché dans la seule chose que le Bureau ne pouvait pas saisir, que personne ne pouvait consulter sans mon niveau d'accès, et dont le contenu ne devient lisible qu'à la mort de la personne.", "Son propre dossier de santé.", "Celui-là même dont la facture impayée avait fait tomber mon score."]}, {"n": 9, "t": "Trente-deux pages", "pov": "Aurel", "p": ["Elle est rentrée trempée et elle est allée directement au bureau, sans retirer son manteau.", "— J'ai besoin de votre clé.", "— Ilya—", "— Pas pour le dossier de carrière. Pour le dossier médical. C'est un autre niveau d'accès, et vous l'avez.", "J'avais préparé une conversation entière. Des excuses, une explication, une offre. Elle ne m'a pas laissé une seconde.", "— Le Bureau cherche un correctif que ma mère a écrit et sorti. Ils pensent qu'elle me l'a laissé. Ils ont raison. Il est dans son dossier de santé — le seul document qu'on ne peut ouvrir qu'après la mort et seulement à un niveau que je n'aurai jamais.", "— Si j'ouvre ce dossier depuis ma clé, ai-je dit lentement, la consultation est journalisée dans l'heure.", "— Je sais.", "— Le Bureau saura que je cherche ce qu'ils cherchent.", "— Je sais aussi.", "— Mon score tombera. Pas un peu. Un garant qui fouille les archives médicales d'une personne portée, c'est un signalement de niveau trois. 940 devient 600 en une nuit. Et vous, vous retombez avec moi.", "— Je sais, Aurel. J'ai lu les trente-deux pages.", "Elle a posé les mains sur mon bureau.", "— Alors décidez. Parce que voilà ce que j'ai appris aujourd'hui : Verrien m'a expliqué, avec un très joli sourire, que vous étiez une solution temporaire. Que vous pouviez mourir, chuter, ou changer d'avis. Et le pire, c'est qu'il avait raison sur les trois. Vous êtes la chose la plus fragile de ma vie.", "— Je ne changerai pas d'avis.", "— Prouvez-le. Pas avec une phrase. Avec le seul chiffre qui vous définit.", "Nous nous sommes regardés, de part et d'autre d'un bureau, comme le premier soir, sauf que le premier soir j'énonçais un tarif.", "J'ai posé ma clé sur la table.", "— Une condition.", "— Laquelle ?", "— Vous lisez avec moi. Pas dans une autre pièce. Ici. Parce que si je fais ça, je ne veux pas ensuite avoir à vous raconter ce que j'ai vu. Plus jamais de version filtrée par moi. C'est fini.", "Elle a hoché la tête une fois.", "Le dossier s'est ouvert à vingt-trois heures douze.", "Il faisait quatre cents pages. Sept ans de soins, deux hospitalisations, une facture de quatre mille huit cents unités impayée en 2047 — celle qui avait tout déclenché.", "Et à la page trois cent quatre, dans la rubrique « antécédents familiaux », là où les médecins notent ce que les patients leur racontent, une écriture manuscrite scannée.", "Ce n'était pas un antécédent.", "C'était une formule. Quarante-deux lignes de notation mathématique, écrites à la main dans la case d'un formulaire médical, avec une note en bas :", "« Modèle de plafonnement par lien. Testé, fonctionnel, refusé le 12 mars 2046. Si ceci est lu un jour, c'est que quelqu'un cherchait ma fille. Qu'il la cherche pour la bonne raison. N. M. »", "Ilya a lu deux fois.", "Puis elle s'est mise à pleurer, sans bruit, debout, avec cette économie de mouvement qu'elle a en tout — et j'ai fait la seule chose que le contrat n'interdisait pas et que je m'étais interdite pendant vingt-six jours.", "Je me suis levé et je l'ai prise dans mes bras.", "Elle n'a pas reculé.", "À vingt-trois heures quarante et une, mon terminal a émis une note brève.", "940 → 604.", "Elle l'a entendue contre ma poitrine. Elle a relevé la tête.", "— Ça y est.", "— Ça y est.", "— Vous regrettez ?", "— Non, ai-je dit. Pour la première fois depuis huit ans, je sais exactement ce que je vaux, et ce n'est plus un chiffre."]}, {"n": 10, "t": "Deux mille quatre cents", "pov": "Ilya", "p": ["Nous avons eu onze heures avant qu'ils arrivent.", "Aurel a passé les trois premières à faire ce que je n'aurais pas su faire : appeler. Un juriste à Vesper-Ouest, un ancien du Bureau devenu professeur, une journaliste qu'il connaissait depuis douze ans et à qui il n'avait jamais rien demandé.", "Moi, j'ai passé ces heures sur les quarante-deux lignes.", "Ma mère écrivait comme elle devait parler : sans un mot de trop. Le modèle tenait en une idée simple et dévastatrice. La propagation par lien n'est pas plafonnée parce que personne n'a jamais demandé à l'algorithme de distinguer un lien choisi d'un lien subi. On hérite du score d'un cousin qu'on n'a pas vu depuis vingt ans exactement comme de celui d'un conjoint. Son correctif introduisait cette distinction. Appliqué à Vesper, il faisait remonter deux millions quatre cent mille personnes au-dessus de 450.", "Deux mille quatre cents personnes rien que dans ma rue.", "— Ils vont dire que c'est un faux, a dit Aurel à cinq heures du matin.", "— C'est son écriture. Il y a des échantillons dans son dossier de carrière.", "— Ils diront que vous l'avez fabriqué pour faire chanter le Bureau.", "— Alors il faut que ce ne soit plus moi qui le détienne.", "Il a levé la tête.", "— La journaliste ?", "— Non. Une journaliste, c'est un article, et un article, ça se dément. Il faut que ça devienne public au sens propre. Le Registre des Contributions Ouvertes. Tout citoyen peut y déposer une proposition de règle. Elle doit être examinée sous soixante jours. Personne ne s'en sert parce que personne ne sait écrire une règle.", "— Vous, vous ne savez pas l'écrire.", "— Non, ai-je dit. Mais ma mère l'a écrite. Moi, je n'ai qu'à la déposer.", "Nous l'avons déposée à sept heures dix, sous mon nom, avec la mention obligatoire de l'auteur : Nadia Marchetti, ingénieure, Bureau des Scores, 2041-2046.", "Ils sont arrivés à neuf heures.", "Quatre agents, Verrien devant, avec le même sourire et une chemise cartonnée.", "— Monsieur Sarn. Signalement de niveau trois. Consultation d'archives médicales sans motif de portage.", "— C'est exact.", "— Votre score est à 604. Vous comprenez que vous n'êtes plus qualifié comme garant. Le contrat qui vous lie à madame Marchetti est suspendu de plein droit.", "— Je comprends.", "Verrien s'est tourné vers moi, et son sourire s'est élargi, parce qu'il croyait arriver au moment qu'il avait préparé.", "— Madame Marchetti. Vous êtes reportée à 412. L'offre de l'État tient toujours. 850, aujourd'hui, tout de suite.", "J'ai regardé Aurel.", "Il ne m'a pas fait signe. Il n'a pas parlé pour moi. Il est resté immobile, et il a attendu, et c'est la seule chose au monde qu'il pouvait faire pour moi à cet instant — et il le savait.", "— Non, ai-je dit.", "— Réfléchissez—", "— J'ai déposé une proposition au Registre des Contributions Ouvertes ce matin à sept heures dix. Numéro 41-2049-0113. Vous avez soixante jours pour l'examiner, et vous ne pouvez pas l'écarter, parce qu'elle est signée d'une ingénieure du Bureau et qu'elle est reproductible.", "Le sourire de Verrien est resté en place, mais quelque chose derrière s'est éteint.", "— Si vous m'emmenez à Vesper-Est aujourd'hui, ai-je continué, ce sera dans le journal de dépôt : « auteure de la proposition 41-2049-0113, placée en foyer d'État le lendemain ». Vous pouvez le faire. Je ne vous en empêcherai pas. Mais vous porterez ça pendant soixante jours pendant que deux millions quatre cent mille personnes apprendront ce qu'il y avait dans le dossier médical de ma mère.", "Personne n'a bougé pendant peut-être dix secondes.", "Verrien a refermé sa chemise.", "— Nous reviendrons, a-t-il dit.", "— Je sais, ai-je répondu. Et je serai à 412. Vous saurez où me trouver : c'est écrit dans votre système, c'est le principe.", "Ils sont partis.", "La porte s'est refermée. Mon terminal a sonné : 703 → 412.", "Le sien a sonné aussi, une seconde plus tard.", "Nous sommes restés là, tous les deux, dans une maison de onze pièces, avec deux mauvais chiffres et aucun contrat entre nous.", "— Article 13, a-t-il dit d'une voix bizarre. Vous pouvez partir sans pénalité. Il n'y a plus rien à perdre.", "Je me suis approchée de lui.", "— Aurel.", "— Oui ?", "— Il n'y a plus de contrat. Plus de score à protéger. Plus de preuve de vertu. Vous n'avez plus aucune raison de me garder ici.", "— Aucune.", "— Bien, ai-je dit. C'est la première fois que je vais pouvoir savoir ce que vous voulez vraiment."]}], "couv": true}, {"id": "braises", "titre": "La Saison des Braises", "serie": "Les Trois Cents Lieues — tome 1", "auteur": "Écrit avec Claude", "genres": ["Romance sensuelle", "Fantasy", "Enemies to lovers", "Slow burn", "Série"], "annee": "2026", "couleur": "#8a3a1f", "statut": "En cours", "resume": "Ysée Marrec ne dessine que ce qu'elle a vu, et la carte du Nord se termine en blanc : trois cents lieues au-delà de la Ligne des Cendres, là où la terre brûle depuis quatre-vingts ans. Pour la traverser, la Guilde lui donne un seul guide — Cael, un Braise, un homme que le feu a touché sans le tuer et qui ne connaît pas le froid. Ce qu'on ne lui a pas dit : la Ligne ne laisse passer que ceux qu'un Braise porte dans sa chaleur. Assez près. Pendant trois jours.", "chapitres": [{"n": 1, "t": "Ce qu'on n'a pas vu", "pov": "Ysée", "p": ["J'arrive toujours à l'atelier une heure avant les autres.", "Ce n'est pas du zèle. C'est que le soleil du matin entre par la fenêtre du fond, et que pendant une heure, il tombe exactement sur ma table. Après, il glisse vers celle de Tomas, dont le père siège au Conseil et qui n'a jamais eu besoin de se lever tôt.", "Ce matin-là, je terminais la côte.", "Trois mois de travail. Trois mois à marcher le bord de mer, une chaîne d'arpenteur au poing — cent pas de chaîne, qu'on tend, qu'on marque, qu'on recommence — pour mesurer quatre-vingt-douze lieues de littoral. Tout ça pour arriver à ceci : une feuille de vélin de deux coudées sur trois, où chaque crique est à sa place.", "Et une correction, au milieu, dont j'étais fière.", "Le passage entre les deux bancs de sable, à l'entrée du port de Kern, n'est plus là où les cartes le disent. La dernière carte datait de trente ans. Le sable a bougé de deux cents pas vers l'ouest depuis. Personne n'était allé vérifier. Deux navires s'y sont éventrés l'hiver dernier.", "Moi, j'y suis allée. Deux fois.", "J'ai posé la plume. J'ai soufflé sur l'encre.", "Puis j'ai pris le tampon de la Guilde, et je l'ai appuyé en bas à droite, dans le petit encadré prévu pour le nom de celui qui signe la carte.", "Dressée sous l'autorité du Doyen Aldric Vael.", "En dessous, il y a une deuxième ligne. Elle est prévue pour le nom de celui qui a marché. Elle existe sur toutes les cartes de cette maison depuis cent ans.", "Pour quelqu'un comme moi, on ne la remplit pas.", "— Elle est belle, a dit Tomas en arrivant, penché par-dessus mon épaule d'un peu trop près. Le passage est juste ?", "— Le passage est juste.", "— Tu as marché tout ça à pied ?", "— Deux fois. On ne dessine jamais ce qu'on n'a pas vu.", "Il a ri, parce qu'il croyait que je récitais la règle de la maison. Je ne récitais rien. C'est la seule chose qui m'appartienne vraiment.", "J'ai roulé la carte et je l'ai portée à l'étage. Le vieux Marbier l'a déroulée sur sa table, l'a parcourue avec la lenteur des gens qui ont le droit d'être lents, et a hoché la tête une fois.", "— Bon travail, petite.", "J'ai vingt-quatre ans.", "Je suis redescendue par la cour. Il pleuvait sur les toits de Valdren, et la mer, en bas de la ville, avait cette couleur de plomb qu'elle prend en octobre.", "Alors j'ai sorti mon autre carnet.", "Le petit. Celui que je garde cousu dans la doublure de mon manteau, et dont personne ici ne connaît l'existence. J'y note ce que je vois et que la Guilde ne me demande pas de dessiner.", "Le passage de Kern a bougé de deux cents pas vers l'ouest. Ce n'est pas la mer. C'est la digue que les marchands de sel ont fait bâtir plus haut sur la côte, il y a dix ans : elle a coupé le courant, et le courant déplaçait le sable. Je ne l'ai pas mis sur la carte. Personne ne me l'a demandé.", "Huit ans que je le remplis. Il est plein aux trois quarts.", "Je l'appelle le blanc.", "C'est à ce moment-là que le coursier m'a trouvée, essoufflé, sa livrée trempée de pluie.", "— Ysée Marrec ? Le Doyen vous demande.", "J'ai refermé le carnet.", "En huit ans dans cette maison, le Doyen Vael ne m'avait jamais adressé la parole. Il avait signé quarante-trois de mes cartes.", "— Maintenant ?", "— Il a dit : avant qu'elle enlève ses bottes."]}, {"n": 2, "t": "Trois cents lieues de blanc", "pov": "Ysée", "p": ["Le bureau du Doyen occupe tout le dernier étage de la tour de la Guilde, et ses murs sont couverts de cartes du sol au plafond.", "Je les connais toutes. J'en ai copié la moitié.", "Aldric Vael a soixante et un ans, des mains de copiste et une réputation de guerre. C'est lui qui a dressé les cartes des campagnes du Nord, il y a vingt-deux ans — celles qui ont permis aux armées du Sud de savoir où frapper. La Guilde ne le dit pas comme ça. La Guilde dit : le Doyen a servi la couronne pendant les Fours.", "Il ne m'a pas fait asseoir.", "— Kern est bonne, a-t-il dit sans préambule. La passe a bougé et vous l'avez vue. Personne d'autre ne l'aurait vue.", "— Merci, Doyen.", "— Ce n'est pas un compliment. C'est un état de fait, et j'ai besoin d'un état de fait ce matin.", "Il a marché jusqu'au mur du fond, et il a tiré sur une cordelette.", "Le rideau a glissé. Derrière, la grande carte du Nord.", "Je l'avais vue de loin, comme tout le monde. Jamais de près.", "Elle est immense — deux hommes de haut — et elle est magnifique jusqu'à mi-hauteur. Les provinces du Nord, les routes, les cols, les villes : tout est là, tracé par des mains mortes depuis longtemps, avec ce soin qu'on mettait aux cartes avant la guerre.", "Et puis, à mi-hauteur, une ligne noire irrégulière barre la feuille d'un bord à l'autre.", "Au-dessus, il n'y a rien. Du papier nu sur trois cents lieues. Pas une côte, pas un fleuve, pas un nom.", "C'est le plus grand blanc du monde connu.", "— La Ligne des Cendres, a dit Vael. Quatre-vingt-deux lieues de large au plus étroit. Au-delà, plus personne n'est allé depuis vingt-deux ans.", "— Des expéditions ont essayé.", "— Onze. Vous voulez le détail ? Quatre ont renoncé avant la Ligne. Six y sont entrées et ne sont pas ressorties. Une est ressortie : trois hommes sur neuf, brûlés jusqu'à l'os, incapables de dire ce qu'ils avaient vu. Ils sont morts dans la semaine.", "Il s'est retourné.", "— Vous allez la traverser.", "J'ai mis un temps à comprendre que ce n'était pas une hypothèse.", "— Pourquoi maintenant ?", "C'est la seule question qui comptait, et il l'a su, et il a eu — c'est la seule fois — quelque chose comme du respect dans le regard.", "— Parce que deux princes m'ont commandé la même carte à quatre jours d'intervalle. Kerlan au levant, Orsange au couchant. Chacun croit être le seul. Quand deux hommes qui se détestent veulent la même chose en même temps, ce n'est pas de la curiosité. C'est qu'ils ont appris quelque chose.", "— Quoi ?", "— Je l'ignore. C'est précisément pour cela que je veux la carte avant eux. Celui qui sait ce qu'il y a derrière la Ligne tient les deux autres.", "J'ai regardé le blanc.", "Trois cents lieues. Une vie entière de relevés. La seule carte, dans toute l'histoire de cette Guilde, qui ne serait pas une correction d'une carte plus ancienne.", "— Combien d'hommes ?", "— Un.", "J'ai cru avoir mal entendu.", "— Un guide. Un Braise. Il s'appelle Cael.", "J'ai dû faire une tête, parce qu'il a précisé, du ton dont on récite une évidence :", "— Un de ceux qui sont nés dans le Nord au moment de la rupture des Fours. Le feu est entré en eux et n'en est jamais ressorti. Ils ne craignent pas la chaleur. C'est le seul moyen de passer la Ligne, et je ne vous expliquerai pas pourquoi aujourd'hui : vous n'êtes pas encore engagée, et ce n'est pas une chose qui se dit à quelqu'un qui n'est pas engagé.", "— Et si je refuse ?", "Le Doyen a laissé retomber le rideau sur la carte.", "— Vous êtes pupille de cette maison, Ysée Marrec. Orpheline recueillie à sept ans. Elle vous a nourrie, logée et instruite pendant dix-sept ans, et en échange vous ne refusez jamais une mission — c'est écrit sur le registre que quelqu'un a signé à votre place quand vous aviez sept ans.", "Il a laissé cela retomber.", "— Alors non, vous ne refusez pas. Mais je préfère que vous acceptiez, parce que quelqu'un qui n'a pas envie d'être là ne voit rien.", "Il s'est assis. Il a repris une plume.", "— Vous avez jusqu'à demain matin.", "À la porte, je me suis arrêtée.", "— Doyen. Pourquoi moi ?", "Il n'a pas levé les yeux.", "— Parce que vous voyez ce que personne ne demande à voir. Et parce que vous êtes la seule ici dont personne ne viendra réclamer le corps."]}, {"n": 3, "t": "Le sel", "pov": "Cael", "p": ["Le sel qu'on sort de la mine n'est pas du sel. C'est de la pierre grise, dure, pleine de terre. Pour en tirer du sel blanc, il faut la fondre, et pour la fondre, il faut une chaleur qu'aucun feu de bois ne donne.", "C'est pour cela que la maison Serrande nous possède, nous autres, à quatre.", "Mon travail tient en quatre gestes. J'entre dans la halle au lever du jour. Je pose les mains sur la porte de fonte du four. Je pousse ma chaleur dedans jusqu'à ce que la pierre grise devienne liquide. Puis on verse, on laisse refroidir, on casse au marteau — et on recommence.", "Dix-neuf ans.", "Voilà ce que personne ne dit sur nous.", "La chaleur ne vient pas de l'air. Elle vient de moi. Et chaque fois que je la donne, elle ne revient pas tout à fait. Nous ne vieillissons pas comme les autres : nous brûlons de l'intérieur, lentement, jusqu'au bout. À quarante ans, un homme qui tient un four a les mains d'un vieillard.", "Vaugrin, qui tenait le four d'à côté avant moi, est mort à quarante-quatre ans en s'asseyant sur un banc.", "J'en ai vingt-sept.", "Ce matin-là, j'avais coulé six cuves quand Torve, le contremaître, est venu me chercher.", "— Le jeune maître te demande.", "Halden Serrande m'attendait dans la cour, hors de la chaleur, avec des gants. Il portait toujours des gants près des fours. Je crois qu'il ne s'en rendait pas compte.", "— Dorne.", "— Maître Serrande.", "— Ton contrat est levé.", "Je suis resté immobile. Il y a des phrases qu'on n'entend pas la première fois parce qu'on a passé dix-neuf ans à ne pas les espérer.", "— Pardon ?", "— Levé. Racheté. Éteint. Tu ne travailles plus pour cette maison à compter de demain.", "Il l'a dit avec un calme parfait, et c'est le calme qui m'a averti. Un homme qui perd un Braise perd quatre cents mesures de sel par jour. Un homme qui perd quatre cents mesures de sel par jour ne le dit pas avec calme.", "— Qui ?", "— Cela ne te regarde pas.", "— Maître Serrande. Un contrat comme le mien ne s'éteint pas. Il change de main. C'est la loi, et je la connais par cœur, parce que c'est le seul texte qu'on m'ait laissé apprendre à lire pendant six ans. Alors je repose la question : qui ?", "Quelque chose a bougé dans son visage. De la colère, et dessous, autre chose — de l'embarras. Comme un homme qui vend un cheval qu'il aimait bien.", "— La Guilde des Cartographes.", "Le sol a tenu bon sous mes pieds. C'est tout ce que je peux en dire.", "— Le Doyen Vael.", "— En personne.", "Vingt-deux ans que je porte ce nom dans la tête. Le cartographe de la couronne. L'homme dont les cartes hachurées désignaient, sur le papier, les quartiers des Fours où l'on trouvait le plus d'enfants. Je ne les ai pas vues. On me les a décrites une fois, dans une cave de Valdren, par un homme qui avait servi comme copiste et qui buvait pour l'oublier.", "— Pourquoi ?", "Halden a retiré un gant, puis l'autre, lentement.", "— Il monte une expédition. Il lui faut un homme comme toi. Il paie trois fois ce que vaut un contrat de four, et mon père a soixante-douze ans et pense que l'argent vaut mieux que le sel.", "Il a remis ses gants.", "— Moi, je pense qu'il a tort. Je pense qu'on ne vend pas ce qui fait marcher une maison. Et je pense que tu vas revenir, Dorne, parce que personne ne revient de là où il t'envoie, mais que si quelqu'un revient, ce sera toi.", "Il a tourné les talons.", "— Maître Serrande.", "Il s'est arrêté.", "— Où m'envoie-t-il ?", "Et Halden Serrande, l'homme qui allait passer les mois suivants à essayer de m'empêcher d'arriver, m'a répondu la vérité pour la seule et unique fois de notre vie :", "— Au Nord. De l'autre côté de la Ligne. Chez toi."]}, {"n": 4, "t": "Les hachures", "pov": "Ysée", "p": ["Je n'ai pas dormi. J'ai fait autre chose.", "Les archives de la Guilde ferment à la sixième cloche, mais les pupilles ont les clés parce que ce sont les pupilles qui rangent. C'est l'un des rares privilèges de n'être rien : on vous confie tout.", "J'ai descendu les trois étages. J'ai allumé une lampe. Et j'ai été droit au casier des campagnes du Nord.", "Il y a quarante-six cartes dans ce casier.", "J'en ai copié neuf, à seize ans, pendant mon année de Copiste. On donne toujours les cartes de guerre aux pupilles : elles sont fastidieuses, pleines de hachures et de conventions militaires, et personne d'autre ne veut les faire.", "J'en ai été fière. Je m'en souviens précisément. Neuf cartes de campagne à seize ans, quand les fils de famille en faisaient trois.", "J'ai déroulé la première.", "Quartier bas des Fours de Ghar. Relevé du 14 du mois des vents, an 39. Dressé sous l'autorité du Doyen Aldric Vael.", "Les rues sont là. Les forges, les puits, les ponts. Et par-dessus, à l'encre rouge, les hachures : des zones tramées, serrées, avec une légende dans le coin inférieur droit que ma main de seize ans avait recopiée sans y penser, parce qu'on ne pense pas à seize ans, on trace.", "Trame serrée : densité forte. Trame lâche : densité faible. Croix : confirmé.", "Densité de quoi.", "Il n'y avait pas de mot après densité. Il n'y en a jamais. C'est une convention militaire : on ne nomme pas la cible sur le document, on la nomme dans l'ordre de mission.", "J'ai déroulé les huit autres.", "Trame serrée sur les quartiers d'habitation. Trame lâche sur les entrepôts. Croix sur les écoles de forge, celles où les enfants des forgerons entraient à cinq ans pour apprendre le feu.", "Croix sur les écoles.", "Je suis restée assise par terre, dans la poussière des archives, avec neuf cartes de ma propre main étalées autour de moi, et j'ai compris avec vingt ans de retard ce que j'avais dessiné.", "Je n'ai pas pleuré. J'ai fait ce que je fais.", "J'ai sorti le blanc, et j'ai noté, et ma main tremblait tellement que j'ai dû m'y reprendre à deux fois :", "Campagnes du Nord, an 39. Neuf cartes copiées par moi. Les hachures ne mesurent pas des positions militaires. Elles mesurent des gens. Les croix marquent les écoles de forge. Je ne l'ai pas vu. Je ne l'ai pas demandé. Je ne l'ai pas su et j'aurais pu le savoir en posant une seule question.", "Et en dessous, plus bas, une ligne que je n'ai jamais relue sans avoir chaud au visage :", "Je suis bonne parce que je vois. Je n'ai rien vu.", "J'ai rangé les cartes. J'ai remonté les trois étages.", "À l'aube, j'étais debout devant la fenêtre de ma cellule, et le ciel virait au gris au-dessus des toits mouillés de Valdren, et je savais deux choses.", "La première, c'est que j'allais dire oui.", "La seconde, c'est que ce ne serait pas parce que le Doyen me l'avait ordonné."]}, {"n": 5, "t": "J'accepte", "pov": "Ysée", "p": ["— J'accepte, ai-je dit.", "Le Doyen Vael a levé les yeux de son courrier avec l'air d'un homme qui n'avait pas prévu d'autre réponse et qui trouve pourtant que celle-ci arrive trop vite.", "— Bien.", "— À trois conditions.", "La plume s'est arrêtée.", "— Vous n'êtes pas en position de poser des conditions.", "— Non. Je suis en position de partir mal ou de partir bien, et vous avez dit vous-même que quelqu'un qui n'a pas envie d'être là ne voit rien. Alors écoutez-les, et refusez-les si vous voulez. Elles ne vous coûtent rien.", "Il a reposé la plume. C'est la première fois de ma vie qu'un Doyen faisait ça pour moi.", "— Parlez.", "— Premièrement. Mon nom sur la carte. Pas à votre place : sur la deuxième ligne, celle qui est prévue pour celui qui a marché et qu'on ne remplit jamais pour les gens comme moi. Si je rapporte trois cents lieues, on saura qui les a faites à pied.", "— C'est de la vanité.", "— C'est de l'exactitude. Vous vendez des cartes en jurant qu'elles sont vraies. Une carte qui ment sur qui l'a faite ment déjà.", "Il m'a regardée un long moment.", "— Accordé. Deuxièmement ?", "— Le carnet de relevé m'appartient. La carte est à vous. Le carnet est à moi. Tout ce que je verrai et que vous ne m'avez pas demandé de voir reste dans mes mains.", "— Pourquoi ?", "— Parce que j'ai copié neuf de vos cartes des Fours à seize ans, ai-je dit.", "Le silence, alors, a changé de nature.", "Vael n'a pas bougé. Il n'a pas nié, il ne s'est pas expliqué, il n'a pas eu ce réflexe des hommes pris en faute qui consiste à parler de l'époque et des ordres. Il est resté parfaitement immobile, et j'ai vu passer dans ses yeux quelque chose de très vieux et de très fatigué.", "— Accordé, a-t-il dit enfin.", "— Troisièmement. Le guide. Vous ne l'avez pas engagé : vous l'avez acheté.", "— Qui vous l'a dit ?", "— Personne. Un contrat comme le sien ne s'éteint pas, il change de main — c'est la loi, elle est dans un livre que cette maison possède, et je l'ai lu cette nuit. Vous lui avez promis sa liberté en échange du voyage. Ce n'est pas sa liberté que vous lui avez donnée. C'est un nouveau maître, et c'est vous.", "Il n'a pas nié cela non plus.", "— Ma condition, ai-je dit, c'est que vous me donniez le papier. Celui de la vente. En main propre, aujourd'hui.", "— Pour quoi faire ?", "— Pour qu'il existe un exemplaire hors de cette tour. Si je meurs là-bas, tant pis. Si je reviens, je veux pouvoir prouver ce qu'il a été promis à cet homme, et je ne veux pas dépendre de votre mémoire.", "Vael a ri. Un rire bref, sans joie, presque admiratif.", "— Vous savez ce que vous êtes en train de faire, Ysée Marrec ? Vous êtes en train de me dire que vous ne me faites pas confiance, dans mon bureau, en me demandant un document.", "— Oui.", "— Et vous croyez que je vais vous le donner.", "— Je crois que vous allez me le donner, ai-je dit, parce que dans dix ans, quand cette carte sera dans toutes les cours du monde avec votre nom dessus, vous préférerez qu'on se souvienne du Doyen qui a envoyé une pupille et un Braise au Nord, plutôt que de celui qui a envoyé deux choses qui lui appartenaient.", "Il est resté silencieux très longtemps.", "Puis il s'est levé, il a ouvert un tiroir, il en a sorti une chemise, et il a fait glisser le papier sur le bureau.", "— Vous partez demain à l'aube, a-t-il dit. La cour des écuries.", "Je l'ai pris. Je ne l'ai pas lu devant lui.", "— Marrec.", "— Oui, Doyen.", "— Ne lui montrez pas.", "Je me suis arrêtée, la main sur la porte.", "— Pourquoi ?", "— Parce que c'est un homme qui a dix-neuf ans de four dans le corps et vingt-deux ans de colère dans la tête, et qu'il vous faut douze jours de route avec lui avant la Ligne. S'il apprend ce qu'il apprendra de toute façon, qu'il l'apprenne tard.", "J'ai refermé la porte derrière moi.", "Dans le couloir, je l'ai déplié.", "Tout y était : le prix, les signatures, et une ligne précisant qu'en cas d'échec de l'expédition, il retournerait aux marchands de sel comme une marchandise qu'on rapporte.", "Et en bas de page, dans la case où l'on note ce qui est vendu, une phrase d'écriture administrative, parfaitement neutre, qui m'a fait m'appuyer au mur :", "Un homme, vingt-sept ans, dix-neuf années de four. Nom : Dorne, Cael. Valeur estimée : quatre cents charges de sel.", "Ils l'avaient chiffré en sel."]}, {"n": 6, "t": "Ce que je signe", "pov": "Cael", "p": ["Le clerc de la Guilde m'a reçu dans une pièce sans fenêtre, avec un encrier et une expression d'ennui.", "— Signez ici. Et ici. Et la marque en bas, si vous ne savez pas écrire.", "— Je sais écrire.", "— Alors signez en bas aussi.", "J'ai lu.", "Ça lui a déplu. Les clercs détestent qu'on lise ; ça rallonge leur journée. Il a soupiré deux fois, il a regardé la porte trois fois, et je n'ai pas accéléré.", "Le document faisait quatre pages. Je les connais par cœur aujourd'hui.", "Vente du contrat de la maison Serrande à la Guilde des Cartographes de Valdren, pour douze cents couronnes.", "Objet : Dorne, Cael. Mission : conduire et protéger au-delà de la Ligne des Cendres.", "Si la mission échoue, le contrat retourne à la maison Serrande dans son état d'avant.", "Si la mission réussit, le contrat s'éteint et l'intéressé devient un homme libre du Sud.", "J'ai relu la dernière phrase trois fois.", "Homme libre du Sud. Quatre mots. Dix-neuf ans.", "— Là, c'est écrit que je deviens libre, ai-je dit.", "Le clerc a haussé les épaules.", "— C'est ce qui est écrit.", "— Ce qui est écrit avant, c'est que le Doyen m'a acheté. Si je ne reviens pas, je retourne aux Serrande. Si je reviens, je suis libre. Entre les deux, j'appartiens à cette Guilde.", "— Vous voulez que je vous félicite ou que je vous plaigne ? Signez ou ne signez pas, ça m'est égal, j'ai quatorze actes après le vôtre.", "J'ai signé.", "Voici ce que le clerc n'a pas compris, ce que Halden Serrande n'a pas compris, et ce que le Doyen Vael croit avoir compris :", "Je n'ai pas signé pour la clause six.", "Un homme qui a dix-neuf ans de four dans le corps sait combien il lui reste. Treize ans. Quinze si je m'arrête aujourd'hui, ce que je ne ferai pas, parce qu'un Braise libre sans métier est un Braise qui mendie. La liberté, à mon âge, c'est douze ans de plus à fondre du sel pour quelqu'un d'autre, avec un papier en poche.", "J'ai signé pour la mission.", "Au-delà de la Ligne des Cendres.", "Depuis vingt-deux ans, je demande à tous ceux qui passent, à tous les marchands, à tous les soldats revenus, à tous les ivrognes des ports : est-ce qu'il y a quelqu'un là-bas. Est-ce qu'il reste quelqu'un.", "On m'a répondu non, huit cents fois.", "Je n'ai jamais cru une seule de ces réponses, parce que aucun de ces hommes n'y était allé.", "Le clerc a tamponné l'acte. Il a rangé sa copie dans une chemise, et j'ai vu, en passant, le nom sur le dossier suivant de sa pile.", "Marrec, Ysée. Pupille de la Guilde.", "Pupille. Recueillie, nourrie, instruite — et qui ne peut rien refuser.", "Je ne savais rien d'elle à ce moment-là. Je savais seulement que la Guilde avait rangé nos deux noms dans la même pile, le même jour, dans la même écriture administrative.", "Et j'ai eu une pensée que j'ai chassée immédiatement, et qui est revenue douze jours plus tard sur la route, et qui n'est plus jamais repartie :", "Lui aussi, ils l'ont chiffrée."]}, {"n": 7, "t": "La cour des écuries", "pov": "Ysée", "p": ["Il attendait près d'un cheval qui n'était pas sellé, les bras croisés, sans manteau.", "C'est la première chose que j'ai vue, et c'est celle que tout le monde voit : un Braise n'a pas froid. En octobre, à l'aube, dans une cour où ma respiration faisait de la buée, la sienne n'en faisait pas.", "J'avais préparé quelque chose. Une phrase courtoise, neutre. Je ne l'ai pas dite, parce qu'en approchant j'ai vu ses mains.", "Elles n'étaient pas brûlées. C'est plus difficile à regarder que des brûlures. La peau était lisse, tendue, trop fine, comme du parchemin qu'on a trop grattée — la peau d'un homme de soixante ans au bout des bras d'un homme jeune.", "Dix-neuf ans de four. Le clerc de la Guilde ne l'écrit pas sur l'acte.", "— Vous êtes la cartographe.", "— Ysée Marrec.", "— Cael.", "Pas de nom de famille. J'en connaissais un — Dorne, Cael, écrit à l'encre administrative dans une case d'objet — et je n'ai rien dit, parce que le Doyen m'avait demandé de ne rien dire et parce que, pour la première fois de ma vie, obéir m'arrangeait.", "— Vous savez monter ?", "— Je sais dessiner.", "— Ce n'est pas ce que j'ai demandé.", "— C'est ce que je sais faire. Le reste, vous me l'apprendrez ou nous mourrons ensemble. Le Doyen n'a pas prévu de troisième option.", "Il m'a regardée longtemps. Je soutenais son regard en pensant à neuf cartes étalées par terre dans une cave d'archives, et je me suis demandé s'il pouvait le voir.", "— Je ne meurs pas facilement, a-t-il dit. Ce sera votre problème.", "Il a sellé le cheval.", "Et pendant qu'il le faisait, dos tourné, il a ajouté d'une voix parfaitement égale :", "— Vous avez copié les cartes de Ghar.", "Le froid m'est entré dans le dos par la nuque.", "— Pardon ?", "— Le quartier bas de Ghar, an 39. Je les ai vues une fois. Il y a une façon de tracer les hachures, dans le coin supérieur, où la main remonte au lieu de descendre. C'est une main gauche qui a appris à droite. Vous tenez votre plume comme ça.", "Il a serré la sangle.", "— Il y a neuf cartes avec cette main-là dans les archives de la couronne. Neuf quartiers. J'ai vécu dans le quatrième.", "Je n'ai pas pu parler.", "Il s'est retourné. Il n'y avait pas de haine sur son visage. Il y avait quelque chose de bien pire : le calme d'un homme qui a rangé cette information depuis longtemps, avec toutes les autres, et qui la sort comme on pose un outil sur une table.", "— Je voulais que ce soit dit avant, a-t-il dit. Pas au sixième jour, pas quand nous serons fatigués. Maintenant, dans une cour, où vous pouvez encore aller dire au Doyen que vous ne voulez pas de moi.", "J'ai attendu que ma voix revienne.", "— J'avais seize ans.", "— Je le sais. J'en avais cinq quand on s'est servi de votre carte. Aucun de nous deux n'a choisi son âge.", "Il m'a tendu la bride.", "— Ce n'est pas un pardon, Marrec. C'est un état de fait. Nous avons douze jours de route et quatre-vingt-deux lieues de feu, et je ne peux pas garder ça dans le ventre pendant tout ce temps sans finir par vous laisser tomber quelque part.", "J'ai pris la bride.", "— Alors je vais vous dire une chose à mon tour, ai-je répondu, et vous en ferez ce que vous voulez.", "— Dites.", "— J'en étais fière. Neuf cartes à seize ans, quand les fils de famille en faisaient trois. J'ai su ce qu'elles étaient il y a deux nuits, dans une cave, toute seule. Et je serais partie même sans l'ordre du Doyen.", "Il a hoché la tête. Une fois. Lentement.", "Puis il a tenu l'étrier pendant que je montais comme quelqu'un qui n'est jamais monté à cheval, et il n'a fait aucun commentaire, ce qui était, je l'ai compris plus tard, sa façon à lui de refermer une conversation qu'il avait décidé de ne pas rouvrir."]}, {"n": 8, "t": "Le poids", "pov": "Cael", "p": ["J'ai vidé ses sacoches sur les pavés de la cour, parce que c'est la première chose qu'on fait et parce que j'avais besoin de faire quelque chose avec mes mains.", "Elle n'a pas protesté. Elle a regardé.", "Trois livres. Une trousse de plumes en cuir, usée aux angles, qui valait plus que tout le reste. Des flacons d'encre bouchés à la cire. Deux chaînes d'arpenteur. Une boussole. Un rouleau de vélin vierge dans un étui de fer-blanc. Des vêtements pour quatre jours, pour un voyage de trente.", "— Ceux-là, non, ai-je dit en écartant deux des livres.", "— C'est la Géographie de Valdren.", "— C'est du poids. Là où on va, vous n'aurez pas le temps de lire ce que d'autres n'ont pas vu.", "Elle a ouvert la bouche. Elle l'a refermée. Elle a repris les deux volumes et les a posés à ses pieds, et j'ai vu à sa mâchoire combien ça lui coûtait, et j'ai trouvé ça — je peux le dire maintenant — remarquable.", "J'ai gardé le troisième sans le regarder. C'était le plus abîmé des trois ; les gens n'abîment que ce qu'ils relisent.", "Puis j'ai pris le dernier objet, tout au fond, roulé dans un morceau de toile.", "Un carnet. Petit. Couverture de cuir noir, coins râpés, une ficelle autour.", "— Ça, ai-je dit, c'est du poids aussi.", "Elle a bougé si vite que j'ai reculé d'un pas.", "— Non.", "Un seul mot. Pas fort. Mais il y avait dedans quelque chose que je n'avais pas entendu chez elle jusque-là, et que j'ai reconnu immédiatement parce que je l'ai dans la voix aussi quand on approche de certaines choses.", "J'ai reposé le carnet dans sa main.", "— C'est quoi ?", "— Le blanc.", "— Ce n'est pas une réponse.", "Elle a serré la ficelle.", "— C'est ce que je vois et que la Guilde ne me demande pas de dessiner. Depuis huit ans. Les digues qui déplacent les passes. Les villages qui n'apparaissent sur aucune carte parce qu'ils ne paient pas d'impôt. Les noms que les gens donnent aux endroits, et qui ne sont jamais les noms officiels.", "— Pourquoi le garder ?", "— Parce qu'une carte, c'est une décision, ai-je dit. On décide de ce qui existe. Tout ce qu'on ne met pas dessus n'existe pas, et au bout de trente ans, plus personne ne se souvient que ça a existé.", "Elle a rangé le carnet dans la doublure de son manteau. Pas dans la sacoche. Dans la doublure.", "— Alors je note. Comme ça, quelque part, ça reste.", "Je n'ai rien répondu.", "J'ai fini de charger les sacoches. J'ai vérifié les sangles deux fois au lieu d'une. Et pendant tout ce temps, j'ai pensé à une chose que je n'ai pas dite, ce jour-là ni les onze suivants.", "Les Fours de Ghar n'existent sur aucune carte d'après-guerre. Le Sud ne les a pas effacés par malveillance. Il les a simplement arrêtés de dessiner, parce qu'après la Ligne il n'y avait plus rien à vendre là-bas, et qu'on ne dessine pas ce qui ne se vend pas.", "Vingt-deux ans que je cherche quelqu'un dans un endroit qui, officiellement, n'existe pas.", "Et la Guilde venait de me donner, pour douze cents couronnes, une femme dont le métier entier consistait à décider de ce qui existe.", "Je ne le lui ai pas dit. Pas au huitième jour, pas au vingtième.", "Mais c'est ce matin-là, dans une cour d'écuries, que j'ai cessé de la considérer comme une passagère."]}, {"n": 9, "t": "L'offre", "pov": "Ysée", "p": ["Il m'attendait dans la rue des Copistes, la veille du départ, adossé à une voiture sans armoiries.", "Un homme d'une trentaine d'années, bien mis, avec des gants.", "— Ysée Marrec. Halden Serrande. Je vous prends dix minutes.", "— Je ne vous connais pas.", "— Vous connaissez ma digue. Le passage de Kern, déplacé de deux cents pas vers l'ouest. C'est nous qui l'avons fait bâtir, il y a dix ans. Vous l'avez compris ; vous ne l'avez pas mis sur la carte.", "J'ai eu très froid.", "— Comment savez-vous ça ?", "— Parce que j'achète du sel, madame, et qu'un homme qui achète du sel achète aussi les jeunes copieurs de cartes qui ont soif. Ne le prenez pas mal : votre Guilde fuit comme un panier. Ce n'est pas vous qui me l'avez dit, et ce n'est pas contre vous que je m'en sers.", "Il a ouvert la portière de la voiture. Je ne suis pas montée. Il ne s'est pas vexé.", "— Trois cents lieues au-delà de la Ligne, a-t-il dit. Vous savez ce que le Doyen espère y trouver ?", "— Il ne me l'a pas dit.", "— Du sel. Les registres d'avant la guerre parlent de trois mines de sel au nord des Fours. Trois. Ma maison tient le monopole du sel du Sud depuis quatre-vingts ans parce que ces trois gisements sont inaccessibles. Si votre carte dit comment y aller, ma maison vaut la moitié de son prix avant un an.", "— Vous voulez que la carte reste blanche.", "— Je veux que la carte soit incomplète. Nuance considérable. Personne ne vous demande de mentir. Il suffit qu'une région soit difficile, que le relief soit ingrat, que l'expédition ait manqué de temps. Vous dessinez tout le reste. Vous serez célèbre. Vous serez la femme qui a rempli le blanc.", "Il a sorti une bourse et l'a posée sur le marchepied. Il ne me l'a pas tendue — il l'a posée, ce qui est plus habile, parce qu'on peut toujours prétendre ne pas l'avoir offerte.", "— Quatre mille couronnes. C'est douze ans de solde de Relevée. Vous êtes pupille, madame Marrec : jamais de rente, jamais de poste à vous, jamais votre nom au bas d'une carte. Quatre mille couronnes, c'est une maison, et une maison, c'est la seule chose qui empêche une femme seule de dépendre d'une Guilde jusqu'à sa mort.", "Je n'ai pas touché la bourse.", "— Non.", "— Réfléchissez une nuit.", "— Non, maître Serrande. Et je vais vous dire pourquoi, parce que vous avez été honnête et que ça mérite une réponse honnête. Il y a deux nuits, j'ai découvert que j'avais dessiné neuf cartes dans ma vie dont je ne connaissais pas l'usage. Neuf. Vous me demandez d'en faire une dixième en connaissant l'usage. Je ne peux pas. Ce n'est pas de la vertu : c'est que je ne pourrais plus jamais regarder une carte de ma main sans me demander ce qu'il y a dessous.", "Halden Serrande m'a écoutée sans m'interrompre. Puis il a repris la bourse, et il a fait une chose qui m'a plus effrayée que tout le reste : il a souri, sincèrement, avec quelque chose comme de la sympathie.", "— C'est dommage, a-t-il dit. Vous m'auriez plu comme employée.", "Il est monté dans la voiture.", "— Maître Serrande.", "Il a baissé la vitre.", "— Vous n'allez pas en rester là.", "— Non.", "— Vous allez faire quoi ?", "— Je vais défendre ma maison, madame. Trois cents personnes y travaillent. Mon père a soixante-douze ans. Vous, vous avez une conscience ; moi, j'ai des salaires à payer le premier du mois. Je ne trouve pas que ma raison soit plus laide que la vôtre.", "La voiture est partie.", "Ce soir-là, j'ai ajouté une ligne dans le blanc :", "Le sel. Trois mines au nord des Fours, dans les registres d'avant la guerre. Le Doyen ne m'a pas parlé de sel. Il ne m'a pas parlé de ce qu'il cherche. Un homme qui vous envoie chercher quelque chose sans vous dire quoi vous a déjà menti une fois."]}, {"n": 10, "t": "La dernière coulée", "pov": "Cael", "p": ["Je suis retourné au four la nuit précédant le départ.", "Torve m'a ouvert sans poser de question. Il avait dû recevoir des ordres contraires ; il les a ignorés, comme il ignore les ordres depuis trente ans, ce qui est sa manière à lui d'être un homme.", "La halle était éteinte. Un four éteint refroidit lentement : à minuit, les briques rendaient encore la chaleur du jour, et l'air sentait ce qu'il sent toujours ici, le sel chaud et le fer.", "Je me suis assis contre la gueule du four deux.", "Dix-neuf ans. Je connais chaque fissure de cette fonte. Je sais laquelle s'ouvre quand on monte trop vite et laquelle ne s'ouvrira jamais. Je sais à quelle heure la lumière entre par la verrière nord, et combien de coups il faut pour casser une cuve refroidie sans la fendre en travers.", "Ce sont des choses inutiles. C'est tout ce que je possède.", "Vaugrin tenait le four un. Il m'a appris en trois mois ce qu'un Braise doit savoir et en dix-neuf ans ce qu'un homme doit savoir, ce qui n'a rien à voir. Il disait : on ne pousse jamais tout. Tu gardes toujours une braise pour toi. Le jour où tu pousses tout, tu ne trouves plus la porte.", "Il est mort à quarante-quatre ans, un dimanche, en s'asseyant sur le banc de la cour. Il avait poussé tout, tous les jours, pendant vingt-six ans, pour une maison qui l'a fait enterrer correctement et qui a embauché un remplaçant le mardi.", "Le remplaçant, c'était moi.", "J'ai posé la main sur la fonte tiède, une dernière fois, et je me suis autorisé une chose que je ne fais jamais : j'ai poussé un peu.", "Pas pour fondre. Juste assez pour que le métal passe du tiède au chaud sous ma paume.", "C'était bête. Ça ne servait à rien. Je crois que je voulais que quelque chose, dans cette halle, garde la trace de ma main pendant quelques heures après mon départ.", "Torve est venu me chercher à la troisième cloche.", "— Ils t'attendent.", "— J'arrive.", "— Dorne.", "Il tenait quelque chose. Un morceau de toile roulé, noué.", "— C'était à Vaugrin. Il m'a dit de le donner au suivant. J'ai jamais su si ça voulait dire le suivant après lui ou le suivant qui part. J'ai attendu dix-neuf ans, alors maintenant je choisis.", "J'ai déroulé la toile dans la cour.", "Un ciseau à froid, et une petite plaque de fer gravée à la main, de trois doigts de large. Dessus, quatre lignes maladroites : un mur, une porte en arche, deux tours inégales.", "— Il disait que c'était chez lui, a dit Torve. Il disait que personne l'avait jamais dessiné.", "J'ai regardé la plaque longtemps.", "C'était la porte nord de Ghar.", "Je l'ai reconnue parce que je suis passé dessous, à cinq ans, dans les bras de quelqu'un dont je ne me rappelle ni le visage ni la voix, mais dont je me rappelle qu'il courait et qu'il m'a dit de ne pas regarder derrière.", "Vaugrin était de Ghar. Dix-neuf ans dans la même halle, à trois pas de moi.", "Il ne me l'a jamais dit. Je ne le lui ai jamais demandé.", "C'est ce qu'on nous a appris à faire, nous autres : ne pas demander, pour ne pas entendre.", "J'ai mis la plaque dans ma poche intérieure. Elle y est restée tout le voyage.", "Et quand Ysée Marrec m'a demandé, bien plus tard, au milieu du feu, pourquoi j'avais accepté de traverser, c'est cette plaque que j'ai sortie, et pas un mot."]}, {"n": 11, "t": "Ce qu'on laisse", "pov": "Ysée", "p": ["Je suis partie de Valdren sans que personne me dise au revoir, et c'est la chose que j'avais le mieux prévue.", "J'ai fait le tour de ma cellule à la deuxième cloche. Quatre pas sur six. Un lit, une planche, une chaise, et sur le mur, punaisée depuis huit ans, une carte de la côte de Kern que j'avais dressée à dix-sept ans et qui était fausse en trois endroits.", "Je l'ai laissée.", "J'ai pris mon manteau, mes deux sacoches allégées, et j'ai descendu l'escalier des pupilles en évitant la troisième marche, qui grince, comme je l'évite depuis dix-sept ans.", "Dans la cour d'honneur, le Doyen n'était pas là.", "Je ne sais pas ce que j'attendais. Un mot. Une consigne. Qu'un homme qui envoie deux personnes dans quatre-vingt-deux lieues de feu descende trois étages pour les regarder partir.", "Il y avait, à la place, un clerc, avec une bourse de route et un registre.", "— Signez la sortie.", "J'ai signé. Il a compté les pièces à voix haute, deux fois, parce que c'est la procédure.", "Puis il a dit, sans lever les yeux :", "— Le Doyen a laissé ceci.", "Un pli scellé. Sur le rabat, quatre mots de sa main :", "À ouvrir à la Ligne.", "Je l'ai glissé dans la doublure, contre le blanc.", "Cael m'attendait sous le porche avec les chevaux. Il avait attaché les sacoches lui-même, réparti autrement que la veille, et je n'ai pas discuté.", "— Vous avez laissé la carte au mur, a-t-il dit.", "— Comment savez-vous ça ?", "— Votre manteau sent la colle de punaise. On ne décroche pas une carte punaisée depuis huit ans sans emporter l'odeur.", "Je l'ai regardé.", "— Vous faites ça tout le temps ?", "— Quoi ?", "— Voir les choses.", "— Non, a-t-il dit. Seulement quand on m'en donne le temps.", "Nous sommes sortis par la porte du levant, au moment où le ciel virait.", "Valdren dort tard. Les rues étaient vides, sauf les porteurs d'eau et les boulangers, et un chien qui a suivi les chevaux jusqu'au troisième carrefour avant de renoncer.", "Au pied des remparts, j'ai levé la tête.", "Il y avait un homme sur le chemin de ronde.", "Trop loin pour le visage. Assez près pour la silhouette, le manteau, les gants clairs sur la pierre sombre. Il ne bougeait pas. Il ne s'est pas caché quand je l'ai vu.", "Il nous a regardés passer sous lui, et quand nous avons été au-delà du fossé, il a fait demi-tour et il est redescendu.", "— Vous le connaissez, a dit Cael. Ce n'était pas une question.", "— Halden Serrande.", "Il n'a pas réagi tout de suite. Puis :", "— Le fils.", "— Vous le connaissez aussi.", "— J'ai fondu du sel pour sa famille pendant dix-neuf ans. Il m'a annoncé lui-même la levée de mon contrat. Qu'est-ce qu'il vous voulait ?", "J'ai hésité une seconde. Une seule.", "Je me suis rappelé une cave d'archives, neuf cartes par terre, et une phrase écrite de ma main : je n'ai rien vu.", "— Il m'a offert quatre mille couronnes pour que la carte du Nord soit incomplète, ai-je dit. Il y a trois gisements de sel gemme au-delà de la Ligne dans les registres d'avant-guerre. Sa maison est ruinée si on les trouve. J'ai refusé hier soir, dans la rue des Copistes, et il l'a très bien pris, ce qui m'inquiète beaucoup plus que s'il avait crié.", "Cael a tiré sur les rênes. Le cheval s'est arrêté.", "Il m'a regardée comme s'il me voyait pour la première fois — pas avec chaleur ; avec attention, ce qui chez lui est la même chose.", "— Pourquoi vous me le dites ?", "— Parce que je n'ai pas envie de faire douze jours de route à côté d'un homme en gardant ça dans le ventre, ai-je dit. Je crois que quelqu'un m'a expliqué hier que c'était la meilleure façon de finir par laisser tomber l'autre quelque part.", "Quelque chose a bougé au coin de sa bouche. Ça n'a pas duré.", "— Marrec.", "— Oui ?", "— Le Doyen ne vous a pas parlé du sel.", "— Non.", "— Alors nous sommes deux à ne pas savoir ce qu'on nous envoie chercher, a-t-il dit. C'est déjà mieux qu'un.", "Il a relancé le cheval.", "Derrière nous, Valdren s'est mise à rapetisser, et je n'ai pas regardé en arrière — pas par bravoure : parce que la route montait, et qu'en haut de la côte, pour la première fois de ma vie, il y avait un pays que je n'avais jamais dessiné."]}, {"n": 12, "t": "Le premier feu", "pov": "Cael", "p": ["Le premier soir, nous avons campé à la sortie des terres cultivées, dans un repli de colline avec un muret de pierres sèches pour couper le vent.", "Elle a dessellé son cheval toute seule. Mal. Elle a mis un temps considérable et elle a refusé l'aide que je n'ai pas proposée, ce qui est une négociation entière conduite sans un mot.", "J'ai ramassé du bois mort. Pas parce que j'en ai besoin : parce qu'un feu qui brûle sans bois attire l'œil, et qu'à trois lieues d'une route, on ne sait jamais qui regarde.", "Puis je me suis accroupi, et j'ai posé les mains dessus.", "C'est le moment que je déteste.", "Ce n'est pas la douleur — il n'y en a pas, à cette intensité. C'est le moment où les gens regardent. J'ai vu des enfants applaudir. J'ai vu des femmes se signer. J'ai vu un marchand de Valdren approcher sa main du bois pour vérifier que ce n'était pas un truc de foire, et se brûler jusqu'à l'os en hurlant que je l'avais piégé.", "Les gens ne peuvent pas s'en empêcher. Ils regardent. Et pendant qu'ils regardent, je cesse d'être Cael pour devenir la chose.", "J'ai poussé. Le bois a pris.", "Et quand j'ai relevé la tête, elle était de l'autre côté du feu, assise, son carnet ouvert sur les genoux, en train de tailler une plume.", "Elle n'avait pas regardé.", "J'ai d'abord cru qu'elle n'avait pas fait attention. Ça arrive ; les gens sont distraits.", "Le deuxième soir, elle a tourné la tête vers les chevaux au moment exact où je me suis accroupi.", "Le troisième soir, elle s'est levée pour aller chercher de l'eau qu'elle avait déjà.", "Le quatrième soir, elle n'a même plus fait semblant : elle a simplement baissé les yeux sur ses genoux, trois secondes avant que je pose les mains, et les a relevés quand le bois a pris.", "Trois secondes avant. Chaque fois.", "Elle comptait.", "Je suis resté accroupi devant le feu plus longtemps que nécessaire, ce soir-là, en faisant mine d'arranger les bûches, parce que je ne savais pas quoi faire de ce que je venais de comprendre.", "Personne n'avait jamais détourné les yeux.", "Ce n'est pas de la pudeur. On ne peut pas détourner le regard par pudeur devant une chose qu'on n'a jamais vue ; la curiosité gagne toujours. Pour faire ça quatre soirs de suite, il faut avoir décidé.", "Il faut avoir pensé, seule, la veille du départ, à ce que ça fait d'être regardé.", "Je me suis assis à ma place, à trois pas, du côté d'où venait le vent.", "— Marrec.", "— Oui ?", "— Vous pouvez regarder, ai-je dit.", "Elle a levé les yeux de son carnet. Elle a mis un moment à comprendre de quoi je parlais. Puis elle a compris, et elle n'a pas fait semblant de ne pas comprendre, ce dont je lui ai été reconnaissant.", "— Je ne voulais pas vous transformer en spectacle.", "— Je sais. C'est pour ça que vous pouvez.", "Elle a fermé le carnet. Elle a posé la plume dessus.", "Et le lendemain soir, quand je me suis accroupi, elle a regardé.", "Elle n'a rien dit. Elle n'a pas eu ce petit bruit dans la gorge que les gens font. Elle a regardé mes mains, puis le bois, puis mes mains, avec cette attention plate et sérieuse qu'elle met à relever une côte.", "Quand le feu a pris, elle a hoché la tête une fois, comme on referme un relevé.", "— Merci, a-t-elle dit.", "Vingt-deux ans que je fais ce geste devant des gens.", "C'est la première fois que quelqu'un m'a remercié de l'avoir laissé voir."]}], "couv": true}, {"id": "verre", "titre": "La Dette de Verre", "auteur": "Écrit avec Claude", "genres": ["Romance", "Héritage", "Secret de famille", "Drame"], "annee": "2026", "couleur": "#1f4a52", "statut": "En cours", "resume": "Directrice générale du groupe hôtelier Valadares, Nour Belkacem hérite de trente-quatre pour cent des parts — à condition d'être encore en poste le jour de la mort du patriarche. Le fils revenu d'exil veut sa révocation. Une lettre laissée sous scellés lui apprend pourquoi ce legs n'était pas un cadeau, mais une dette : en 1997, Henrique Valadares a ruiné son père. À Lisbonne, tout le monde a de bonnes raisons.", "chapitres": [{"n": 1, "t": "La clause de la femme", "pov": "Nour", "p": ["Le testament de Henrique Valadares faisait quarante et une pages, et mon nom apparaissait à la page trente-sept.", "Je l'appris dans une salle de réunion du sixième étage de l'hôtel Miramar, à Lisbonne, un mardi de février, entourée de quatorze personnes qui me détestaient toutes pour des raisons différentes.", "Le notaire lut la clause à voix haute.", "— « À Nour Belkacem, directrice générale du groupe Valadares, je lègue trente-quatre pour cent des parts de la société, à la condition expresse qu'elle occupe cette fonction au jour de mon décès. »", "Quelqu'un, au fond, laissa tomber un stylo.", "— « Dans le cas contraire, poursuivit le notaire, ces parts reviennent à mon fils, Rafael Valadares. »", "Je ne bougeai pas.", "J'avais construit ce groupe pendant onze ans. J'étais entrée comme assistante de direction à vingt-trois ans, avec un diplôme portugais que personne ne reconnaissait et un nom que les clients écorchaient. J'avais racheté le Miramar en 2019 dans un état de ruine, rouvert quatre établissements, redressé une marge de dix-huit points. Tout le monde dans cette salle le savait.", "Et tout le monde dans cette salle savait aussi que Henrique était mort dans mon appartement, un jeudi soir, d'un arrêt cardiaque, à soixante-neuf ans.", "C'était la deuxième chose qu'on me reprochait.", "La première, c'était d'être la seule personne à qui il faisait confiance.", "Rafael Valadares était assis en face de moi, au bout de la table. Il avait quarante ans, un costume qui valait mon premier salaire annuel, et il n'avait pas remis les pieds dans cette entreprise depuis douze ans.", "Il parla enfin.", "— Madame Belkacem. Une question.", "— Je vous écoute.", "— Depuis combien de temps couchiez-vous avec mon père ?", "Le silence qui suivit ne fut pas de la gêne. Ce fut une salle entière qui attendait la réponse avec appétit.", "Je posai mon stylo sur mon bloc, bien parallèle au bord.", "— Jamais, dis-je.", "— Il est mort chez vous.", "— Il est mort chez moi parce qu'il y venait chaque jeudi depuis six ans pour relire les comptes avec moi avant les conseils du vendredi. Il détestait le faire au bureau. Il disait que dans son bureau, il redevenait un Valadares, et qu'un Valadares ne demande jamais à personne de lui réexpliquer une ligne qu'il n'a pas comprise.", "Je le regardai.", "— Vous devriez le savoir. C'est exactement pour cette raison que vous êtes parti en 2014.", "Quelque chose bougea dans son visage. Rien de spectaculaire, mais je l'avais vu.", "— Le conseil se réunit vendredi, dit-il en se levant. Je demanderai votre révocation.", "— Vous n'avez pas les voix.", "— Je les aurai jeudi soir.", "Il sortit. Les autres suivirent, un par un, selon un ordre de préséance qui m'apprit en trente secondes exactement qui, dans cette salle, avait déjà changé de camp.", "Le notaire resta.", "— Madame Belkacem, dit-il doucement. Il y a une deuxième enveloppe. Elle vous est adressée personnellement et je n'ai pas le droit de l'ouvrir.", "Il la posa devant moi.", "Je reconnus l'écriture de Henrique, tremblée sur la fin comme elle l'était devenue cette dernière année.", "Trois mots sur le rabat :", "« Pardonne-moi. H. »"]}, {"n": 2, "t": "Douze ans", "pov": "Rafael", "p": ["Je n'étais pas revenu à Lisbonne pour l'argent. C'est ce que je me répétais dans le taxi, et j'y croyais encore à peu près jusqu'au sixième étage du Miramar.", "Puis j'ai vu le hall.", "Mon père avait acheté cet hôtel en 1998, quand c'était une ruine avec des pigeons dans l'escalier d'honneur. Il m'y emmenait le dimanche. Il me faisait compter les marches. À neuf ans, je connaissais le nombre exact de fenêtres de la façade sud — quarante-sept — et je croyais que c'était un savoir précieux.", "En 2014, j'ai claqué la porte de son bureau en lui disant qu'il ne m'avait jamais écouté une seule fois de sa vie.", "Il ne m'a pas rappelé. Moi non plus.", "Douze ans. J'ai monté une société de conseil à Madrid, j'ai gagné correctement ma vie, je me suis marié, j'ai divorcé, et un mardi de février on m'a appelé pour me dire qu'il était mort chez sa directrice générale.", "Trente-quatre pour cent.", "Ce n'est pas le montant qui m'a fait mal. C'est la clause : à la condition expresse qu'elle occupe cette fonction au jour de mon décès.", "Mon père avait pris la peine d'écrire une phrase dont le seul objet était de m'empêcher d'hériter tant qu'elle était là.", "Alors j'ai dit ce que j'ai dit dans cette salle de réunion. Je savais que c'était ignoble en le disant. Je l'ai dit quand même, parce qu'il fallait que quelqu'un dans cette pièce souffre autant que moi et qu'elle était la seule personne à portée.", "Elle n'a pas cillé.", "C'est ça, le détail que je n'ai pas réussi à évacuer du reste de la journée. Quatorze personnes attendaient qu'elle s'effondre ou qu'elle se défende, et elle a aligné son stylo sur le bord de son bloc avant de répondre.", "Le soir, j'ai dîné avec Teresa Moura, la directrice financière, dans un restaurant du Chiado qu'elle avait choisi.", "— Vous avez huit voix sur quinze, dit-elle après l'entrée. Si vous poussez vendredi, elle saute.", "— Et vous en faites partie.", "— J'en fais partie.", "— Pourquoi ?", "Teresa but une gorgée de vin blanc.", "— Parce que Nour Belkacem a refusé mon plan de cession des trois hôtels de l'Algarve en novembre. Trente-deux millions. Elle a dit non en quarante minutes devant tout le conseil, avec des chiffres, et j'ai eu l'air d'une imbécile.", "— C'était un mauvais plan ?", "— C'était un excellent plan pour les actionnaires à court terme.", "— Ce n'est pas ma question.", "Teresa reposa son verre et me regarda pour la première fois de la soirée avec autre chose que de la politesse professionnelle.", "— Vous ressemblez à votre père quand vous posez les questions dans cet ordre.", "— Répondez.", "— Non, dit-elle. Ce n'était pas un bon plan. Mais c'était le mien.", "J'ai payé l'addition et je suis rentré à pied jusqu'au fleuve.", "Quarante-sept fenêtres sur la façade sud.", "J'ai compté, en passant. Il y en avait toujours quarante-sept, et quelqu'un avait restauré les encadrements en azulejos du deuxième étage, ceux que mon père disait irrécupérables.", "Ce n'est pas mon père qui les avait fait restaurer. Il était trop malade en 2022.", "C'était elle."]}, {"n": 3, "t": "L'enveloppe", "pov": "Nour", "p": ["Je n'ai ouvert l'enveloppe que le mercredi soir, après minuit, quand j'ai eu fini de compter mes voix.", "Sept sur quinze. Il m'en manquait une.", "Dedans, il y avait une lettre de deux pages et une photocopie d'acte notarié datée de 1997.", "La lettre disait :", "« Nour,", "Si tu lis ceci, je suis mort avant d'avoir eu le courage de te dire ce qui suit, ce qui ne me surprend pas.", "En 1997, j'ai racheté un immeuble rue da Boavista à une famille qui ne pouvait pas payer ses dettes. Le rachat était légal. Le prix ne l'était pas : j'ai payé le quart de la valeur en profitant d'une procédure que j'avais moi-même déclenchée par un intermédiaire.", "La famille s'appelait Belkacem.", "Ton père est mort trois ans plus tard, à Setúbal, dans un appartement de deux pièces.", "Je l'ai su en 2016, quand tu as rempli un formulaire d'assurance avec ton nom de naissance et l'adresse de tes parents.", "J'ai eu deux ans pour te le dire. J'ai préféré te promouvoir.", "Les trente-quatre pour cent ne sont pas un cadeau, Nour. C'est une restitution, calculée par mes soins, et elle est en dessous de ce que je te dois.", "Fais ce que tu veux de cette lettre. Y compris la détruire. H. »", "J'ai relu la première page quatre fois.", "Puis je suis allée à la fenêtre et j'ai regardé le Tage, en bas, noir et plat, et j'ai pensé à une chose idiote : à ma mère qui, chaque fois que je l'appelais pour lui annoncer une promotion, disait « c'est bien, ma fille » d'une voix qui ne montait jamais.", "Elle savait. Bien sûr qu'elle savait. Elle avait dû reconnaître le nom dès le premier jour, en 2015, et elle n'avait rien dit pendant onze ans parce que j'étais heureuse et que ce bonheur-là payait son loyer.", "J'ai appelé Marta, mon avocate, à une heure du matin.", "— Si je produis cette lettre, qu'est-ce qui se passe ?", "— Juridiquement ? Rien de bon pour toi. Elle établit que Valadares te devait quelque chose, ce qui transforme un legs en réparation, ce qui ouvre la porte à une contestation par les héritiers pour vice du consentement. Tu perdrais probablement les parts.", "— Et moralement ?", "Marta soupira.", "— Nour, il est deux heures du matin.", "— Réponds.", "— Moralement, tu tiens la preuve que l'homme qui t'a formée a ruiné ton père. Tu peux la sortir vendredi devant le conseil. Rafael Valadares sera détruit publiquement, la réputation du groupe avec lui, et tu garderas ton poste parce que personne n'osera voter contre toi dans cette configuration.", "— Donc je gagne.", "— Tu gagnes une entreprise dont la valeur aura chuté de trente pour cent le lundi matin, dit Marta. Et tu auras appris à toute la ville que tu diriges par la honte des autres. Tu tiendras dix-huit mois.", "J'ai remercié. J'ai raccroché.", "À quatre heures du matin, j'ai fait une chose que je n'avais jamais faite en onze ans : j'ai ouvert le dossier des hôtels de l'Algarve, celui du plan de cession de Teresa Moura, et je l'ai lu ligne à ligne en cherchant non pas ce qui était faux, mais qui, exactement, gagnerait de l'argent si ce plan passait.", "J'ai trouvé à six heures vingt.", "Une société d'acquisition immatriculée à Madrid, créée en septembre, dont le bénéficiaire effectif était un cabinet de conseil dirigé par un certain R. Valadares."]}, {"n": 4, "t": "Ce que je ne savais pas signer", "pov": "Rafael", "p": ["Elle est arrivée à mon hôtel le jeudi matin à sept heures, sans rendez-vous, avec un dossier sous le bras.", "Je prenais mon café dans le patio. Elle a tiré une chaise et s'est assise en face de moi sans demander.", "— Vous rachetez l'Algarve, dit-elle.", "Je n'ai pas compris tout de suite.", "— Pardon ?", "Elle a posé le dossier. Une chaîne de détention, trois pages, surlignée en jaune. Sociedade Aurora, Madrid, septembre. Bénéficiaire effectif : Valadares Consulting.", "J'ai regardé ces pages pendant peut-être vingt secondes.", "Puis j'ai dit, et c'est la vérité la plus embarrassante de ma vie :", "— Je ne savais pas.", "Elle a eu un rire bref, sans joie.", "— Bien sûr.", "— Non, écoutez-moi. Valadares Consulting a onze associés. Je détiens trente et un pour cent et je préside. En septembre, j'étais à Mexico sur un dossier hôtelier pendant six semaines. Les créations de véhicules d'acquisition sous quinze millions ne remontent pas au président, elles remontent au comité d'investissement.", "— C'est votre nom sur le registre.", "— Oui. C'est exactement ça, le problème.", "Je me suis levé. Je suis allé jusqu'à la fontaine du patio et je suis revenu, parce que je ne pouvais pas dire ce que j'allais dire assis.", "— Mon associé principal s'appelle Duarte Pinheiro. Il dîne avec Teresa Moura depuis un an et demi. Je l'ai su hier soir, par hasard, en voyant leurs deux réservations au même restaurant sur le même compte.", "Nour n'a pas bougé.", "— Vous êtes en train de me dire que vous avez été instrumentalisé.", "— Je suis en train de vous dire quelque chose de bien pire, madame Belkacem. Je suis en train de vous dire que pendant douze ans j'ai monté une société en refusant d'apprendre à lire les registres de mes propres véhicules, parce que je trouvais ça mesquin, parce que c'était bon pour les comptables, parce que je voulais être un homme d'idées et pas un homme de tableaux.", "Je me suis rassis.", "— Et ça, c'est exactement le reproche que mon père m'a fait en 2014, mot pour mot, dans son bureau. J'ai claqué la porte pour ne pas l'entendre. Il m'a fallu douze ans et une femme assise en face de moi à sept heures du matin pour comprendre qu'il avait raison.", "Le patio était silencieux. Un employé passait avec un chariot, loin.", "— Pourquoi me dire ça ? demanda-t-elle enfin.", "— Parce que vous alliez le découvrir de toute façon, et parce que si je mens maintenant, je passe le reste de ma vie à être le fils qui a récupéré l'entreprise de son père par une combine qu'il n'avait même pas eu l'intelligence de monter lui-même.", "Elle m'a regardé longtemps.", "Puis elle a sorti de sa poche une enveloppe fermée, écornée, et l'a posée sur la table entre nous.", "— Il y a autre chose que vous ne savez pas, dit-elle. Et après ça, vous aurez le droit de me haïr pour de bonnes raisons."]}, {"n": 5, "t": "Rue da Boavista", "pov": "Nour", "p": ["Il a lu la lettre de son père deux fois.", "À la deuxième lecture, il s'est arrêté au milieu, il a posé les feuilles sur la table, il a mis ses deux mains à plat dessus et il est resté comme ça.", "— Rue da Boavista, dit-il enfin. Le numéro 44.", "— Vous connaissez ?", "— C'est le premier immeuble que mon père m'a montré. J'avais onze ans. Il m'a dit : « Celui-là, je l'ai eu au bon moment. » Je me souviens d'avoir été fier de lui.", "Il a levé les yeux.", "— Votre père.", "— Karim Belkacem. Il avait une entreprise de menuiserie. Il tenait l'immeuble de son propre père. Il a fait un emprunt en 1995 pour racheter une scierie, la banque a rappelé la créance en 1996, et en 1997 il a vendu à un homme qui lui a proposé le quart de la valeur en lui expliquant qu'il n'aurait pas d'autre offre.", "— Et il n'en a pas eu d'autre.", "— Non. Parce que c'est ce même homme qui avait déclenché la procédure.", "Rafael s'est passé la main sur le visage.", "— Qu'est-ce qui lui est arrivé ?", "— Il est mort en 2000. Il avait cinquante-trois ans. Ma mère nous a élevées, ma sœur et moi, dans deux pièces à Setúbal, en faisant des ménages dans des hôtels. Parfois dans les vôtres.", "Le silence a duré.", "— Vous saviez, quand vous êtes entrée dans le groupe ? demanda-t-il.", "— Non. Je l'ai appris avant-hier soir, à minuit, dans cette enveloppe.", "— Et vous me l'apportez ce matin.", "— Oui.", "— Pourquoi ? Vous auriez pu la sortir demain devant le conseil. Vous gagniez.", "Je me suis entendue répondre, et je crois que c'est en le disant que je l'ai décidé :", "— Parce que si je gagne comme ça, je deviens exactement l'homme qui a acheté la maison de mon père au quart de sa valeur en profitant d'un moment de faiblesse. Il avait probablement de bonnes raisons lui aussi. On en a toujours.", "Rafael a hoché la tête, très lentement.", "Puis il a fait quelque chose que je n'attendais pas. Il a repris les deux pages, les a pliées, et me les a tendues.", "— Gardez-la. Elle est à vous, pas à moi.", "— Vous ne voulez pas la détruire ?", "— Je veux surtout que vous soyez la seule personne au monde à décider ce qui en sera fait. C'est le minimum, et c'est à peu près tout ce que je peux offrir aujourd'hui.", "Il s'est levé.", "— Le conseil est demain à dix heures. Je retire ma demande de révocation.", "— Vous avez huit voix.", "— J'ai huit voix que Duarte Pinheiro a achetées avec un plan de cession dont il touchera la commission. Ce ne sont pas mes voix. Et je ne prendrai pas cette entreprise avec.", "Il a marqué un temps.", "— Mais je ne pars pas non plus, madame Belkacem. Je détiens quarante et un pour cent de cette société et je viens de comprendre que je ne sais pas les lire. Alors je vais rester, je vais siéger, et je vais poser des questions idiotes pendant six mois.", "— Vous allez me gêner considérablement.", "— Oui, dit-il. C'est l'idée.", "Et il est parti régler son café, ce qui, dans son propre hôtel, était parfaitement absurde."]}], "couv": true}];

const app = document.getElementById('app'), $ = id => document.getElementById(id);
const KEY = 'liseuse:v2';
let S = { night:false, livres:{} };   // livres[id] = {chap, scroll, bookmarks[], vus[]}
let vue = 'lib', livre = null, ready = false, filtre = null;

function etat(id){
  if (!S.livres[id]) S.livres[id] = { chap:0, scroll:0, bookmarks:[], vus:[] };
  return S.livres[id];
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }

async function load(){
  try {
    const r = await window.storage.get(KEY);
    if (r && r.value) Object.assign(S, JSON.parse(r.value));
    else {
      try { const old = await window.storage.get('castellano:etat');
        if (old && old.value){ const o = JSON.parse(old.value);
          S.night = !!o.night;
          S.livres.castellano = { chap:o.chap||0, scroll:o.scroll||0, bookmarks:o.bookmarks||[], vus:[] };
          for (let i=0;i<=(o.chap||0);i++) S.livres.castellano.vus.push(i);
        }
      } catch(e){}
    }
    $('statusNote').textContent = 'Progression et marque-pages enregistrés automatiquement.';
  } catch(e){ $('statusNote').textContent = 'Sauvegarde indisponible : la progression ne sera pas conservée.'; }
  ready = true;
}
async function save(){ if(!ready) return; try{ await window.storage.set(KEY, JSON.stringify(S)); }catch(e){} }

  const e = S.livres[b.id]; if (!e || !e.vus) return 0;
  if (!b.chapitres.length) return 0;

}
