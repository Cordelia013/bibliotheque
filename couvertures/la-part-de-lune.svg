<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Couverture : La Part de Lune">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset=".55" stop-color="#1c2445"/>
      <stop offset="1" stop-color="#2d2a4a"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4e9c8" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#f4e9c8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f4e9c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lune" cx=".38" cy=".35" r=".75">
      <stop offset="0" stop-color="#fff8e3"/>
      <stop offset=".6" stop-color="#eadfbe"/>
      <stop offset="1" stop-color="#c9bc95"/>
    </radialGradient>
    <linearGradient id="colline1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a30"/>
      <stop offset="1" stop-color="#0a0d1a"/>
    </linearGradient>
    <linearGradient id="colline2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1326"/>
      <stop offset="1" stop-color="#070911"/>
    </linearGradient>
    <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f3a"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <clipPath id="cadre"><rect width="600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#cadre)">
    <!-- ciel -->
    <rect width="600" height="900" fill="url(#ciel)"/>

    <!-- étoiles -->
    <g fill="#f4e9c8">
      <circle cx="62" cy="88" r="1.2" opacity=".7"/><circle cx="141" cy="52" r=".9" opacity=".5"/>
      <circle cx="503" cy="70" r="1.4" opacity=".8"/><circle cx="548" cy="132" r=".8" opacity=".5"/>
      <circle cx="90" cy="210" r=".9" opacity=".45"/><circle cx="470" cy="190" r="1" opacity=".55"/>
      <circle cx="30" cy="330" r="1.1" opacity=".5"/><circle cx="571" cy="288" r="1.2" opacity=".6"/>
      <circle cx="215" cy="140" r=".7" opacity=".4"/><circle cx="392" cy="98" r=".8" opacity=".5"/>
    </g>

    <!-- halo -->
    <circle cx="300" cy="300" r="240" fill="url(#halo)"/>

    <!-- lune : entière, avec sa "part" manquante (éclipse en croissant fin) -->
    <circle cx="300" cy="300" r="128" fill="url(#lune)"/>
    <circle cx="378" cy="262" r="124" fill="#1c2445" opacity=".97"/>
    <!-- fine ligne de lumière sur le bord de l'ombre -->
    <path d="M 300 172 A 128 128 0 0 0 300 428" fill="none" stroke="#fff8e3" stroke-opacity="0"/>
    <!-- reliefs discrets sur la partie éclairée -->
    <g fill="#c9bc95" opacity=".35">
      <circle cx="238" cy="290" r="9"/><circle cx="222" cy="345" r="5"/><circle cx="262" cy="380" r="6"/>
      <circle cx="205" cy="255" r="4"/>
    </g>

    <!-- colline arrière : Croix-Rousse -->
    <path d="M -20 560 C 90 520, 180 545, 250 505 C 330 460, 420 480, 520 470 C 570 465, 600 480, 620 470 L 620 700 L -20 700 Z" fill="url(#colline2)"/>

    <!-- colline avant : Fourvière, silhouette avec une tour élancée stylisée -->
    <path d="M -20 620 C 60 590, 130 600, 190 580 C 240 563, 262 552, 300 548 L 300 548 C 340 552, 380 560, 440 570 C 500 580, 560 610, 620 600 L 620 720 L -20 720 Z" fill="url(#colline1)"/>
    <!-- tour -->
    <path d="M 292 548 L 292 486 L 296 486 L 296 472 L 300 462 L 304 472 L 304 486 L 308 486 L 308 548 Z" fill="#0f1326"/>
    <!-- fenêtres allumées dans la pente -->
    <g fill="#f4e9c8">
      <rect x="120" y="612" width="3" height="4" opacity=".55"/><rect x="164" y="598" width="3" height="4" opacity=".4"/>
      <rect x="400" y="590" width="3" height="4" opacity=".5"/><rect x="452" y="602" width="3" height="4" opacity=".45"/>
      <rect x="512" y="622" width="3" height="4" opacity=".4"/><rect x="88" y="628" width="3" height="4" opacity=".35"/>
    </g>

    <!-- loup sur la crête de Fourvière, silhouette originale, assis, tête levée vers la lune -->
    <g transform="translate(350 548) scale(1.05)">
      <path d="M 0 0 C -6 -8, -10 -18, -8 -30 C -7 -38, -3 -44, 2 -48 C 5 -50, 9 -50, 11 -53 L 13 -60 L 17 -55 L 22 -57 L 20 -50 C 22 -46, 21 -40, 17 -37 C 14 -33, 10 -30, 8 -24 C 6 -16, 8 -8, 6 0 Z" fill="#05070f"/>
      <path d="M -8 -30 C -14 -22, -22 -16, -30 -14 C -34 -13, -37 -10, -36 -4 L -34 0 L 0 0" fill="#05070f"/>
    </g>

    <!-- fleuve -->
    <rect x="-20" y="700" width="640" height="200" fill="url(#eau)"/>
    <!-- reflet de lune brisé -->
    <g fill="#f4e9c8">
      <rect x="284" y="712" width="32" height="2" opacity=".35"/>
      <rect x="290" y="722" width="22" height="2" opacity=".28"/>
      <rect x="280" y="734" width="40" height="2" opacity=".22"/>
      <rect x="292" y="748" width="18" height="2" opacity=".18"/>
      <rect x="276" y="764" width="48" height="2" opacity=".14"/>
      <rect x="288" y="784" width="26" height="2" opacity=".1"/>
    </g>

    <!-- filet doré -->
    <rect x="28" y="28" width="544" height="844" fill="none" stroke="#c9a35c" stroke-opacity=".55" stroke-width="1"/>
    <rect x="34" y="34" width="532" height="832" fill="none" stroke="#c9a35c" stroke-opacity=".25" stroke-width=".6"/>

    <!-- surtitre -->
    <text x="300" y="86" text-anchor="middle" fill="#c9a35c" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="5">UN ROMAN DES DEUX COLLINES</text>

    <!-- titre -->
    <text x="300" y="690" text-anchor="middle" fill="#f4e9c8" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" letter-spacing="1">La Part</text>
    <text x="300" y="768" text-anchor="middle" fill="#f4e9c8" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" letter-spacing="1">de Lune</text>

    <!-- trait -->
    <line x1="250" y1="796" x2="350" y2="796" stroke="#c9a35c" stroke-width="1" stroke-opacity=".8"/>

    <!-- auteur -->
    <text x="300" y="830" text-anchor="middle" fill="#c9bc95" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="4">ÉCRIT AVEC CLAUDE</text>
  </g>
</svg>
