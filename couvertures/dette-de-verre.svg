<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Couverture : La Dette de Verre">
  <defs>
    <linearGradient id="cielV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2229"/>
      <stop offset=".55" stop-color="#123641"/>
      <stop offset="1" stop-color="#0a1a20"/>
    </linearGradient>
    <linearGradient id="verreV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe3e3" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#6fa9ac" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1f4a52" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173842"/>
      <stop offset="1" stop-color="#081217"/>
    </linearGradient>
    <radialGradient id="soleilV" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4e3b0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f4e3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laiton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d3a0"/>
      <stop offset=".5" stop-color="#b08a4a"/>
      <stop offset="1" stop-color="#e9d3a0"/>
    </linearGradient>
    <clipPath id="cadreV"><rect width="600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#cadreV)">
    <rect width="600" height="900" fill="url(#cielV)"/>
    <circle cx="440" cy="150" r="220" fill="url(#soleilV)"/>

    <!-- silhouette de façade d'hôtel, style Belle Époque, colonnades -->
    <g fill="url(#facade)">
      <rect x="60" y="230" width="480" height="560"/>
    </g>
    <g fill="#081217" opacity=".85">
      <rect x="60" y="230" width="480" height="18"/>
      <rect x="60" y="770" width="480" height="20"/>
    </g>
    <!-- colonnes -->
    <g fill="#0d262d">
      <rect x="88" y="248" width="16" height="522"/>
      <rect x="168" y="248" width="16" height="522"/>
      <rect x="248" y="248" width="16" height="522"/>
      <rect x="336" y="248" width="16" height="522"/>
      <rect x="416" y="248" width="16" height="522"/>
      <rect x="496" y="248" width="16" height="522"/>
    </g>
    <!-- fenêtres arquées, certaines éclairées -->
    <g>
      <g id="rangF" fill="#0a2026">
        <path d="M 116 300 h34 v60 a17 17 0 0 1 -34 0 z"/>
        <path d="M 196 300 h34 v60 a17 17 0 0 1 -34 0 z"/>
        <path d="M 276 300 h34 v60 a17 17 0 0 1 -34 0 z"/>
        <path d="M 356 300 h34 v60 a17 17 0 0 1 -34 0 z"/>
        <path d="M 436 300 h34 v60 a17 17 0 0 1 -34 0 z"/>
      </g>
      <use href="#rangF" y="140"/>
      <use href="#rangF" y="280"/>
      <!-- fenêtres allumées -->
      <path d="M 196 300 h34 v60 a17 17 0 0 1 -34 0 z" fill="#e9d3a0" opacity=".55"/>
      <path d="M 356 440 h34 v60 a17 17 0 0 1 -34 0 z" fill="#e9d3a0" opacity=".4"/>
      <path d="M 436 580 h34 v60 a17 17 0 0 1 -34 0 z" fill="#e9d3a0" opacity=".5"/>
      <path d="M 116 580 h34 v60 a17 17 0 0 1 -34 0 z" fill="#e9d3a0" opacity=".3"/>
    </g>

    <!-- panneau de verre brisé qui recouvre le bas de la façade -->
    <path d="M -20 560 L 220 520 L 340 610 L 470 540 L 640 600 L 640 900 L -20 900 Z" fill="url(#verreV)"/>
    <!-- lignes de fracture -->
    <g stroke="#eaf6f6" stroke-width="1.4" fill="none" opacity=".55">
      <path d="M 300 900 L 280 700 L 340 560 L 300 480"/>
      <path d="M 280 700 L 180 660 L 100 900"/>
      <path d="M 280 700 L 380 730 L 480 900"/>
      <path d="M 340 560 L 420 600 L 520 540"/>
      <path d="M 340 560 L 250 540 L 160 590"/>
      <path d="M 300 480 L 340 400 L 300 300"/>
    </g>
    <g stroke="#0a1a20" stroke-width=".6" fill="none" opacity=".5">
      <path d="M 300 900 L 280 700 L 340 560 L 300 480"/>
      <path d="M 280 700 L 180 660 L 100 900"/>
      <path d="M 280 700 L 380 730 L 480 900"/>
    </g>

    <!-- clé d'hôtel suspendue au centre, laiton -->
    <g transform="translate(300 400)">
      <circle r="34" fill="none" stroke="url(#laiton)" stroke-width="6"/>
      <circle r="34" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.2"/>
      <rect x="-4" y="30" width="8" height="70" fill="url(#laiton)"/>
      <rect x="-4" y="94" width="24" height="10" fill="url(#laiton)"/>
      <rect x="-4" y="108" width="16" height="8" fill="url(#laiton)"/>
      <text x="0" y="6" text-anchor="middle" fill="#0a1a20" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700">44</text>
    </g>

    <!-- filet doré -->
    <rect x="28" y="28" width="544" height="844" fill="none" stroke="url(#laiton)" stroke-opacity=".55" stroke-width="1"/>
    <rect x="34" y="34" width="532" height="832" fill="none" stroke="url(#laiton)" stroke-opacity=".25" stroke-width=".6"/>

    <!-- surtitre -->
    <text x="300" y="86" text-anchor="middle" fill="#cfead0" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="5">UN ROMAN DU GROUPE VALADARES</text>

    <!-- bandeau translucide pour lisibilité du titre -->
    <rect x="0" y="780" width="600" height="120" fill="#081217" opacity=".55"/>

    <!-- titre -->
    <text x="300" y="822" text-anchor="middle" fill="#f2f8f6" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="1">La Dette</text>
    <text x="300" y="866" text-anchor="middle" fill="#f2f8f6" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" letter-spacing="1">de Verre</text>
    <line x1="260" y1="882" x2="340" y2="882" stroke="url(#laiton)" stroke-width="1"/>
  </g>
</svg>
