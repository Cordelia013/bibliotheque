<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Couverture : Le Contrat de Vesper">
  <defs>
    <linearGradient id="fondVe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset=".6" stop-color="#15161e"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="vitre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f55" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a1c28" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2340"/>
      <stop offset="1" stop-color="#070810"/>
    </linearGradient>
    <linearGradient id="fil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8dce6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d8dce6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#d8dce6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cadreVe"><rect width="600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#cadreVe)">
    <rect width="600" height="900" fill="url(#fondVe)"/>

    <!-- grande baie vitrée sur la mer, vue de l'intérieur -->
    <rect x="80" y="150" width="440" height="520" fill="url(#mer)"/>
    <!-- horizon -->
    <rect x="80" y="440" width="440" height="1.2" fill="#8c93aa" opacity=".6"/>
    <!-- port automatisé : grues au loin -->
    <g stroke="#2e3448" stroke-width="2" fill="none" opacity=".9">
      <path d="M 120 440 L 120 380 L 200 380 M 128 380 L 128 440 M 120 380 L 100 400"/>
      <path d="M 250 440 L 250 365 L 340 365 M 258 365 L 258 440 M 250 365 L 228 388"/>
      <path d="M 400 440 L 400 372 L 480 372 M 408 372 L 408 440 M 400 372 L 380 394"/>
    </g>
    <!-- lumières des grues : minuscules points -->
    <g fill="#e6e9f2">
      <circle cx="200" cy="380" r="1.4" opacity=".9"/><circle cx="340" cy="365" r="1.4" opacity=".9"/>
      <circle cx="480" cy="372" r="1.4" opacity=".9"/><circle cx="160" cy="410" r=".9" opacity=".5"/>
      <circle cx="300" cy="404" r=".9" opacity=".5"/><circle cx="440" cy="412" r=".9" opacity=".5"/>
    </g>
    <!-- reflets sur l'eau -->
    <g fill="#8c93aa">
      <rect x="190" y="470" width="20" height="1.5" opacity=".35"/><rect x="330" y="486" width="22" height="1.5" opacity=".3"/>
      <rect x="470" y="478" width="18" height="1.5" opacity=".3"/><rect x="196" y="500" width="10" height="1.5" opacity=".2"/>
      <rect x="336" y="516" width="12" height="1.5" opacity=".2"/><rect x="474" y="508" width="10" height="1.5" opacity=".2"/>
    </g>
    <!-- vitre : reflet diagonal -->
    <path d="M 80 150 L 260 150 L 80 470 Z" fill="url(#vitre)"/>
    <!-- montants de la baie -->
    <g fill="#0a0b10">
      <rect x="298" y="150" width="4" height="520"/>
      <rect x="80" y="408" width="440" height="3"/>
    </g>
    <!-- cadre de la baie -->
    <rect x="80" y="150" width="440" height="520" fill="none" stroke="#2a2d3a" stroke-width="6"/>

    <!-- silhouette : un fauteuil vide au premier plan, vu de dos, devant la baie -->
    <g fill="#050609">
      <path d="M 200 700 L 200 560 C 200 540, 215 530, 235 530 L 365 530 C 385 530, 400 540, 400 560 L 400 700 Z"/>
      <rect x="185" y="600" width="24" height="100" rx="4"/>
      <rect x="391" y="600" width="24" height="100" rx="4"/>
    </g>
    <!-- liseré lumineux sur le dossier -->
    <path d="M 205 560 C 205 545, 218 536, 235 536 L 365 536 C 382 536, 395 545, 395 560" fill="none" stroke="#3a3f55" stroke-width="1.2"/>

    <!-- score : chiffres discrets en bas de vitre, comme une projection -->
    <text x="500" y="640" text-anchor="end" fill="#b9bfd1" font-family="'DM Mono', 'Courier New', monospace" font-size="15" letter-spacing="3" opacity=".8">940</text>
    <text x="500" y="662" text-anchor="end" fill="#6b7086" font-family="'DM Mono', 'Courier New', monospace" font-size="11" letter-spacing="3" opacity=".8">412 → 703</text>

    <!-- fil de lumière horizontal, très fin, entre la baie et le titre -->
    <rect x="60" y="712" width="480" height="1" fill="url(#fil)"/>

    <!-- surtitre -->
    <text x="300" y="86" text-anchor="middle" fill="#8c93aa" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="5">UNE DARK ROMANCE</text>

    <!-- titre -->
    <text x="300" y="790" text-anchor="middle" fill="#e6e9f2" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" letter-spacing="1">Le Contrat de</text>
    <text x="300" y="852" text-anchor="middle" fill="#e6e9f2" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="6">VESPER</text>

    <!-- filet -->
    <rect x="28" y="28" width="544" height="844" fill="none" stroke="#8c93aa" stroke-opacity=".45" stroke-width="1"/>

    <!-- auteur -->
    <text x="300" y="118" text-anchor="middle" fill="#6b7086" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="4">ÉCRIT AVEC CLAUDE</text>
  </g>
</svg>
