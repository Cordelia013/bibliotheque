name: Générer les EPUB

# Régénère docs/epub/*.epub dès qu'un fichier de données change,
# et permet un lancement manuel depuis l'onglet Actions.
#
# ⚠ Ce fichier doit être déplacé vers .github/workflows/epub.yml
#   pour être pris en compte par GitHub. Voir scripts/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'docs/data-*.js'
      - 'scripts/generer_epub.py'
      - '.github/workflows/epub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer les fichiers EPUB
        run: python3 scripts/generer_epub.py

      - name: Vérifier les archives produites
        run: |
          python3 - <<'EOF'
          import zipfile, os, sys
          from xml.etree import ElementTree as ET
          dossier = 'docs/epub'
          erreurs = 0
          for f in sorted(os.listdir(dossier)):
              if not f.endswith('.epub'):
                  continue
              z = zipfile.ZipFile(os.path.join(dossier, f))
              i0 = z.infolist()[0]
              if i0.filename != 'mimetype' or i0.compress_type != zipfile.ZIP_STORED:
                  print(f'{f} : mimetype non conforme'); erreurs += 1
              if z.testzip() is not None:
                  print(f'{f} : archive corrompue'); erreurs += 1
              for n in z.namelist():
                  if n.endswith(('.xhtml', '.opf', '.xml')):
                      try:
                          ET.fromstring(z.read(n))
                      except Exception as e:
                          print(f'{f}/{n} : XML invalide ({e})'); erreurs += 1
              print(f'{f} : {len(z.namelist())} fichiers')
          sys.exit(1 if erreurs else 0)
          EOF

      - name: Publier si des fichiers ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/epub
          if git diff --staged --quiet; then
            echo "Aucun changement dans les EPUB."
          else
            git commit -m "Régénération automatique des fichiers EPUB"
            git push
          fi
